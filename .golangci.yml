# golangci-lint v2 config. Kept close to the default linter set (the repo is verified clean against it
# — `golangci-lint run ./...` reports 0 issues), so CI is genuinely green, not green-by-exclusion.
version: "2"

linters:
  # Default set: errcheck, govet, ineffassign, staticcheck, unused. Explicit for clarity.
  default: none
  enable:
    - errcheck      # unchecked errors (e.g. Close()) — the repo's main historical gap, now closed
    - govet         # go vet
    - ineffassign   # ineffectual assignments
    - staticcheck   # staticcheck + gosimple + stylecheck quickfixes
    - unused        # dead code

formatters:
  enable:
    - gofmt         # enforce gofmt (CI `make fmt` also checks this independently)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
