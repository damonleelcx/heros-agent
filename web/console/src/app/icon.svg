<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Heros">
  <!--
    The Heros mark.

    It is an H, and it is a confidence interval: two end caps, the span between them, and a point
    estimate sitting on the span. That is not a pun for its own sake. An interval with a point on it is
    the one figure this product always draws, and the figure it refuses to draw (a bare point, with no
    interval around it) is the failure the whole design exists to prevent.

    Three proportions were tried and this one was picked by rendering all of them at 16px. The dot
    carries a halo in the tile colour so it reads as its own mark rather than as a thick spot in the
    middle of the bar; the halo has to stay well clear of the caps, because when it grows the crossbar
    disappears and the H collapses into a pair of brackets.

    The tile is deliberately opaque and dark (the dark theme's background) rather than transparent. A
    transparent mark inherits the browser's tab colour, so the light theme accent would disappear
    against a dark tab strip and the dark theme accent against a light one. A fixed tile makes the
    favicon look the same in every chrome, which is the whole job of a favicon.

    Note for the next editor: this is XML, so a double hyphen cannot appear inside this comment. Naming
    a CSS custom property here silently makes the file unparseable, and a broken favicon still builds.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0a1120"/>
  <g stroke="#2ecfa8" stroke-width="2.2" stroke-linecap="round" fill="none">
    <!-- The end caps: where the interval stops. -->
    <path d="M8 8.5v15"/>
    <path d="M24 8.5v15"/>
    <!-- The span. -->
    <path d="M8 16h16"/>
  </g>
  <!-- The point estimate, haloed off the span so it reads as its own mark at 16px. -->
  <circle cx="16" cy="16" r="4" fill="#0a1120"/>
  <circle cx="16" cy="16" r="2.8" fill="#2ecfa8"/>
</svg>
