<!doctype html>
<title>Heros Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/heros.css">
<!-- 🔴 Synchronous, and BEFORE the stylesheet has painted: heros-theme.js sets the theme attribute
     before first paint. Deferred like heros-reveal.js below, the console flashes the other theme.
     The arch background is deliberately NOT loaded here — a lattice animating under a live
     conversation costs readability on the surface people actually work on, and CPU on a tab that
     stays open all day. -->
<script src="/heros-theme.js"></script>
<script src="/heros-reveal.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* 🔴 The palette lives in /heros.css, linked above, and NOT here. It used to be inline in this file;
   once the home page and the two auth pages existed, a second copy would have been a second truth and
   the one that drifts is always the one nobody is looking at. */
*{box-sizing:border-box}
body{
  margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid-line-accent) 1px,transparent 0),linear-gradient(90deg,var(--grid-line-accent) 1px,transparent 0);
  background-size:40px 40px;
}
/* ── shell ───────────────────────────────────────────────────────────────── */
.shell{max-width:56rem;margin:0 auto;padding:0 1.25rem 10rem;}
header.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;
  padding:.9rem 0;background:color-mix(in srgb,var(--canvas) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);margin-bottom:2rem;
}
.wordmark{font-family:var(--mono);font-size:.8rem;letter-spacing:.22em;color:var(--ink);font-weight:500}
.subject{
  font-family:var(--mono);font-size:.7rem;color:var(--ink-muted);
  border:1px solid var(--border);border-radius:var(--pill);padding:.25rem .7rem;
  display:flex;gap:.5rem;align-items:center;
}
.subject b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.tenant{font-family:var(--mono);font-size:.7rem;color:var(--ink-muted)}

/* ── conversation ────────────────────────────────────────────────────────── */
.stream{display:flex;flex-direction:column;gap:1.75rem}
.turn{display:flex;flex-direction:column;gap:.6rem;animation:rise var(--slow) ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}*{transition:none!important}}

.who{
  font-family:var(--mono);font-size:.625rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-muted);display:flex;align-items:center;gap:.5rem;
}
.who .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.who .face{width:22px;height:22px;border-radius:50%;display:block;
  box-shadow:0 0 0 1px var(--border), 0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.who.user .dot{background:var(--ink-muted)}
.said{max-width:var(--prose)}
.said p{margin:0 0 .7rem}
.said p:last-child{margin-bottom:0}
.said strong{color:var(--ink-strong);font-weight:600}
.said code{font-family:var(--mono);font-size:.85em;background:var(--secondary);
  padding:.1rem .35rem;border-radius:3px;color:var(--accent)}
.ask{
  font-family:var(--display);font-size:1.35rem;font-weight:300;line-height:1.4;
  color:var(--ink-strong);max-width:var(--prose);text-wrap:balance;
}

/* ── cards ───────────────────────────────────────────────────────────────── */
.card{
  border:1px solid var(--border);background:var(--card);border-radius:var(--radius);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;
  border-bottom:1px solid var(--border);background:var(--panel);
}
.card-title{font-family:var(--mono);font-size:.75rem;color:var(--ink);letter-spacing:.02em}
.card-title .k{color:var(--ink-muted)}
.card-body{padding:1rem}

.badge{
  font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.2rem .5rem;border-radius:var(--pill);border:1px solid;white-space:nowrap;
}
.b-run{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 33%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.b-gate{color:var(--gated);border-color:color-mix(in srgb,var(--gated) 33%,transparent);background:color-mix(in srgb,var(--gated) 8%,transparent)}
.b-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 33%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.b-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 33%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.b-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 33%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}

/* ── task ledger ─────────────────────────────────────────────────────────── */
.ledger{display:flex;flex-direction:column;font-family:var(--mono);font-size:.75rem}
.row{
  display:grid;grid-template-columns:1rem 1fr auto;gap:.7rem;align-items:center;
  padding:.42rem .25rem;border-bottom:1px solid var(--hairline);transition:background var(--base);
}
.row:last-child{border-bottom:0}
.row .name{color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .name{color:var(--ink)}
.row.live{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.row.live .name{color:var(--accent)}
.row.gate .name{color:var(--gated)}
.row.blocked .name{color:var(--none)}
.mark{width:1rem;text-align:center;font-size:.8rem;line-height:1}
.state{font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--none)}
.row.done .state{color:var(--ok)} .row.live .state{color:var(--accent)}
.row.gate .state{color:var(--gated)} .row.blocked .state{color:var(--none)}
.row.fail .state{color:var(--bad)} .row.fail .name{color:var(--bad)}
.depth{display:inline-block}

.spin{display:inline-block;width:9px;height:9px;border:1.5px solid color-mix(in srgb,var(--accent) 27%,transparent);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── meters ──────────────────────────────────────────────────────────────── */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.9rem;
  padding:.85rem 1rem;border-top:1px solid var(--border);background:var(--wash-1)}
.meter .lab{font-family:var(--mono);font-size:.625rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-muted);margin-bottom:.3rem}
.meter .val{font-family:var(--mono);font-size:.9rem;color:var(--ink);
  font-variant-numeric:tabular-nums}
.meter .val .of{color:var(--none);font-size:.75rem}
.bar{height:2px;background:var(--wash-3);border-radius:2px;margin-top:.4rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width var(--slow) ease}

/* ── approval ────────────────────────────────────────────────────────────── */
.gatecard{border-color:color-mix(in srgb,var(--gated) 24%,transparent)}
.gatecard .card-head{background:color-mix(in srgb,var(--gated) 6%,transparent)}
.diff{
  font-family:var(--mono);font-size:.72rem;line-height:1.65;background:var(--pit);
  border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;margin:.85rem 0;
}
.diff div{padding:0 .8rem;white-space:pre}
.diff .add{background:color-mix(in srgb,var(--ok) 6%,transparent);color:var(--ok)}
.diff .del{background:color-mix(in srgb,var(--bad) 6%,transparent);color:var(--bad)}
.diff .ctx{color:var(--none)}
.diff .hd{color:var(--ink-muted);background:var(--wash-2);padding:.35rem .8rem}

.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
button{font-family:var(--body);font-size:.8rem;font-weight:500;cursor:pointer;
  border-radius:var(--radius);padding:.5rem .95rem;transition:all var(--base);border:1px solid}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-go:hover{filter:brightness(1.1)}
.btn-no{background:transparent;color:var(--ink-muted);border-color:var(--border-strong)}
.btn-no:hover{color:var(--ink);border-color:var(--ink-muted)}
.evidence{font-family:var(--mono);font-size:.68rem;color:var(--none);margin-left:auto}

/* ── refusal ─────────────────────────────────────────────────────────────── */
.refusal{border-color:color-mix(in srgb,var(--warn) 24%,transparent)}
.refusal .card-head{background:color-mix(in srgb,var(--warn) 6%,transparent)}
.next{
  display:flex;gap:.6rem;align-items:flex-start;margin-top:.75rem;padding:.7rem .85rem;
  background:color-mix(in srgb,var(--warn) 6%,transparent);border:1px solid color-mix(in srgb,var(--warn) 20%,transparent);border-radius:var(--radius);
}
.next .lab{font-family:var(--mono);font-size:.625rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--warn);white-space:nowrap;padding-top:.15rem}
.next p{margin:0;font-size:.85rem;color:var(--ink)}

/* ── inline answer table ─────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.75rem}
.tbl th{text-align:left;font-weight:500;font-size:.625rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-muted);padding:.4rem .6rem;border-bottom:1px solid var(--border)}
.tbl td{padding:.45rem .6rem;border-bottom:1px solid var(--hairline);color:var(--ink)}
.tbl tr:last-child td{border-bottom:0}
.tbl .dim{color:var(--ink-muted)}
.tbl .miss{color:var(--warn)}
.wrap{overflow-x:auto}

/* ── composer ────────────────────────────────────────────────────────────── */
/* 🔴 The composer is FIXED, so it reserves no space and sits on top of the conversation. The last
   thing Heros said was disappearing behind the suggestion chips — worst on the reply to the message
   you just sent, which is the one you are waiting to read.
   Its height is not a constant either: the chips wrap to two or three rows depending on width, so a
   hardcoded padding is right at exactly one window size. The height is measured and published as
   --dock-h, and the shell reserves exactly that. See the ResizeObserver at the foot of this file. */
.composer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(180deg,transparent,var(--canvas) 22%);padding:2.5rem 1.25rem 1.25rem;
}
.shell{padding-bottom:calc(var(--dock-h, 12rem) + 1.5rem)}
.composer-in{max-width:56rem;margin:0 auto}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.chip{
  font-family:var(--mono);font-size:.68rem;color:var(--ink-muted);background:var(--secondary);
  border:1px solid var(--border);border-radius:var(--pill);padding:.35rem .75rem;cursor:pointer;
  transition:all var(--base);
}
.chip:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 33%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[disabled]{opacity:.45;cursor:default}
.chip[disabled]:hover{color:var(--ink-muted);border-color:var(--border);background:var(--secondary)}
/* The confirm row reuses .chip rather than introducing a button style. 🔴 Only `.go` is tinted: the
   affirmative is the one that spends money or writes, so it is the one that should be legible as a
   commitment rather than the one that looks easiest to press. */
.confirm-row{display:flex;gap:.5rem;flex-wrap:wrap}
.confirm-row .go{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 33%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.field{
  display:flex;gap:.75rem;align-items:center;background:var(--card);
  border:1px solid var(--border-strong);border-radius:var(--radius);padding:.7rem .9rem;
  transition:border-color var(--base);
}
.field:focus-within{border-color:color-mix(in srgb,var(--accent) 47%,transparent)}
.field input{
  flex:1;background:transparent;border:0;outline:0;color:var(--ink);
  font-family:var(--body);font-size:.95rem;
}
.field input::placeholder{color:var(--none)}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--radius);
  padding:.45rem .9rem;font-weight:600;font-size:.8rem;cursor:pointer}
.send:disabled{opacity:.35;cursor:not-allowed}
/* ── autonomy ────────────────────────────────────────────────────────────── */
.auto{border:1px solid var(--border);border-radius:var(--radius);padding:.85rem;margin-top:1.2rem}
.auto h4{margin:0 0 .15rem;font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-muted);font-weight:400}
.auto .now{font-size:.85rem;color:var(--ink);margin:0 0 .7rem}
.auto .now b{color:var(--accent);font-weight:500}
.auto label{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem .1rem;cursor:pointer;
  font-size:.82rem;color:var(--ink-muted)}
.auto label b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:.75rem}
.auto input[type=radio]{margin-top:.25rem;accent-color:var(--accent)}
.auto .warn{color:var(--warn);font-size:.78rem;margin:.6rem 0 0}

/* ── timeline ────────────────────────────────────────────────────────────── */
.tl{display:flex;flex-direction:column;gap:0}
.tl-row{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:baseline;
  padding:.45rem 0;border-bottom:1px solid var(--hairline);font-size:.82rem}
.tl-row:last-child{border-bottom:0}
.tl-k{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.12rem .4rem;border-radius:var(--pill);border:1px solid;white-space:nowrap}
.tl-observation{color:var(--none);border-color:color-mix(in srgb,var(--none) 33%,transparent)}
.tl-decision{color:var(--info);border-color:color-mix(in srgb,var(--info) 33%,transparent)}
.tl-failure{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 33%,transparent)}
.tl-effect{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 33%,transparent)}
.tl-when{font-family:var(--mono);font-size:.65rem;color:var(--none);white-space:nowrap}
.tl-what strong{color:var(--ink);font-weight:500}
.tl-detail{color:var(--ink-muted);font-size:.76rem;margin-top:.2rem;white-space:pre-wrap}
.tl-next{border:1px solid color-mix(in srgb,var(--gated) 20%,transparent);background:color-mix(in srgb,var(--gated) 4%,transparent);border-radius:var(--radius);
  padding:.7rem .85rem;margin-bottom:.9rem}
.tl-next.none{border-color:var(--border);background:transparent}
.tl-next b{color:var(--gated);font-weight:500}
.tl-drop{font-family:var(--mono);font-size:.65rem;color:var(--warn);margin-bottom:.6rem}

/* ── organization ────────────────────────────────────────────────────────── */
.people{width:100%;border-collapse:collapse;font-size:.8rem}
.people td,.people th{padding:.5rem .4rem;border-bottom:1px solid var(--hairline);text-align:left}
.people th{font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-muted);font-weight:400}
.people tr:last-child td{border-bottom:0}
.people .who-email{color:var(--ink)}
.people .you{color:var(--accent);font-family:var(--mono);font-size:.625rem;margin-left:.4rem}
.pick{background:var(--secondary);color:var(--ink);border:1px solid var(--border-strong);
  border-radius:var(--radius);padding:.28rem .45rem;font-family:var(--mono);font-size:.72rem}
.pick:disabled{opacity:.45}
.linky{background:none;border:0;padding:0;color:var(--ink-muted);font-family:var(--mono);
  font-size:.7rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linky:hover{color:var(--accent)}
.linky.danger:hover{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:.6rem;max-width:26rem}
.stack input{padding:.6rem .8rem;background:var(--card);color:var(--ink);
  border:1px solid var(--border-strong);border-radius:var(--radius);font-family:var(--body)}
/* It is a <button> now, not a <span>: it opens a panel, so it has to be reachable by keyboard and
   announced as a control. These rules strip the browser's button chrome without stripping the focus
   ring, which heros.css supplies. min-height keeps it a real touch target on a phone. */
.tenant{cursor:pointer;background:none;border:0;padding:.35rem .2rem;min-height:44px;
  font-family:var(--mono);font-size:.7rem;color:var(--ink-muted);text-align:right}
.tenant:hover{color:var(--accent)}
.hint{font-family:var(--mono);font-size:.625rem;color:var(--none);margin-top:.5rem;text-align:center}
.hint b{color:var(--ink-muted);font-weight:400}
  .top .homelink{display:flex;align-items:center;margin-right:.6rem}
  .top .homelink img{border-radius:var(--pill);display:block}
</style>

<div class="shell">
  <header class="top">
    <a href="/app/" class="homelink" title="Heros — back to the top of this conversation"><img src="/avatar.jpg" alt="Heros" width="28" height="28"></a>
    <span class="wordmark">HEROS</span>
    <span class="subject">acme/support-bot <b>@ rev-a41c9</b></span>
    <span class="spacer"></span>
    <span data-theme-slot></span>
    <button class="tenant" id="whoami" title="Your account and organization"></button>
  </header>
  <div class="stream" id="stream"></div>
</div>

<div class="composer">
  <div class="composer-in">
    <div class="chips" id="chips"></div>
    <div class="field">
      <input id="input" placeholder="Ask about your agent, or ask heros to change it…" autocomplete="off">
      <button class="send" id="send">Ask</button>
    </div>
    <div class="hint">Everything happens here. <b>Nineteen things I can do — ask for anything else and I will say where it is done.</b></div>
  </div>
</div>

<script>
/* console.js — talks to herosd. Nothing here is scripted; every number comes from the API. */
const stream = document.getElementById('stream');
const input  = document.getElementById('input');
const send   = document.getElementById('send');
const chips  = document.getElementById('chips');
const subjEl = document.querySelector('.subject');

const AXES = ["model","prompt","skills","context","tools","memory","harness","loop","graph"];
const el = h => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
// 🔴 Table rows are BUILT, not parsed from a string. `el()` parses into a <div>, and the HTML parser
// discards <tr>/<td> that appear outside a table — so `el('<tr>…</tr>')` silently returns null and the
// caller dereferences it. The markup was correct; the parser is not obliged to keep it where it was put.
// Same family as the mail bug next door: assert on what the consumer keeps, not on what you emitted.
const rowOf = n => {
  const tr = document.createElement('tr');
  for (let i = 0; i < n; i++) tr.appendChild(document.createElement('td'));
  return tr;
};
const scroll = () => window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
const esc = s => String(s??'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const money = mc => '$' + (mc/1e6/100).toFixed(4);

function turn(who, cls=''){
  const mine = who === 'you';
  const t = el(`<div class="turn ${cls}"><div class="who ${mine?'user':''}">${
    mine ? '<span class="dot"></span>' : '<img class="face" src="/avatar.jpg" alt="">'}${who}</div></div>`);
  stream.appendChild(t); scroll(); return t;
}
function say(t, html){ t.appendChild(el(`<div class="said">${html}</div>`)); scroll(); return t; }

async function api(path, body){
  const r = await fetch(path, body ? {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  } : {});
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch {}
    const err = new Error(msg);
    // 🔴 429 and 503 are "come back shortly", not "you got it wrong". Carried through so a caller can
    // say so — the sign-in card in particular must never let an overloaded server read as a rejected
    // password, because the next thing somebody does is reset a password that was fine.
    err.transient = (r.status === 429 || r.status === 503);
    err.retryAfter = Number(r.headers.get('Retry-After')) || 0;
    throw err;
  }
  return r.json();
}

/* ── the conversation this tab is in ──────────────────────────────────────
   🔴 The id is resolved from the SERVER, not minted here and not read from localStorage.

   The server already knows which thread this organization spoke in most recently, so asking it is the
   only answer that is right on a second device, in a second tab, and after clearing site data. A
   locally-minted id is right exactly once — on the machine that minted it — and silently forks the
   conversation everywhere else, which reads as "it forgot me" rather than as a bug.

   Minting only happens when the server says there is no thread yet. */
let conversationID = null;

function newConversationID(){
  return 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

/* ── subject ─────────────────────────────────────────────────────────────── */

let subjectLoaded = false;

function renderSubject(s){
  subjectLoaded = s.is_agent;
  subjEl.innerHTML = `${esc(shortName(s.describe))}`;
  const t = turn('heros');
  const rows = s.axes.map(a => `<tr>
      <td>${esc(a.axis)}</td>
      <td class="${a.found?'':'miss'}">${a.found ? a.spans+' spans' : 'nothing found'}</td>
      <td class="dim">${a.found ? esc(a.files)+' file(s)' : ''}</td>
      <td class="dim">${a.found ? esc(a.first) : ''}</td>
    </tr>`).join('');

  say(t, `<p>Right — I have read <strong>${esc(s.files)}</strong> files at <code>${esc(s.revision.slice(0,8))}</code>${
    s.dirty ? ' — <span style="color:var(--warn)">with uncommitted changes, so this revision does not '+
    'describe exactly what I read</span>' : ''}.
    ${s.test_files ? esc(s.test_files)+' test files were excluded: tests set temperatures and build message '+
    'lists more explicitly than production code, so assessing them describes your test suite while looking '+
    'like it describes your agent.' : ''}</p>
    <p>${s.is_agent
      ? `This is an agent, and I can work with it — <strong>${esc(s.why)}</strong>.`
      : `<strong style="color:var(--warn)">This does not look like an agent.</strong> ${esc(s.why)} `+
        `I would rather say that than give you nine findings about nothing.`}</p>`);

  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">discovered</span> nine axes</span>
      <span class="spacer"></span><span class="badge ${s.is_agent?'b-ok':'b-warn'}">${
        s.truncated ? 'sampled' : 'complete'}</span></div>
    <div class="wrap"><table class="tbl">
      <tr><th>axis</th><th>evidence</th><th>files</th><th>first</th></tr>${rows}</table></div></div>`);
  t.appendChild(card); scroll();

  if (s.is_agent) {
    /* ⚠️ This used to end "That is a read, and it costs you nothing." It was true when a keyword table
       did the routing and is not any more: reading the question is a model call. The distinction still
       worth drawing is between a QUESTION and a RUN — one is answered from what was already parsed and
       finishes, the other draws against a ceiling — so the sentence was corrected rather than dropped.
       A console that quietly starts charging for something it described as free is the worst possible
       version of this change, in a product whose whole pitch is telling people true things. */
    say(t, `<p>So: ask me about any axis and I will show you the code. That is a read — it answers from
      what I already parsed, and nothing keeps running afterwards.</p>
      <p style="color:var(--ink-muted)">Or ask me what is weak, and I will tell you what I understood
      and what it may cost before anything starts.</p>`);
  }
}

function shortName(d){
  const m = /([^/]+\/[^/@]+)\s*@\s*(\w{8})/.exec(d);
  return m ? `${m[1]} @ ${m[2]}` : d;
}

async function loadSubject(ref){
  const t = turn('heros');
  say(t, `<p>Let me read <code>${esc(ref)}</code>. One moment — I clone it and pin the revision
    before I say anything about it.</p>`);
  try {
    const s = await api('/api/subject', {ref});
    t.remove();
    renderSubject(s);
  } catch (e) {
    t.remove();
    const r = turn('heros');
    const c = el(`<div class="card refusal"><div class="card-head">
        <span class="card-title"><span class="k">could not load</span> ${esc(ref)}</span>
        <span class="spacer"></span><span class="badge b-warn">nothing was spent</span></div>
      <div class="card-body"><p style="margin:0;font-size:.9rem">${esc(e.message)}</p></div></div>`);
    r.appendChild(c); scroll();
  }
}

/* ── asking ──────────────────────────────────────────────────────────────── */

function renderAnswer(t, r){
  say(t, `<p>${esc(r.text)}</p>`);
  if (r.episodes && r.episodes.length) { renderEpisodes(t, r); return; }
  if (!r.spans || !r.spans.length) return;
  const body = r.spans.map(sp =>
    `<div class="hd">${esc(sp.ref)} — ${esc(sp.why)}</div>` +
    esc(sp.text).split('\n').map(l => `<div class="ctx">${l || ' '}</div>`).join('')
  ).join('');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">axis</span> ${esc(r.axis.axis)}</span>
      <span class="spacer"></span><span class="badge b-ok">your code · no model call</span></div>
    <div class="card-body" style="padding:0"><div class="diff" style="margin:0;border:0">${body}</div></div>
    </div>`);
  t.appendChild(card); scroll();
}

// The execution timeline: what happened, in order, with what it cost.
function renderEpisodes(t, r){
  const mark = {observation:'·', decision:'◆', failure:'✕', effect:'→'};
  const cls  = {observation:'', decision:'gate', failure:'fail', effect:'done'};
  const rows = r.episodes.map(e => `<div class="row ${cls[e.kind]||''}">
      <span class="mark">${mark[e.kind]||'·'}</span>
      <span class="name">${esc(e.summary)}${e.detail?` <span style="color:var(--none)">— ${esc(e.detail)}</span>`:''}</span>
      <span class="state">${esc(e.kind)}</span></div>`).join('');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">timeline</span> ${r.episodes.length} steps</span>
      <span class="spacer"></span><span class="badge b-ok">recorded, not re-derived</span></div>
    <div class="card-body"><div class="ledger">${rows}</div></div></div>`);
  t.appendChild(card); scroll();
}

function renderRefusal(t, r){
  const c = el(`<div class="card refusal"><div class="card-head">
      <span class="card-title"><span class="k">refused</span> ${esc(r.cause)}</span>
      <span class="spacer"></span><span class="badge b-warn">nothing was spent</span></div>
    <div class="card-body">
      ${r.text ? `<p style="margin:0;font-size:.9rem">You asked: <em>${esc(r.text)}</em></p>` : ''}
      <div class="next"><span class="lab">do this</span><p>${esc(r.next_action)}</p></div>
    </div></div>`);
  t.appendChild(c); scroll();
}

function renderRedirect(t, r){
  say(t, `<p>I will not do that from a sentence. <strong>That is done at
    <code>${esc(r.surface)}</code></strong>, which handles ${esc(r.does)}.</p>
    <p style="color:var(--ink-muted)">Connecting a repository creates a standing read grant — a credential
    I use when you are not here — and you have to see that disclosure before it is created, not after.</p>`);
}

/* ── the agent talking ─────────────────────────────────────────────────────
   `say` and `ask` are both prose and are drawn the same way. They are kept as two shapes on the wire
   because they are different acts — one ends a turn, the other is waiting for an answer — and the
   transcript has to be able to tell them apart later even though the reader cannot. */
function renderSay(t, r){
  say(t, `<p>${esc(r.text)}</p>`);
}

/* ── asking before spending or writing ─────────────────────────────────────
   🔴 The card shows the agent's OWN words for what it understood, not the capability's label. A person
   confirming "look at my repository and tell me what is weak" is confirming a category they cannot
   check; confirming "you want me to look at how this agent is prompted" is something they can catch as
   wrong. That is the entire value of asking. */
function renderConfirm(t, r){
  const cost = r.spends
    ? `<span class="badge b-warn">costs money · up to $${((r.ceiling_cents||0)/100).toFixed(2)}</span>`
    : '';
  const writes = r.writes ? `<span class="badge b-warn">changes your repository</span>` : '';
  const c = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">confirm</span> ${esc(r.intent)}${
        r.scope ? ' · ' + esc(r.scope) : ''}</span>
      <span class="spacer"></span>${cost}${writes}</div>
    <div class="card-body">
      <p style="margin:0 0 .7rem">${esc(r.text)}</p>
      <div class="confirm-row">
        <button class="chip go">Go ahead</button>
        <button class="chip no">Not that</button>
      </div>
    </div></div>`);
  t.appendChild(c); scroll();

  const decide = async (approve, btn) => {
    c.querySelectorAll('button').forEach(b => b.disabled = true);
    btn.textContent = approve ? 'starting…' : 'left alone';
    try {
      const out = await api('/api/confirm', {action_id: r.action_id, approve});
      const t2 = turn('heros');
      switch (out.kind) {
        case 'goal':     renderGoal(t2, out); break;
        case 'proposal': renderProposal(t2, out); break;
        case 'answer':   renderAnswer(t2, out); break;
        case 'refusal':  t2.remove(); renderRefusal(turn('heros'), out); break;
        default:         renderSay(t2, out);
      }
    } catch (err) {
      say(turn('heros'), `<p style="color:var(--bad)">${esc(err.message)}</p>`);
    }
  };
  c.querySelector('.go').onclick = e => decide(true, e.target);
  c.querySelector('.no').onclick = e => decide(false, e.target);
}

function renderAbstain(t, r){
  say(t, `<p>I cannot route that. Here is the whole of what I do — ${r.can_do.length} things, and this is
    the list rather than a sample:</p>
    <p style="color:var(--ink-muted);font-size:.88rem">${r.can_do.map(esc).join(' · ')}</p>`);
}

/* ── the run card ────────────────────────────────────────────────────────── */

function renderGoal(t, r){
  say(t, `<p>${r.scope
      ? `You named the <strong>${esc(r.scope)}</strong> axis, so I have scoped the run to it rather than
         assessing all nine.`
      : `That covers all nine axes — you did not narrow it, so I have not either.`}
    The plan is written down before anything is spent:
    <strong>${r.tasks.length} task${r.tasks.length===1?'':'s'}</strong>,
    ceiling <strong>$${(r.ceiling_cents/100).toFixed(2)}</strong>.</p>`);

  const rows = r.tasks.map(id =>
    `<div class="row" data-task="${esc(id)}"><span class="mark">·</span>
      <span class="name">${esc(id)}</span><span class="state">pending</span></div>`).join('');

  const card = el(`<div class="card">
    <div class="card-head">
      <span class="card-title"><span class="k">goal</span> ${esc(r.intent)}${
        r.scope ? ` <span class="k">·</span> ${esc(r.scope)}` : ''}</span>
      <span class="spacer"></span>
      <button class="linky" data-timeline>timeline</button>
      <span class="badge b-run" data-goalstate>running</span></div>
    <div class="card-body"><div class="ledger">${rows}</div></div>
    <div class="meters">
      <div class="meter"><div class="lab">tasks</div>
        <div class="val"><span data-done>0</span><span class="of"> / <span data-total>${r.tasks.length}</span></span></div>
        <div class="bar"><i data-bar-tasks></i></div></div>
      <div class="meter"><div class="lab">spend</div>
        <div class="val"><span data-cost>$0.0000</span><span class="of"> / $${(r.ceiling_cents/100).toFixed(2)}</span></div>
        <div class="bar"><i data-bar-cost></i></div></div>
      <div class="meter"><div class="lab">tokens</div><div class="val" data-tokens>0</div></div>
      <div class="meter"><div class="lab">elapsed</div><div class="val" data-elapsed>0s</div></div>
    </div></div>`);
  t.appendChild(card); scroll();

  card.querySelector('[data-timeline]').onclick = () => showTimeline(r.goal_id);

  const started = Date.now();
  const tick = setInterval(() => {
    const e = card.querySelector('[data-elapsed]');
    if (e) e.textContent = Math.round((Date.now()-started)/1000) + 's';
  }, 1000);

  const marks = {succeeded:'✓', failed:'✕', blocked:'⊘', running:'<span class="spin"></span>',
                 awaiting_approval:'⏸'};
  const cls   = {succeeded:'done', failed:'fail', blocked:'blocked', running:'live',
                 awaiting_approval:'gate'};

  const es = new EventSource(`/api/goals/${encodeURIComponent(r.goal_id)}/events`);
  const findings = [];

  es.onmessage = ev => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }

    if (e.task_id) {
      const row = card.querySelector(`[data-task="${CSS.escape(e.task_id)}"]`);
      if (row) {
        row.className = 'row ' + (cls[e.state] || '');
        row.querySelector('.mark').innerHTML = marks[e.state] || '·';
        row.querySelector('.state').textContent = e.state || '';
        if (e.detail) row.title = e.detail;
      }
      if (e.state === 'succeeded' && e.result) {
        try {
          for (const f of JSON.parse(e.result)) findings.push(f);
        } catch {}
      }
    }

    card.querySelector('[data-done]').textContent = e.done;
    /* 🔴 The DENOMINATOR moves too. It was printed once from the original plan and never updated, while
       the numerator tracked live events — so a run whose plan grew from 2 tasks to 5 displayed "4 / 2",
       a completed count larger than the total. The plan growing is a designed behaviour here (a replan
       adds tasks from what the run found), so the total is not a constant and must not be rendered as
       one. Observed in production on an improve run scoped to one axis. */
    if (e.total) card.querySelector('[data-total]').textContent = e.total;
    card.querySelector('[data-tokens]').textContent = (e.tokens||0).toLocaleString();
    card.querySelector('[data-cost]').textContent = money(e.cost_micro_cents||0);
    if (e.total) card.querySelector('[data-bar-tasks]').style.width = (e.done/e.total*100)+'%';
    const pct = (e.cost_micro_cents||0)/1e6/r.ceiling_cents*100;
    card.querySelector('[data-bar-cost]').style.width = Math.max(pct, .6)+'%';

    if (e.type === 'goal' && e.state === 'replan') {
      say(turn('heros'), `<p>The plan grew from what the run actually found — ${esc(e.detail)}.</p>`);
    }

    if (e.terminal) {
      clearInterval(tick);
      es.close();
      const badge = card.querySelector('[data-goalstate]');
      const ok = e.state === 'complete';
      badge.className = 'badge ' + (ok ? 'b-ok' : 'b-warn');
      badge.textContent = ok ? 'complete' : e.state.replace(/_/g,' ');
      reportFindings(e, findings);
    }
  };
  es.onerror = () => { clearInterval(tick); es.close(); };
}

function reportFindings(e, findings){
  const t = turn('heros');
  say(t, `<p style="font-family:var(--mono);font-size:.75rem;color:var(--ink-muted)">
    ${e.done}/${e.total} tasks · ${(e.tokens||0).toLocaleString()} tokens · ${money(e.cost_micro_cents||0)}</p>`);

  const actionable = findings.filter(f => f.actionable);
  if (!findings.length) {
    say(t, `<p>${esc(e.detail || 'The run ended without producing findings.')}</p>`);
    return;
  }
  const rows = findings.map(f => `<tr>
      <td>${esc(f.axis)}</td>
      <td class="${f.actionable?'':'dim'}">${f.actionable ? 'actionable' : 'noted'}</td>
      <td>${esc(f.weakness)}</td></tr>`).join('');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">findings</span> ${findings.length}</span>
      <span class="spacer"></span><span class="badge ${actionable.length?'b-warn':'b-ok'}">${
        actionable.length} actionable</span></div>
    <div class="wrap"><table class="tbl">
      <tr><th>axis</th><th></th><th>weakness</th></tr>${rows}</table></div></div>`);
  t.appendChild(card); scroll();

  if (e.detail && e.state !== 'complete') {
    say(t, `<p style="color:var(--ink-muted)">${esc(e.detail)}</p>`);
  }
}

/* ── a Tier-C change, waiting for a person ──────────────────────────────── */

function renderProposal(t, r){
  say(t, `<p>I have written the change but <strong>not applied it</strong>. It touches
    <code>${esc(r.ref)}</code> on the <strong>${esc(r.scope)}</strong> axis.</p>
    ${r.text ? `<p style="color:var(--ink-muted)">${esc(r.text)}</p>` : ''}`);

  const body = r.diff.split('\n').filter(Boolean).map(line => {
    const cls = line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@') ? 'hd'
              : line.startsWith('+') ? 'add'
              : line.startsWith('-') ? 'del' : 'ctx';
    return `<div class="${cls}">${esc(line)}</div>`;
  }).join('');

  const card = el(`<div class="card gatecard">
    <div class="card-head">
      <span class="card-title"><span class="k">waiting for you</span> ${esc(r.scope)} · ${esc(r.path)}</span>
      <span class="spacer"></span><span class="badge b-gate">needs approval</span></div>
    <div class="card-body">
      <div class="diff">${body}</div>
      <div class="actions">
        <button class="btn-go" data-approve>Approve and commit to a branch</button>
        <button class="btn-no" data-decline>Not this one</button>
        <span class="evidence">key ${esc((r.idempotency_key||'').slice(0,24))}… — a retry reuses it</span>
      </div>
    </div></div>`);
  t.appendChild(card); scroll();

  const actions = card.querySelector('.actions');
  const badge = card.querySelector('.card-head .badge');

  async function decide(approve){
    actions.innerHTML = `<span class="evidence">${approve ? 'applying…' : 'discarding…'}</span>`;
    try {
      const d = await api('/api/decide', {change_id: r.change_id, approve});
      if (!d.applied) {
        badge.className = 'badge b-bad'; badge.textContent = approve ? 'not applied' : 'declined';
        actions.innerHTML = `<span class="badge b-bad">${approve?'not applied':'declined'}</span>
          <span class="evidence">${esc(d.message)}</span>`;
        return;
      }
      badge.className = 'badge b-ok'; badge.textContent = 'committed';
      actions.innerHTML = `<span class="badge b-ok">${esc(d.branch)} · ${esc(d.commit)}</span>
        <span class="evidence">nothing was pushed</span>`;
      const t2 = turn('heros');
      say(t2, `<p>Committed to <code>${esc(d.branch)}</code> as <code>${esc(d.commit)}</code>.
        <strong>Nothing has been pushed.</strong> I do not hold a credential for your repository, and I
        would rather hand you the command than keep one:</p>
        <div class="diff"><div class="ctx">${esc(d.push)}</div></div>
        <p style="color:var(--ink-muted)">Open the pull request yourself when you are ready.
        <code>git checkout -</code> takes you back if you would rather not.</p>`);
    } catch (e) {
      actions.innerHTML = `<span class="evidence" style="color:var(--bad)">${esc(e.message)}</span>`;
    }
  }
  card.querySelector('[data-approve]').onclick = () => decide(true);
  card.querySelector('[data-decline]').onclick = () => decide(false);
}


/* ── finding a repository reference in a sentence ────────────────────────── */

/* repoRef pulls a repository out of whatever was typed, or returns null.
 *
 * 🔴 Ordered most specific first, and deliberately CONSERVATIVE about the bare `owner/name` shorthand.
 * That shape is also how people write file paths, fractions and dates, so it is accepted only when it
 * is the entire message — exactly the rule that applied before. A full URL or a `github.com/...` is
 * unambiguous, so that one is found anywhere in the sentence.
 *
 * A leading path (`./thing`, `~/thing`, `/thing`) likewise stays a whole-message rule: "look at /api
 * and tell me what is weak" names a directory inside a question, and loading it as the subject would
 * be answering a question nobody asked.
 */
function repoRef(text){
  const url = text.match(/\bhttps?:\/\/github\.com\/([\w.-]+\/[\w.-]+?)(?:\.git)?(?=[\s,;)\]]|\/?$)/i);
  if (url) return url[1];
  const bare = text.match(/\bgithub\.com\/([\w.-]+\/[\w.-]+?)(?:\.git)?(?=[\s,;)\]]|\/?$)/i);
  if (bare) return bare[1];
  const only = text.trim();
  if (/\s/.test(only)) return null;
  if (/^[.~/]/.test(only)) return only;
  if (/^[\w.-]+\/[\w.-]+$/.test(only)) return only;
  return null;
}

/* ── input ───────────────────────────────────────────────────────────────── */

let busy = false;
async function ask(text){
  text = (text||'').trim();
  if (busy || !text) return;
  busy = true; send.disabled = true; input.value = '';
  const you = turn('you');
  you.appendChild(el(`<div class="ask">${esc(text)}</div>`));

  // A path or a repository link loads a subject rather than asking a question.
  //
  // 🔴 The reference is EXTRACTED from the sentence, not matched against the whole of it. This used to
  // require the message to be nothing but the reference — `!/\s/.test(text)` — so pasting a link with
  // any words around it fell through to /api/ask, which correctly abstained, and the person was shown
  // the list of nineteen things none of which is "load this repository". The reference was right there
  // in the message and the answer was "I cannot route that".
  //
  // Typing a sentence around a link is what people actually do, so the sentence is where we look.
  const ref = repoRef(text);
  if (ref) {
    await loadSubject(ref);
    busy = false; send.disabled = false; input.focus();
    return;
  }

  const t = turn('heros');
  try {
    if (!conversationID) conversationID = newConversationID();
    const r = await api('/api/ask', {text, conversation_id: conversationID});
    switch (r.kind) {
      case 'say':
      case 'ask':      renderSay(t, r); break;
      case 'confirm':  t.remove(); renderConfirm(turn('heros'), r); break;
      case 'answer':   renderAnswer(t, r); break;
      case 'goal':     renderGoal(t, r); break;
      case 'proposal': renderProposal(t, r); break;
      case 'refusal':  t.remove(); renderRefusal(turn('heros'), r); break;
      case 'redirect': renderRedirect(t, r); break;
      default:         renderAbstain(t, r); break;
    }
  } catch (err) {
    say(t, `<p style="color:var(--bad)">${esc(err.message)}</p>`);
  }
  busy = false; send.disabled = false; input.focus();
}

const SUGGESTIONS = [
  'what tools does this agent have?',
  'what does this node remember between calls?',
  'look at my repo and tell me what is weak',
  'keep improving until it is perfect',
  'change the model on this node',
  'what happened in that run?',
  'connect my other repo',
];
SUGGESTIONS.forEach(label => {
  const c = el(`<button class="chip">${esc(label)}</button>`);
  c.onclick = () => ask(label);
  chips.appendChild(c);
});

send.onclick = () => ask(input.value);
input.onkeydown = e => { if (e.key === 'Enter') ask(input.value); };

/* ── signing in ──────────────────────────────────────────────────────────── */

function askToSignIn(){
  /* 🔴 A LINK to /signin/, not an inline form and not an automatic redirect.
     Inline: there is a real sign-in page now, and two sign-in forms is two places for the next change
     to be made in only one of them.
     Automatic: the two callers that matter — an expired invitation, and a password just changed —
     have both put something on screen that the person needs to read. Redirecting on a timer either
     cuts that off or makes them wait for it. A button lets them read it and go when ready. */
  const t = turn('heros');
  say(t, `<p>Sign in to continue. Everything you load and every run you start belongs to your
    organization and is visible to nobody else.</p>`);
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">sign in</span></span>
      <span class="spacer"></span><span class="badge b-gate">required</span></div>
    <div class="card-body">
      <div class="actions">
        <a class="btn-go" href="/signin/" style="text-decoration:none">Go to sign in</a>
        <a class="linky" href="/signup/">or create an organization</a>
      </div>
    </div></div>`);
  t.appendChild(card); scroll();
}

/* ── timeline ────────────────────────────────────────────────────────────── */

// showTimeline answers "what happened, why, when, what next" for one run.
//
// 🔴 What-next is rendered FIRST, above the history. The history is what somebody reads once; what the
// run is waiting for is what they came to find out — and if it is waiting on a person, that is the only
// line on the page they can act on. Burying it under four hundred episodes is the same as not having it.
async function showTimeline(goalID){
  const t = turn('heros');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">timeline</span> ${esc(goalID)}</span>
      <span class="spacer"></span><span class="badge b-run" data-tlstate>reading</span></div>
    <div class="card-body"><p style="margin:0;color:var(--ink-muted);font-size:.85rem">reading the record…</p></div>
  </div>`);
  t.appendChild(card); scroll();
  const body = card.querySelector('.card-body');
  const badge = card.querySelector('[data-tlstate]');

  let tl;
  try {
    tl = await api(`/api/goals/${encodeURIComponent(goalID)}/timeline`);
  } catch (e) {
    badge.className = 'badge b-bad'; badge.textContent = 'unavailable';
    body.innerHTML = ''; note(body, e.message, 'bad');
    return;
  }

  const STATE_CLASS = {running:'b-run', succeeded:'b-ok', failed:'b-bad', cancelled:'b-bad',
                       refused:'b-bad', paused:'b-warn', draft:'b-gate'};
  badge.className = 'badge ' + (STATE_CLASS[tl.goal.state] || 'b-gate');
  badge.textContent = tl.goal.state;
  body.innerHTML = '';

  // ── what next ──────────────────────────────────────────────────────────
  const waiting = (tl.next || []).filter(n => n.needs_a_person);
  const nextBox = el(`<div class="tl-next${(tl.next||[]).length ? '' : ' none'}"></div>`);
  if (!(tl.next || []).length) {
    const done = ['succeeded','failed','cancelled','refused'].includes(tl.goal.state);
    nextBox.textContent = done
      ? `Nothing left — this run is ${tl.goal.state}.`
      : 'Nothing is outstanding, and the run has not finished. It should move on the next pass.';
  } else {
    const head = document.createElement('div');
    head.innerHTML = waiting.length
      ? `<b>${waiting.length} task${waiting.length===1?'':'s'} waiting for a person.</b> Nothing here moves until somebody answers.`
      : `${tl.next.length} task${tl.next.length===1?'':'s'} outstanding.`;
    nextBox.appendChild(head);
    for (const n of tl.next) {
      const row = document.createElement('div');
      row.style.cssText = 'margin-top:.45rem;font-size:.8rem;color:var(--ink-muted)';
      // textContent for the parts that came from a plan somebody else wrote.
      const name = document.createElement('code'); name.textContent = n.task_id;
      row.appendChild(name);
      row.appendChild(document.createTextNode(' — ' + n.why));
      nextBox.appendChild(row);
    }
  }
  body.appendChild(nextBox);

  // 🔴 Truncation is stated, never silent. A shortened history that does not say it is shortened reads
  // as the whole story, which is how somebody concludes a run did nothing untoward.
  if (tl.dropped) {
    const d = el(`<div class="tl-drop"></div>`);
    d.textContent = `${tl.dropped} earlier entr${tl.dropped===1?'y':'ies'} not shown. ` +
      `Failures and effects are kept first, so what broke and what changed are still here.`;
    body.appendChild(d);
  }

  // ── what happened ──────────────────────────────────────────────────────
  if (!(tl.entries || []).length) {
    note(body, 'Nothing has been recorded for this run yet.');
  } else {
    const list = el(`<div class="tl"></div>`);
    for (const e of tl.entries) {
      const row = el(`<div class="tl-row"></div>`);
      const kind = el(`<span class="tl-k tl-${esc(e.kind)}"></span>`);
      kind.textContent = e.kind;
      const what = document.createElement('div');
      what.className = 'tl-what';
      const line = document.createElement('div');
      const strong = document.createElement('strong');
      strong.textContent = e.summary;
      line.appendChild(strong);
      if (e.task_id) {
        const tag = document.createElement('span');
        tag.style.cssText = 'color:var(--none);font-family:var(--mono);font-size:.68rem;margin-left:.5rem';
        tag.textContent = e.task_id;
        line.appendChild(tag);
      }
      what.appendChild(line);
      if (e.detail) {
        const d = document.createElement('div');
        d.className = 'tl-detail';
        d.textContent = e.detail;
        what.appendChild(d);
      }
      if (e.summarised) {
        const s2 = document.createElement('div');
        s2.className = 'tl-detail';
        s2.style.color = 'var(--none)';
        // The episode is deliberately kept after being summarised, so that "what did the summary leave
        // out" stays answerable. Saying so is the point of showing the marker at all.
        s2.textContent = 'covered by a later summary — kept so nothing is lost to compression';
        what.appendChild(s2);
      }
      const when = el(`<span class="tl-when"></span>`);
      when.textContent = new Date(e.at).toLocaleTimeString('en-US', {hour12:false});
      when.title = new Date(e.at).toLocaleString('en-US');
      row.appendChild(kind); row.appendChild(what); row.appendChild(when);
      list.appendChild(row);
    }
    body.appendChild(list);
  }

  const foot = el(`<div class="tl-drop" style="color:var(--none);margin:.8rem 0 0"></div>`);
  foot.textContent = `${tl.goal.done}/${tl.goal.total} tasks · iteration ${tl.goal.iteration}` +
    (tl.goal.stalled ? ' · stalled: nothing is claimable and nothing is running' : '');
  body.appendChild(foot);
  scroll();
}

/* ── the organization ────────────────────────────────────────────────────── */

// `me` is the server's answer about who is signed in and what they may do.
//
// 🔴 The console renders its controls from `me.can`, which the server computes from the one capability
// table. It deliberately holds no copy of the rules: a second implementation in JavaScript would
// disagree with the real one eventually, and the way it disagrees is a button that appears and then
// refuses — which reads to the person as the product being broken rather than as them lacking
// permission. When in doubt the server refuses anyway; this only decides what is worth showing.
let me = null;

const ROLE_BLURB = {
  owner:  'runs the organization; can appoint other owners',
  admin:  'invites people and changes roles; cannot appoint owners',
  member: 'loads repositories, starts runs, approves changes',
  viewer: 'reads runs and history; cannot start or approve anything',
};

async function refreshMe(){
  try { me = await api('/api/auth/status'); } catch { me = null; }
  const who = document.getElementById('whoami');
  if (me && me.signed_in) {
    who.textContent = `${me.email} · ${me.role}`;
    who.title = 'Show this organization';
  } else {
    who.textContent = '';
    who.title = '';
  }
  return me;
}

function openOrganization(){
  if (!me || !me.signed_in) return;
  const t = turn('heros');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">organization</span> ${esc(me.tenant)}</span>
      <span class="spacer"></span><span class="badge b-run">${esc(me.role)}</span></div>
    <div class="card-body"><p style="margin:0;color:var(--ink-muted);font-size:.85rem">loading…</p></div>
  </div>`);
  t.appendChild(card); scroll();
  renderOrganization(card);
}

async function renderOrganization(card){
  const body = card.querySelector('.card-body');
  let people, pending = {invitations: []};
  try {
    people = await api('/api/members');
    if (me.can['member.invite']) pending = await api('/api/invitations');
  } catch (e) {
    body.innerHTML = `<p style="margin:0;color:var(--bad)">${esc(e.message)}</p>`;
    return;
  }
  body.innerHTML = '';

  /* ── your own account ─────────────────────────────────────────────────────
     🔴 Added because this panel described the ORGANIZATION and nothing described the person reading
     it. In particular there was NO WAY TO SIGN OUT anywhere in the product: /api/auth/logout existed
     and nothing called it. On a shared machine that is not a missing convenience, it is a session that
     stays valid for fourteen days because the only way to end it was to know the endpoint. */
  const mine = el(`<div class="auto"><h4>your account</h4></div>`);
  const row = el(`<div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;
      color:var(--ink-muted);font-size:.87rem;margin-bottom:.7rem"></div>`);
  row.appendChild(el(`<span style="color:var(--ink)">${esc(me.email)}</span>`));
  row.appendChild(el(`<span class="badge b-run">${esc(me.role)}</span>`));
  row.appendChild(el(me.email_verified
    ? `<span class="badge b-ok">address confirmed</span>`
    : `<span class="badge b-warn">address unconfirmed</span>`));
  mine.appendChild(row);

  const acts = el(`<div class="actions"></div>`);
  /* Changing a password goes through the emailed link rather than a field here. There is no
     change-password endpoint, and inventing one that trusts an existing session would be a weaker
     path to the same result: anybody who found an unlocked laptop could change the password without
     knowing it. The reset link proves control of the address. */
  const pw = el(`<button class="linky">Change your password</button>`);
  pw.onclick = async () => {
    pw.disabled = true;
    try {
      const r = await api('/api/auth/password/forgot', {email: me.email});
      note(mine, r.status || 'A link is on its way.', 'ok');
    } catch (e) { note(mine, e.message, 'bad'); pw.disabled = false; }
  };
  acts.appendChild(pw);

  if (!me.email_verified && me.mail_configured !== false) {
    const rs = el(`<button class="linky">Resend the confirmation</button>`);
    rs.onclick = async () => {
      rs.disabled = true;
      try { const r = await api('/api/auth/email/resend', {}); note(mine, r.status || 'Sent.', 'ok'); }
      catch (e) { note(mine, e.message, 'bad'); rs.disabled = false; }
    };
    acts.appendChild(rs);
  }

  const out = el(`<button class="linky" style="color:var(--bad)">Sign out</button>`);
  out.onclick = async () => {
    out.disabled = true;
    try { await api('/api/auth/logout', {}); } catch (_) { /* ending a session locally either way */ }
    location.href = '/signin/';
  };
  acts.appendChild(out);
  mine.appendChild(acts);
  body.appendChild(mine);

  const table = el(`<table class="people"><thead><tr>
      <th>person</th><th>role</th><th></th></tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  // An organization must always keep an owner. The server refuses the last one being removed or demoted
  // and says why; not offering it is the difference between a rule and a trap.
  const owners = (people.members || []).filter(m => m.role === 'owner');
  const isLastOwner = m => m.role === 'owner' && owners.length === 1;
  for (const m of (people.members || [])) {
    const row = rowOf(3);
    const [nameCell, roleCell, actionCell] = row.children;
    actionCell.style.textAlign = 'right';

    // textContent, not interpolation — an address is data somebody else chose.
    const name = document.createElement('span');
    name.className = 'who-email';
    name.textContent = m.email;
    nameCell.appendChild(name);
    if (m.id === people.you) nameCell.appendChild(el(`<span class="you">you</span>`));
    if (!m.email_verified) {
      nameCell.appendChild(el(`<span class="you" style="color:var(--warn)">unconfirmed</span>`));
    }

    if (me.can['member.manage']) {
      const pick = document.createElement('select');
      pick.className = 'pick';
      for (const r of ['owner','admin','member','viewer']) {
        const opt = document.createElement('option');
        opt.value = r; opt.textContent = r; opt.selected = (r === m.role);
        // Only an owner may create an owner. The server enforces it; disabling the option keeps
        // somebody from choosing a thing that was always going to be refused.
        if (r === 'owner' && !me.can['org.transfer']) opt.disabled = true;
        pick.appendChild(opt);
      }
      // An admin cannot act on an owner at all, and nobody can demote the last one.
      if (m.role === 'owner' && !me.can['org.transfer']) pick.disabled = true;
      if (isLastOwner(m)) {
        pick.disabled = true;
        pick.title = 'Appoint another owner first — an organization must always have one.';
      }
      pick.onchange = async () => {
        const chosen = pick.value;
        try {
          await api('/api/members/role', {user_id: m.id, role: chosen});
          await refreshMe();
          renderOrganization(card);
        } catch (e) {
          pick.value = m.role;
          note(body, e.message, 'bad');
        }
      };
      roleCell.appendChild(pick);

      if (!(m.role === 'owner' && !me.can['org.transfer']) && !isLastOwner(m)) {
        const rm = el(`<button class="linky danger">remove</button>`);
        rm.onclick = async () => {
          if (!confirm(`Remove ${m.email} from ${me.tenant}? Their sessions end immediately.`)) return;
          try {
            await api('/api/members/remove', {user_id: m.id});
            renderOrganization(card);
          } catch (e) { note(body, e.message, 'bad'); }
        };
        actionCell.appendChild(rm);
      }
    } else {
      roleCell.textContent = m.role;
    }
    tbody.appendChild(row);
  }
  body.appendChild(table);

  if ((pending.invitations || []).length) {
    body.appendChild(el(`<p style="margin:1.1rem 0 .4rem;font-family:var(--mono);font-size:.625rem;
      letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)">invited, not yet accepted</p>`));
    const inv = el(`<table class="people"><tbody></tbody></table>`);
    for (const i of pending.invitations) {
      const row = rowOf(3);
      row.children[2].style.textAlign = 'right';
      row.children[0].textContent = i.email;
      row.children[1].textContent = i.expired ? `${i.role} · expired` : i.role;
      const w = el(`<button class="linky danger">withdraw</button>`);
      w.onclick = async () => {
        try { await api('/api/invitations/revoke', {id: i.id}); renderOrganization(card); }
        catch (e) { note(body, e.message, 'bad'); }
      };
      row.children[2].appendChild(w);
      inv.querySelector('tbody').appendChild(row);
    }
    body.appendChild(inv);
  }

  if (me.can['member.invite']) {
    const form = el(`<div style="margin-top:1.2rem">
      <div class="stack">
        <input id="invemail" type="email" placeholder="colleague@example.com" autocomplete="off">
        <select class="pick" id="invrole" style="align-self:flex-start">
          <option value="member" selected>member — ${esc(ROLE_BLURB.member)}</option>
          <option value="admin">admin — ${esc(ROLE_BLURB.admin)}</option>
          <option value="viewer">viewer — ${esc(ROLE_BLURB.viewer)}</option>
        </select>
        <div class="actions"><button class="btn-go" id="invsend">Send invitation</button>
          <span class="evidence" id="invmsg"></span></div>
      </div></div>`);
    body.appendChild(form);
    wirePasswordReveals(form);  // rendered after DOMContentLoaded, so wire it explicitly
    // 🚫 No "owner" option. Ownership is transferred to somebody who already has an account, in the
    // table above — never by a link in an email, which travels through a mailbox this organization does
    // not control. The server and the database both refuse it too.
    if (me.mail_configured === false) {
      form.querySelector('#invsend').disabled = true;
      note(form, 'This deployment cannot send mail, so invitations are unavailable. An operator needs ' +
        'to configure SMTP and restart.', 'warn');
    }
    const send = async () => {
      const msg = form.querySelector('#invmsg');
      msg.style.color = 'var(--none)'; msg.textContent = 'sending…';
      try {
        await api('/api/members/invite', {
          email: form.querySelector('#invemail').value,
          role:  form.querySelector('#invrole').value,
        });
        form.querySelector('#invemail').value = '';
        renderOrganization(card);
      } catch (e) { msg.style.color = 'var(--bad)'; msg.textContent = e.message; }
    };
    form.querySelector('#invsend').onclick = send;
    form.querySelector('#invemail').onkeydown = e => { if (e.key === 'Enter') send(); };
  }

  await renderAutonomy(body);
}

// renderAutonomy shows how much a run may do without a person, and lets an owner change it.
//
// 🔴 Everybody sees it, only an owner can change it — and which of those applies comes from the server's
// `may_change`, not from the console's own reading of the role. A second implementation of the rule here
// would eventually disagree with the real one, and the way it disagrees is a control that appears and
// then refuses.
async function renderAutonomy(body){
  let a;
  try { a = await api('/api/autonomy'); } catch { return; }

  const box = el(`<div class="auto"><h4>autonomy</h4></div>`);
  const now = el(`<p class="now"></p>`);
  now.innerHTML = `Runs are <b>${esc(a.level)}</b> — ${esc(a.describes)}`;
  box.appendChild(now);

  if (a.may_change) {
    const name = 'autonomy-' + Math.random().toString(36).slice(2);
    for (const c of a.choices) {
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio'; radio.name = name; radio.value = c.level;
      radio.checked = c.level === a.level;
      const text = document.createElement('span');
      const b = document.createElement('b'); b.textContent = c.level;
      text.appendChild(b);
      text.appendChild(document.createTextNode(' — ' + c.describes));
      label.appendChild(radio); label.appendChild(text);
      radio.onchange = async () => {
        try {
          await api('/api/autonomy', {level: c.level});
          renderOrganization(box.closest('.card'));
        } catch (e) {
          radio.checked = false;
          note(box, e.message, 'bad');
        }
      };
      box.appendChild(label);
    }
    // 🔴 Said plainly at the moment of choosing, not buried in documentation. This is the setting that
    // decides whether the product writes to their repository with nobody watching.
    const warn = el(`<p class="warn"></p>`);
    warn.textContent = 'Under “autonomous” a run can open pull requests against your repository ' +
      'without asking. Every one is still recorded, and the record says nobody was asked.';
    box.appendChild(warn);
  }
  body.appendChild(box);
}

function note(parent, text, kind='none'){
  const colour = {bad:'var(--bad)', warn:'var(--warn)', ok:'var(--ok)', none:'var(--ink-muted)'}[kind];
  const p = el(`<p style="margin:.7rem 0 0;font-size:.8rem;color:${colour}"></p>`);
  p.textContent = text;
  parent.appendChild(p); scroll();
  return p;
}

/* ── links that arrive by mail ───────────────────────────────────────────── */

// takeToken reads a one-time token out of the address bar AND removes it.
//
// 🔴 Removed immediately, before anything else runs. A token left in the address bar goes into browser
// history, into a screenshot, into the URL somebody pastes into a bug report — and into the Referer
// header of any request the page makes afterwards. It is single-use and short-lived, which is the real
// defence; this is the cheap half of it.
function takeToken(name){
  const params = new URLSearchParams(location.search);
  const token = params.get(name);
  if (!token) return null;
  params.delete(name);
  const rest = params.toString();
  history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
  return token;
}

function acceptInvitationCard(token){
  const t = turn('heros');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">invitation</span></span>
      <span class="spacer"></span><span class="badge b-gate">checking</span></div>
    <div class="card-body"><p style="margin:0;color:var(--ink-muted);font-size:.85rem">reading your invitation…</p></div>
  </div>`);
  t.appendChild(card); scroll();
  const body = card.querySelector('.card-body');
  const badge = card.querySelector('.badge');

  (async () => {
    let info;
    try {
      const r = await fetch('/api/auth/invitation?token=' + encodeURIComponent(token));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
      info = j;
    } catch (e) {
      badge.className = 'badge b-bad'; badge.textContent = 'expired';
      body.innerHTML = '';
      note(body, e.message + ' Ask whoever invited you to send another one.', 'bad');
      askToSignIn();
      return;
    }
    const inv = info.invitation;
    badge.className = 'badge b-run'; badge.textContent = inv.role;
    body.innerHTML = '';
    const intro = el(`<p style="margin:0 0 .9rem;font-size:.9rem"></p>`);
    intro.textContent = (inv.invited_by ? `${inv.invited_by} invited you` : 'You have been invited') +
      ` to join ${inv.org_name} as ${inv.role} — ${ROLE_BLURB[inv.role] || ''}. ` +
      `Choose a password for ${inv.email}.`;
    body.appendChild(intro);
    const form = el(`<div class="stack">
        <input id="np" type="password" placeholder="a password you have not used elsewhere"
          autocomplete="new-password">
        <div class="actions"><button class="btn-go" id="go">Join ${esc(inv.org_name)}</button>
          <span class="evidence" id="m"></span></div>
      </div>`);
    body.appendChild(form);
    wirePasswordReveals(form);  // rendered after DOMContentLoaded, so wire it explicitly
    note(form, `At least ${info.min_password_length} characters. Length is the only rule — it is the ` +
      `property that actually costs an attacker anything.`);

    const go = async () => {
      const msg = form.querySelector('#m');
      msg.style.color = 'var(--none)'; msg.textContent = 'joining…';
      try {
        await api('/api/auth/invitation/accept', {token, password: form.querySelector('#np').value});
        badge.className = 'badge b-ok'; badge.textContent = 'joined';
        body.innerHTML = '';
        note(body, `Welcome to ${inv.org_name}.`, 'ok');
        await refreshMe();
        start();
      } catch (e) {
        // A refusal here is two sentences saying the link is still good — it must be readable, or
        // somebody goes and asks for a replacement invitation they do not need.
        msg.textContent = '';
        body.querySelectorAll('.said-error').forEach(n => n.remove());
        note(body, e.message, 'bad').classList.add('said-error');
      }
    };
    form.querySelector('#go').onclick = go;
    form.querySelector('#np').onkeydown = e => { if (e.key === 'Enter') go(); };
    form.querySelector('#np').focus();
  })();
}

function resetPasswordCard(token){
  const t = turn('heros');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">new password</span></span>
      <span class="spacer"></span><span class="badge b-gate">one use</span></div>
    <div class="card-body"><div class="stack">
      <input id="np" type="password" placeholder="a password you have not used elsewhere"
        autocomplete="new-password">
      <div class="actions"><button class="btn-go" id="go">Set password</button>
        <span class="evidence" id="m"></span></div>
    </div></div></div>`);
  t.appendChild(card); scroll();
  const body = card.querySelector('.card-body');
  note(body, 'Setting a new password also signs you out everywhere else, so a session somebody ' +
    'else is holding ends immediately.');

  const go = async () => {
    const msg = card.querySelector('#m');
    msg.style.color = 'var(--none)'; msg.textContent = 'saving…';
    try {
      const r = await api('/api/auth/password/reset', {token, password: card.querySelector('#np').value});
      card.querySelector('.badge').className = 'badge b-ok';
      card.querySelector('.badge').textContent = 'changed';
      body.innerHTML = '';
      note(body, r.status, 'ok');
      // 🔴 No session was issued by the reset, deliberately — a forwarded link must not become a login.
      // So the next thing is signing in with the password just chosen.
      askToSignIn();
    } catch (e) {
      // A refusal here says the link is still good and when to come back — the last card that should
      // swallow its message into a span sized for "saving…".
      msg.textContent = '';
      body.querySelectorAll('.said-error').forEach(n => n.remove());
      note(body, e.message, 'bad').classList.add('said-error');
    }
  };
  card.querySelector('#go').onclick = go;
  card.querySelector('#np').onkeydown = e => { if (e.key === 'Enter') go(); };
  card.querySelector('#np').focus();
}

function forgotPasswordCard(){
  const t = turn('heros');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">forgotten password</span></span></div>
    <div class="card-body"><div class="stack">
      <input id="fe" type="email" placeholder="you@example.com" autocomplete="username">
      <div class="actions"><button class="btn-go" id="go">Send a link</button>
        <span class="evidence" id="m"></span></div>
    </div></div></div>`);
  t.appendChild(card); scroll();
  const go = async () => {
    const msg = card.querySelector('#m');
    msg.style.color = 'var(--none)'; msg.textContent = 'sending…';
    try {
      const r = await api('/api/auth/password/forgot', {email: card.querySelector('#fe').value});
      card.querySelector('.card-body').innerHTML = '';
      // 🔴 The server answers identically whether or not that address has an account, and so does this.
      // Saying "we sent it" only when the address is real would answer, for anybody who asks, whether a
      // given person has an account here.
      note(card.querySelector('.card-body'), r.status, 'ok');
    } catch (e) {
      // 🔴 Into a paragraph, not the `.evidence` span. That span is sized for "checking…"; the refusal
      // this endpoint gives when it is rate-limited is two sentences of advice — "the link you already
      // asked for still works, check your spam folder" — and advice nobody can read is advice nobody
      // takes, which turns a limit into a support ticket. The form stays, so a different address can be
      // tried without starting over.
      msg.textContent = '';
      card.querySelectorAll('.said-error').forEach(n => n.remove());
      note(card.querySelector('.card-body'), e.message, 'bad').classList.add('said-error');
    }
  };
  card.querySelector('#go').onclick = go;
  card.querySelector('#fe').onkeydown = e => { if (e.key === 'Enter') go(); };
  card.querySelector('#fe').focus();
}

// unconfirmedBanner offers to send a confirmation link.
//
// 🚫 It does not block anything, and says so. An unconfirmed address is a fact about whether mail
// reaches somebody — gating a session on it would turn a mail outage into a lockout, including for the
// one account that could fix the mail.
function unconfirmedBanner(){
  if (!me || me.email_verified !== false || me.mail_configured === false) return;
  const t = turn('heros');
  const card = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">address</span> ${esc(me.email)}</span>
      <span class="spacer"></span><span class="badge b-warn">unconfirmed</span></div>
    <div class="card-body">
      <p style="margin:0 0 .8rem;font-size:.85rem;color:var(--ink-muted)">Nothing is blocked by this.
      Confirming the address is how we know a password reset would actually reach you.</p>
      <div class="actions"><button class="btn-go" id="go">Send a confirmation link</button>
        <span class="evidence" id="m"></span></div>
    </div></div>`);
  t.appendChild(card); scroll();
  card.querySelector('#go').onclick = async () => {
    const msg = card.querySelector('#m');
    msg.style.color = 'var(--none)'; msg.textContent = 'sending…';
    try {
      const r = await api('/api/auth/email/resend', {});
      card.querySelector('.card-body').innerHTML = '';
      note(card.querySelector('.card-body'), r.status, 'ok');
    } catch (e) {
      msg.textContent = '';
      const b = card.querySelector('.card-body');
      b.querySelectorAll('.said-error').forEach(n => n.remove());
      note(b, e.message, 'bad').classList.add('said-error');
    }
  };
}

async function confirmAddress(token){
  const t = turn('heros');
  try {
    const r = await api('/api/auth/email/verify', {token});
    say(t, `<p><strong>${esc(r.email)}</strong> is confirmed.</p>`);
  } catch (e) {
    say(t, `<p style="color:var(--bad)">${esc(e.message)} You can ask for another link from the console
      once you are signed in.</p>`);
  }
}

/* ── opening ─────────────────────────────────────────────────────────────── */
/* ── rebuilding the thread ────────────────────────────────────────────────
   🔴 A refresh used to empty the conversation: the stream lived in browser memory and nothing was ever
   read back. Runs came back, because runs are rows.

   ⚠️ This comment used to go on to say that answers costing nothing were NOT restored — that they were
   read off the index each time and never written down, so there was nothing to bring back. That was
   true, and it was honest about a real hole rather than hiding it. It is no longer true: every
   sentence and every reply is now a row in `conversation_turns`, so the whole thread returns.

   Two sources, deliberately, because they have two lifetimes. A sentence is final the moment it is
   said, so it replays verbatim from the transcript. A run keeps changing after the sentence that
   started it, so its card is rebuilt from the durable goal record — never from a copy frozen into the
   transcript, which would go stale against the run it describes. */
async function replayTranscript(){
  let c;
  try { c = await api('/api/conversation'); } catch { return false; }
  if (!c || !c.conversation_id) return false;

  /* Adopt the server's thread. This is what makes a second tab, a second device and a cleared cache
     all continue the SAME conversation instead of quietly starting new ones. */
  conversationID = c.conversation_id;
  const turns = c.turns || [];
  if (!turns.length) return false;

  for (const tn of turns) {
    if (tn.role === 'user') {
      turn('you').appendChild(el(`<div class="ask">${esc(tn.body)}</div>`));
      continue;
    }
    const t = turn('heros');
    /* 🔴 A replayed turn is labelled when it was NOT reasoned about. A reply the keyword fallback
       produced while the model was unavailable reads exactly like one the agent thought about, and a
       person re-reading the thread has no other way to tell. */
    /* 🔴 Only a turn the model could NOT answer is labelled. Marking every turn would make the label
       meaningless, and marking none would leave a person unable to tell a reasoned answer from one the
       keyword fallback produced during an outage. */
    const degraded = tn.decided === 'keyword-fallback'
      ? `<p style="color:var(--ink-muted);font-size:.82rem">answered without the model, from keywords
         alone</p>` : '';
    say(t, `<p>${esc(tn.body)}</p>${degraded}`);
  }
  return true;
}

async function replayRuns(said){
  let h;
  try { h = await api('/api/history'); } catch { return said; }
  const goals = (h && h.goals) || [];
  if (!goals.length) return said;

  const t = turn('heros');
  say(t, `<p>${said ? 'And here' : 'Picking up where we left off — here'} ${
    goals.length === 1 ? 'is the run' : 'are the ' + goals.length + ' runs'} from this organization.</p>
    <p style="color:var(--ink-muted)">These are rebuilt from the run record rather than from the
    transcript, so what you see is where each run actually stands now.</p>`);

  for (const g of goals) {
    const u = turn('you');
    u.appendChild(el(`<div class="ask">${esc(g.objective || g.intent)}</div>`));
    const h2 = turn('heros');
    const spent = money(g.cost_micro_cents || 0);
    const state = g.state === 'succeeded' ? 'b-ok' : (g.state === 'failed' ? 'b-bad' : 'b-warn');
    const card = el(`<div class="card"><div class="card-head">
        <span class="card-title"><span class="k">goal</span> ${esc(g.intent)}${
          g.axes && g.axes.length ? ' · ' + esc(g.axes.join(', ')) : ''}</span>
        <span class="spacer"></span><span class="badge ${state}">${esc(g.state)}</span></div>
      <div class="card-body"><p style="margin:0;font-size:.9rem;color:var(--ink-muted)">
        ${g.done}/${g.tasks} task${g.tasks === 1 ? '' : 's'} · ${spent} of $${(g.ceiling_cents/100).toFixed(2)}
        </p></div></div>`);
    h2.appendChild(card); scroll();
  }
  return true;
}

async function start(){
  /* 🔴 The transcript is replayed BEFORE the subject is looked at, and regardless of whether one is
     loaded. It used to happen only on the branch where a repository was already there, so a person who
     had been talking without loading one came back to an empty console — and, worse, to a NEW thread,
     because adopting the server's conversation id is part of replaying it. The conversation is not a
     property of having a repository. */
  const resumed = await replayTranscript();

  const t = turn('heros');
  try {
    const s = await api('/api/subject');
    if (s.loaded === false) {
      subjEl.textContent = 'no repository loaded';
      if (resumed) { t.remove(); return; }
      say(t, `<p><strong>I am Heros.</strong> I read agents — yours, if you point me at one — and tell
        you what is weak in it.</p>
        <p>Give me a repository and I will start by reading it: a GitHub link
        (<code>github.com/acme/bot</code>) or a path on this machine (<code>../hermes-agent</code>).
        You can paste it in a sentence; I will find it.</p>
        <p style="color:var(--ink-muted)">I pin it to a revision, because without one I cannot tell you
        later whether a change actually helped. And I would rather tell you I cannot do something than
        guess at it — there are nineteen things I do, and I will show you the list any time you ask.</p>`);
    } else {
      t.remove();
      await replayRuns(resumed);
      renderSubject(s);
    }
  } catch (e) {
    say(t, `<p style="color:var(--bad)">Cannot reach herosd: ${esc(e.message)}</p>`);
  }
}

(async () => {
  // Tokens are lifted out of the address bar FIRST, before any request is made, so none of them can be
  // sent onwards as a Referer or left in history behind a page that then reloads.
  const invite = takeToken('invite');
  const reset  = takeToken('reset');
  const verify = takeToken('verify');

  document.getElementById('whoami').onclick = openOrganization;

  try {
    if (verify) await confirmAddress(verify);
    await refreshMe();

    // An invitation outranks an existing session: somebody clicking an invite link on a shared machine
    // means to join as themselves, not to keep acting as whoever was signed in.
    if (invite) { acceptInvitationCard(invite); return; }
    if (reset)  { resetPasswordCard(reset);     return; }
    if (!me || !me.signed_in) { askToSignIn(); return; }

    unconfirmedBanner();
    start();
  } catch (e) {
    turn('heros').appendChild(el(`<div class="said"><p style="color:var(--bad)">Cannot reach herosd: ${esc(e.message)}</p></div>`));
  }
})();


/* ── keeping the conversation clear of the composer ───────────────────────── */
/* Publishes the composer's real height as --dock-h. A ResizeObserver rather than a one-off
   measurement, because the chips rewrap whenever the window changes and the correct reservation
   changes with them. */
(function(){
  const dock = document.querySelector('.composer');
  if (!dock) return;
  const publish = () => document.documentElement.style.setProperty('--dock-h', dock.offsetHeight + 'px');
  publish();
  if (window.ResizeObserver) new ResizeObserver(publish).observe(dock);
  else window.addEventListener('resize', publish);
})();
</script>
