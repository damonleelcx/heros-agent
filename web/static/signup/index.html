<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an organization — Heros</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/heros.css">
<!-- 🔴 Synchronous, and in the head: heros-theme.js sets the theme attribute BEFORE first paint.
     Deferred, the page paints in the wrong theme first and then corrects itself. -->
<script src="/heros-theme.js"></script>
<script src="/heros-arc.js" defer></script>

<!-- The predictive arch, behind the card. Decoration; heros-arc.js is the only thing that
     touches it, and the dock holds the theme switch on a page with no nav to put it in. -->
<canvas class="arc-bg arc-fixed" data-heros-arc aria-hidden="true"></canvas>
<div class="theme-dock" data-theme-slot></div>

<main class="auth">
  <div class="auth-card">
    <div class="auth-head">
      <a href="/"><img src="/avatar.jpg" alt="Heros"></a>
      <h2>Create an organization</h2>
      <p class="hint">You will own it. Everything you ask Heros lives inside it.</p>
    </div>
    <div class="card">
      <form class="stack" id="form" novalidate>
        <div>
          <label class="label" for="org">Organization name</label>
          <input class="field" id="org" type="text" required maxlength="80" placeholder="Acme Robotics">
          <p class="hint">What everyone you invite will see.</p>
        </div>
        <div>
          <label class="label" for="email">Email</label>
          <input class="field" id="email" type="email" autocomplete="username" required
                 autocapitalize="none" spellcheck="false" placeholder="you@example.com">
          <!-- Stated up front rather than discovered at submit: an address belongs to one
               organization, and somebody about to reuse a work address should know before typing a
               password. -->
          <p class="hint">One organization per address.</p>
        </div>
        <div>
          <label class="label" for="password">Password</label>
          <input class="field" id="password" type="password" autocomplete="new-password" required
                 minlength="12" placeholder="at least 12 characters">
          <p class="hint">At least 12 characters. Use something you have not used elsewhere.</p>
        </div>
        <button class="btn btn-primary" id="go" type="submit">Create organization</button>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </form>
    </div>
    <p class="alt">Already have an account? <a href="/signin/">Sign in</a>.</p>
  </div>
</main>

<script src="/heros-reveal.js"></script>
<script src="/heros-auth.js"></script>
<script>
  const msg = document.getElementById('msg');
  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const organization = document.getElementById('org').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!organization) { say(msg, 'Give your organization a name.', 'bad'); return; }
    if (!email) { say(msg, 'An email address is needed — it is how you sign in.', 'bad'); return; }
    /* Checked here as well as on the server. The server is the one that decides; this only saves a
       round trip and a wasted password-hash on the most common mistake. */
    if (password.length < 12) { say(msg, 'Choose a password of at least 12 characters.', 'bad'); return; }
    await submit(document.getElementById('go'), msg, '/api/auth/signup',
                 {organization, email, password}, 'Creating…');
  });
</script>
