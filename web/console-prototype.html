<title>Heros Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* Tokens transcribed from heros-agent.space. The source system is dark-committed, so this page is
   deliberately single-theme: every colour is painted explicitly rather than inherited from the host. */
:root{
  --canvas:#080d17; --panel:#0a1020; --card:#0e1422; --secondary:#151d2e; --muted:#141b2b;
  --ink:#dde2f0; --ink-muted:#8b95b5; --border:#ffffff1a; --border-strong:#ffffff29;
  --accent:#2ecfa8; --accent-ink:#051a14;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --info:#38bdf8; --gated:#a78bfa; --none:#7f8aa8;
  --radius:.5rem; --pill:9999px;
  --fast:.12s; --base:.18s; --slow:.32s;
  --prose:44rem;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(#2ecfa80a 1px,transparent 0),linear-gradient(90deg,#2ecfa80a 1px,transparent 0);
  background-size:40px 40px;
}
/* ── shell ───────────────────────────────────────────────────────────────── */
.shell{max-width:56rem;margin:0 auto;padding:0 1.25rem 10rem;}
header.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;
  padding:.9rem 0;background:color-mix(in srgb,var(--canvas) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);margin-bottom:2rem;
}
.wordmark{font-family:var(--mono);font-size:.8rem;letter-spacing:.22em;color:var(--ink);font-weight:500}
.subject{
  font-family:var(--mono);font-size:.7rem;color:var(--ink-muted);
  border:1px solid var(--border);border-radius:var(--pill);padding:.25rem .7rem;
  display:flex;gap:.5rem;align-items:center;
}
.subject b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.tenant{font-family:var(--mono);font-size:.7rem;color:var(--ink-muted)}

/* ── conversation ────────────────────────────────────────────────────────── */
.stream{display:flex;flex-direction:column;gap:1.75rem}
.turn{display:flex;flex-direction:column;gap:.6rem;animation:rise var(--slow) ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}*{transition:none!important}}

.who{
  font-family:var(--mono);font-size:.625rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-muted);display:flex;align-items:center;gap:.5rem;
}
.who .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.who.user .dot{background:var(--ink-muted)}
.said{max-width:var(--prose)}
.said p{margin:0 0 .7rem}
.said p:last-child{margin-bottom:0}
.said strong{color:#fff;font-weight:600}
.said code{font-family:var(--mono);font-size:.85em;background:var(--secondary);
  padding:.1rem .35rem;border-radius:3px;color:var(--accent)}
.ask{
  font-family:var(--display);font-size:1.35rem;font-weight:300;line-height:1.4;
  color:#fff;max-width:var(--prose);text-wrap:balance;
}

/* ── cards ───────────────────────────────────────────────────────────────── */
.card{
  border:1px solid var(--border);background:var(--card);border-radius:var(--radius);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;
  border-bottom:1px solid var(--border);background:var(--panel);
}
.card-title{font-family:var(--mono);font-size:.75rem;color:var(--ink);letter-spacing:.02em}
.card-title .k{color:var(--ink-muted)}
.card-body{padding:1rem}

.badge{
  font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.2rem .5rem;border-radius:var(--pill);border:1px solid;white-space:nowrap;
}
.b-run{color:var(--accent);border-color:#2ecfa855;background:#2ecfa814}
.b-gate{color:var(--gated);border-color:#a78bfa55;background:#a78bfa14}
.b-ok{color:var(--ok);border-color:#34d39955;background:#34d39914}
.b-bad{color:var(--bad);border-color:#fb718555;background:#fb718514}
.b-warn{color:var(--warn);border-color:#fbbf2455;background:#fbbf2414}

/* ── task ledger ─────────────────────────────────────────────────────────── */
.ledger{display:flex;flex-direction:column;font-family:var(--mono);font-size:.75rem}
.row{
  display:grid;grid-template-columns:1rem 1fr auto;gap:.7rem;align-items:center;
  padding:.42rem .25rem;border-bottom:1px solid #ffffff0d;transition:background var(--base);
}
.row:last-child{border-bottom:0}
.row .name{color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .name{color:var(--ink)}
.row.live{background:#2ecfa80a}
.row.live .name{color:var(--accent)}
.row.gate .name{color:var(--gated)}
.row.blocked .name{color:var(--none)}
.mark{width:1rem;text-align:center;font-size:.8rem;line-height:1}
.state{font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--none)}
.row.done .state{color:var(--ok)} .row.live .state{color:var(--accent)}
.row.gate .state{color:var(--gated)} .row.blocked .state{color:var(--none)}
.row.fail .state{color:var(--bad)} .row.fail .name{color:var(--bad)}
.depth{display:inline-block}

.spin{display:inline-block;width:9px;height:9px;border:1.5px solid #2ecfa844;
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── meters ──────────────────────────────────────────────────────────────── */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.9rem;
  padding:.85rem 1rem;border-top:1px solid var(--border);background:#ffffff04}
.meter .lab{font-family:var(--mono);font-size:.625rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-muted);margin-bottom:.3rem}
.meter .val{font-family:var(--mono);font-size:.9rem;color:var(--ink);
  font-variant-numeric:tabular-nums}
.meter .val .of{color:var(--none);font-size:.75rem}
.bar{height:2px;background:#ffffff14;border-radius:2px;margin-top:.4rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width var(--slow) ease}

/* ── approval ────────────────────────────────────────────────────────────── */
.gatecard{border-color:#a78bfa3d}
.gatecard .card-head{background:#a78bfa0f}
.diff{
  font-family:var(--mono);font-size:.72rem;line-height:1.65;background:#060a12;
  border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;margin:.85rem 0;
}
.diff div{padding:0 .8rem;white-space:pre}
.diff .add{background:#34d3990f;color:var(--ok)}
.diff .del{background:#fb71850f;color:var(--bad)}
.diff .ctx{color:var(--none)}
.diff .hd{color:var(--ink-muted);background:#ffffff06;padding:.35rem .8rem}

.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
button{font-family:var(--body);font-size:.8rem;font-weight:500;cursor:pointer;
  border-radius:var(--radius);padding:.5rem .95rem;transition:all var(--base);border:1px solid}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-go:hover{filter:brightness(1.1)}
.btn-no{background:transparent;color:var(--ink-muted);border-color:var(--border-strong)}
.btn-no:hover{color:var(--ink);border-color:var(--ink-muted)}
.evidence{font-family:var(--mono);font-size:.68rem;color:var(--none);margin-left:auto}

/* ── refusal ─────────────────────────────────────────────────────────────── */
.refusal{border-color:#fbbf243d}
.refusal .card-head{background:#fbbf240f}
.next{
  display:flex;gap:.6rem;align-items:flex-start;margin-top:.75rem;padding:.7rem .85rem;
  background:#fbbf2410;border:1px solid #fbbf2433;border-radius:var(--radius);
}
.next .lab{font-family:var(--mono);font-size:.625rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--warn);white-space:nowrap;padding-top:.15rem}
.next p{margin:0;font-size:.85rem;color:var(--ink)}

/* ── inline answer table ─────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.75rem}
.tbl th{text-align:left;font-weight:500;font-size:.625rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-muted);padding:.4rem .6rem;border-bottom:1px solid var(--border)}
.tbl td{padding:.45rem .6rem;border-bottom:1px solid #ffffff0d;color:var(--ink)}
.tbl tr:last-child td{border-bottom:0}
.tbl .dim{color:var(--ink-muted)}
.tbl .miss{color:var(--warn)}
.wrap{overflow-x:auto}

/* ── composer ────────────────────────────────────────────────────────────── */
.composer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(180deg,transparent,var(--canvas) 22%);padding:2.5rem 1.25rem 1.25rem;
}
.composer-in{max-width:56rem;margin:0 auto}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.chip{
  font-family:var(--mono);font-size:.68rem;color:var(--ink-muted);background:var(--secondary);
  border:1px solid var(--border);border-radius:var(--pill);padding:.35rem .75rem;cursor:pointer;
  transition:all var(--base);
}
.chip:hover{color:var(--accent);border-color:#2ecfa855;background:#2ecfa812}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{
  display:flex;gap:.75rem;align-items:center;background:var(--card);
  border:1px solid var(--border-strong);border-radius:var(--radius);padding:.7rem .9rem;
  transition:border-color var(--base);
}
.field:focus-within{border-color:#2ecfa877}
.field input{
  flex:1;background:transparent;border:0;outline:0;color:var(--ink);
  font-family:var(--body);font-size:.95rem;
}
.field input::placeholder{color:var(--none)}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--radius);
  padding:.45rem .9rem;font-weight:600;font-size:.8rem;cursor:pointer}
.send:disabled{opacity:.35;cursor:not-allowed}
.hint{font-family:var(--mono);font-size:.625rem;color:var(--none);margin-top:.5rem;text-align:center}
.hint b{color:var(--ink-muted);font-weight:400}
</style>

<div class="shell">
  <header class="top">
    <span class="wordmark">HEROS</span>
    <span class="subject">acme/support-bot <b>@ rev-a41c9</b></span>
    <span class="spacer"></span>
    <span class="tenant">acme · 3 of 5 seats</span>
  </header>
  <div class="stream" id="stream"></div>
</div>

<div class="composer">
  <div class="composer-in">
    <div class="chips" id="chips"></div>
    <div class="field">
      <input id="input" placeholder="Ask about your agent, or ask heros to change it…" autocomplete="off">
      <button class="send" id="send">Ask</button>
    </div>
    <div class="hint">Everything happens here. <b>Nineteen things I can do — ask for anything else and I will say where it is done.</b></div>
  </div>
</div>

<script>
const stream = document.getElementById('stream');
const input  = document.getElementById('input');
const send   = document.getElementById('send');
const chips  = document.getElementById('chips');

const AXES = ["model","prompt","skills","context","tools","memory","harness","loop","graph"];
// Measured on a live run against deepseek-v4-flash on 2026-08-31: 8 calls, 4,397 tokens, $0.0016.
const REAL_TOKENS = {model:531,prompt:498,skills:602,context:544,tools:588,memory:512,harness:571,loop:551};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (html) => { const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; };
const scroll = () => window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});

function turn(who, cls=''){
  const t = el(`<div class="turn ${cls}">
    <div class="who ${who==='you'?'user':''}"><span class="dot"></span>${who}</div></div>`);
  stream.appendChild(t); scroll(); return t;
}
function say(t, html){ t.appendChild(el(`<div class="said">${html}</div>`)); scroll(); }

/* ── the four demo conversations ─────────────────────────────────────────── */

// Tier B — a query. Answers inline from stored state. No run, no queue, no cost.
async function qTools(){
  const t = turn('heros');
  await sleep(340);
  say(t, `<p>Three nodes offer tools. One offers a tool it has never once called — that is usually
    a leftover, and it costs you tokens in every prompt.</p>`);
  const c = el(`<div class="card"><div class="card-head">
      <span class="card-title"><span class="k">axis</span> tools</span>
      <span class="spacer"></span><span class="badge b-ok">read from last run</span></div>
    <div class="wrap"><table class="tbl">
      <tr><th>node</th><th>offered</th><th>called</th><th>note</th></tr>
      <tr><td>triage</td><td>4</td><td>4</td><td class="dim">—</td></tr>
      <tr><td>lookup_order</td><td>6</td><td>5</td><td class="miss">refund_tool never called</td></tr>
      <tr><td>escalate</td><td>2</td><td>2</td><td class="dim">—</td></tr>
    </table></div></div>`);
  t.appendChild(c); scroll();
  await sleep(260);
  say(t, `<p>This is a read of what your last run actually did — nothing ran just now, and it cost nothing.</p>`);
}

// Tier A — a durable goal. Plan, execute, replan, gate.
async function goAssess(){
  const t = turn('heros');
  await sleep(300);
  say(t, `<p>That is a durable goal, so I am writing a plan down before I spend anything.
    Nine axes, one task each, then a synthesis that waits for all nine.</p>`);

  const card = el(`<div class="card">
    <div class="card-head">
      <span class="card-title"><span class="k">goal</span> assess <span class="k">·</span> acme/support-bot@rev-a41c9</span>
      <span class="spacer"></span><span class="badge b-run" id="gstate">running</span>
    </div>
    <div class="card-body"><div class="ledger" id="led"></div></div>
    <div class="meters">
      <div class="meter"><div class="lab">tasks</div><div class="val"><span id="mt">0</span><span class="of"> / 10</span></div><div class="bar"><i id="bt"></i></div></div>
      <div class="meter"><div class="lab">spend</div><div class="val">$<span id="mc">0.0000</span><span class="of"> / $5.00</span></div><div class="bar"><i id="bc"></i></div></div>
      <div class="meter"><div class="lab">tokens</div><div class="val" id="mk">0</div></div>
      <div class="meter"><div class="lab">model</div><div class="val" style="font-size:.72rem">deepseek-v4-flash</div></div>
      <div class="meter"><div class="lab">elapsed</div><div class="val" id="me">0s</div></div>
    </div></div>`);
  t.appendChild(card); scroll();

  const led = card.querySelector('#led');
  const rows = {};
  const add = (id, label, cls='') => {
    const r = el(`<div class="row ${cls}"><span class="mark">·</span>
      <span class="name">${label}</span><span class="state">pending</span></div>`);
    led.appendChild(r); rows[id]=r; return r;
  };
  AXES.forEach(a => add(a, `assess · ${a}`));
  add('syn','synthesise · waits for all nine');

  const setState = (r, cls, mark, text) => {
    r.className = `row ${cls}`;
    r.querySelector('.mark').innerHTML = mark;
    r.querySelector('.state').textContent = text;
  };

  let done=0, cost=0, tok=0, t0=Date.now();
  const tick = setInterval(()=>{ card.querySelector('#me').textContent = Math.round((Date.now()-t0)/1000)+'s'; },1000);

  for (const a of AXES){
    setState(rows[a],'live','<span class="spin"></span>','running');
    scroll();
    await sleep(230);
    if (a === 'graph'){
      setState(rows[a],'fail','✕','failed');
      say(t, `<p>The <code>graph</code> axis failed: your workflow builds its edges at runtime, so I
        cannot read the topology without executing your code, and I do not execute your code.</p>`);
    } else {
      setState(rows[a],'done','✓','succeeded');
      done++;
    }
    // Real per-axis usage, measured on a live deepseek-v4-flash run: 4,397 tokens over 8 calls,
    // 159,550 micro-cents total. Not illustrative numbers.
    if (a !== 'graph'){ tok += REAL_TOKENS[a]; cost += REAL_TOKENS[a] * 0.000000363; }
    card.querySelector('#mt').textContent = done;
    card.querySelector('#mc').textContent = cost.toFixed(4);
    card.querySelector('#mk').textContent = tok.toLocaleString();
    card.querySelector('#bt').style.width = (done/10*100)+'%';
    card.querySelector('#bc').style.width = Math.max(cost/5*100, .6)+'%';
  }
  setState(rows['syn'],'blocked','⊘','blocked');
  clearInterval(tick);
  card.querySelector('#gstate').textContent = 'finished with gaps';
  card.querySelector('#gstate').className = 'badge b-warn';

  await sleep(320);
  say(t, `<p style="font-family:var(--mono);font-size:.75rem;color:var(--ink-muted)">
    8 calls · 4,397 tokens · $0.0016 of a $5.00 ceiling · 24s</p>`);
  say(t, `<p><strong>Eight of nine axes assessed.</strong> The synthesis is blocked, deliberately —
    a summary over an unknown subset is a report whose completeness I cannot state, and
    <em>what I did not measure</em> is half of what you are paying me to tell you.</p>
    <p>Every axis I could read came back actionable. The two I would take first:
    <code>context</code> — no truncation or summarisation of history, so context length can exceed the
    model limit; and <code>tools</code> — <code>lookup_order</code> offers <code>refund_tool</code>,
    which has not been called once in 30 days of traces.</p>
    <p>Say <em>fix it</em> and I will plan the changes. You approve each one before anything is written.</p>`);
}

// Tier A + Tier C — the approval gate.
async function goImprove(){
  const t = turn('heros');
  await sleep(300);
  say(t, `<p>I already have the findings, so I am growing the plan rather than starting again —
    one proposal per <em>actionable</em> finding. Two.</p>`);
  await sleep(600);
  say(t, `<p>Both proposals were written and verified against your own eval set. Neither has been
    applied. Here is the first.</p>`);

  const g = el(`<div class="card gatecard">
    <div class="card-head">
      <span class="card-title"><span class="k">waiting for you</span> · memory · summarise old turns</span>
      <span class="spacer"></span><span class="badge b-gate">needs approval</span>
    </div>
    <div class="card-body">
      <p style="margin:0 0 .3rem;font-size:.9rem">Your <code>triage</code> node carries every prior turn
      into every call. At turn 40 that is 31k tokens of history to answer one question.</p>
      <div class="diff">
        <div class="hd">agents/triage.py</div>
        <div class="ctx">  def build_messages(self, history):</div>
        <div class="del">-     return [SYSTEM] + history</div>
        <div class="add">+     recent = history[-6:]</div>
        <div class="add">+     older  = self.summarise(history[:-6])</div>
        <div class="add">+     return [SYSTEM, older] + recent</div>
      </div>
      <div class="actions">
        <button class="btn-go" id="ap">Approve and open a pull request</button>
        <button class="btn-no" id="dc">Not this one</button>
        <span class="evidence">measured: −68% tokens · quality 0.91 → 0.90 (n=120)</span>
      </div>
    </div></div>`);
  t.appendChild(g); scroll();

  g.querySelector('#dc').onclick = () => {
    g.querySelector('.card-body .actions').innerHTML =
      `<span class="badge b-bad">declined</span>
       <span class="evidence">nothing was written. The finding stays on the report.</span>`;
    g.querySelector('.badge').className='badge b-bad';
    g.querySelector('.badge').textContent='declined';
  };
  g.querySelector('#ap').onclick = async () => {
    const a = g.querySelector('.card-body .actions');
    a.innerHTML = `<span class="evidence">opening…</span>`;
    await sleep(900);
    a.innerHTML = `<span class="badge b-ok">pull request #248 opened</span>
      <span class="evidence">idempotency key acme:rev-a41c9:memory-0 — a retry reuses it</span>`;
    g.querySelector('.card-head .badge').className='badge b-ok';
    g.querySelector('.card-head .badge').textContent='approved';
    const t2 = turn('heros');
    say(t2, `<p>Opened. One proposal still waits on you — the unused <code>refund_tool</code>.
      I have stopped polling: nothing moves until you answer, and I would rather say so than
      look busy.</p>`);
  };
}

// A refusal that names its next action.
async function refuse(){
  const t = turn('heros');
  await sleep(300);
  const c = el(`<div class="card refusal">
    <div class="card-head"><span class="card-title"><span class="k">refused</span> unbounded_requested</span>
      <span class="spacer"></span><span class="badge b-warn">nothing was spent</span></div>
    <div class="card-body">
      <p style="margin:0;font-size:.9rem">You asked me to keep going until it is perfect. I do not sell
      that. An unbounded search is not a bigger version of a bounded one — it is a different thing with a
      different bill, and you did not choose it.</p>
      <div class="next"><span class="lab">do this</span>
        <p>Give the run a limit — a number of proposals, a spend, or a deadline.
        <em>“Fix my memory axis, up to $5.”</em></p></div>
    </div></div>`);
  t.appendChild(c); scroll();
}

// Out of scope — named, not merely declined.
async function redirect(){
  const t = turn('heros');
  await sleep(280);
  say(t, `<p>I will not connect a repository from a sentence. Connecting one creates a standing read
    grant — a credential I use when you are not here — and you have to see that disclosure before it
    is created, not after.</p>
    <p><strong>That is done at Connections</strong>, which handles connecting a repository and revoking
    a connection. Revoking is there too, and it tells you what it will delete.</p>`);
}

/* ── routing ─────────────────────────────────────────────────────────────── */
const SUGGESTIONS = [
  {label:'what tools does this agent have?', run:qTools},
  {label:'look at my repo and tell me what is weak', run:goAssess},
  {label:'fix it, and open a pull request', run:goImprove},
  {label:'keep improving until it is perfect', run:refuse},
  {label:'connect my other repo', run:redirect},
];
SUGGESTIONS.forEach(s => {
  const c = el(`<button class="chip">${s.label}</button>`);
  c.onclick = () => ask(s.label);
  chips.appendChild(c);
});

function route(text){
  const q = text.toLowerCase();
  if (/perfect|until it|no limit|as many as|forever/.test(q)) return refuse;
  if (/connect|revoke|repo access|billing|password|invite/.test(q)) return redirect;
  if (/fix it|improve|pull request|open a pr/.test(q)) return goImprove;
  if (/weak|assess|review my|look at my/.test(q)) return goAssess;
  if (/tool/.test(q)) return qTools;
  return null;
}

let busy = false;
async function ask(text){
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true; input.value='';
  const t = turn('you'); t.appendChild(el(`<div class="ask">${text}</div>`));
  const fn = route(text);
  if (fn) { await fn(); }
  else {
    const r = turn('heros');
    say(r, `<p>I cannot route that one. Here is the whole of what I do — nineteen things, and this is
      the list, not a sample:</p>
      <p style="color:var(--ink-muted);font-size:.88rem">Show me the graph · what happened in that run ·
      is this version better · what would you write into my source · how a change reaches my repo ·
      change the prompt · change the model · change something on an axis · should these run in this order ·
      what history does this node get · what does it remember · what skills are bound · what tools does it
      have · how many turns and in what loop · what may it reach and spend · what did you measure ·
      look at my repo and tell me what is weak · build me an eval set · fix it and open a pull request.</p>`);
  }
  busy = false; send.disabled = false; input.focus();
}

send.onclick = () => ask(input.value);
input.onkeydown = e => { if (e.key==='Enter') ask(input.value); };

/* opening */
(async () => {
  const t = turn('heros');
  await sleep(200);
  say(t, `<p>I read <code>acme/support-bot</code> at <code>rev-a41c9</code>. Nine axes describe how your
    agent behaves — its model, prompt, skills, context, tools, memory, harness, loop and graph — and I can
    tell you about any of them, change any of them, or measure whether a change actually helped.</p>
    <p style="color:var(--ink-muted)">Ask below. Anything that costs money gets a written plan and a
    ceiling first; anything that touches your repository waits for you. A full nine-axis read runs on
    <code>deepseek-v4-flash</code> and costs about two tenths of a cent.</p>`);
})();
</script>
