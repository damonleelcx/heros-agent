# Caddy TLS front door for the single-VM deploy (P19). Terminates HTTPS on 80/443 and reverse-proxies
# the customer console (and, when layered, the operator console) by hostname. Caddy obtains and renews
# Let's Encrypt certificates automatically — one line per hostname, no cert wrangling.
#
# The Caddyfile is generated by deploy/scripts/bootstrap-vm.sh from your domain; it is mounted read-only.
# Caddy is the ONLY container that publishes 80/443; the consoles are reached only through it.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      console:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
