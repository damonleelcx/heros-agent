# Caddy TLS front door for the single-VM deploy (P19). Terminates HTTPS on 80/443 and reverse-proxies
# the customer console (and, when layered, the operator console) by hostname. Caddy obtains and renews
# Let's Encrypt certificates automatically — one line per hostname, no cert wrangling.
#
# The Caddyfile is generated by deploy/scripts/bootstrap-vm.sh from your domain; it is mounted read-only.
# Caddy is the ONLY container that publishes 80/443; the consoles are reached only through it.
#
# It also fronts ONE path of the platform API — `/billing/webhook`, the processor's callback. agentd's
# own published port is bound on the host and firewalled off, so without this route the webhook has no
# way in at all and collection silently never completes. The generated Caddyfile explains why that one
# path is safe to publish and the rest of agentd is not; see bootstrap-vm.sh §4.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      console:
        condition: service_healthy
      # The webhook route's upstream. Caddy would retry a cold upstream anyway, but starting the front
      # door before the service behind one of its routes means the processor's first delivery attempt
      # after a restart meets a 502 — retried by the processor, but recorded as a failure on an endpoint
      # an operator reads as a health signal.
      agentd:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
