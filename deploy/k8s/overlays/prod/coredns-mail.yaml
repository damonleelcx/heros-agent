# ⚠️ THIS FILE IS DELIBERATELY EMPTY OF RESOURCES. IT IS KEPT AS A RECORD OF A FIX THAT WAS WRONG.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THE PROBLEM IT WAS SOLVING (still real)
#
# `internal/mailer` builds `tls.Config{ServerName: cfg.Host}` from HEROS_SMTP_HOST, so the relay's
# certificate must be valid for exactly that name — and Let's Encrypt will not sign
# `.svc.cluster.local`. So HEROS_SMTP_HOST must be the PUBLIC name `mail.heros-agent.space`.
# But that name resolves to this node's public address, so agentd's mail would leave the cluster,
# traverse the internet gateway, and come back through svclb to a pod one virtual hop away —
# succeeding at every step, putting a credential-bearing connection on the public internet, and
# requiring the security group to permit 587 from the world. Nothing reports that this is happening.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# 🔴 THE FIX THAT WAS TRIED HERE, AND WHY IT BROKE SOMETHING ELSE
#
# This file used to hold a `coredns-custom` ConfigMap in kube-system:
#
#     rewrite name mail.heros-agent.space mail.heros.svc.cluster.local
#
# It worked, for agentd. It also silently broke certificate issuance for that same hostname.
#
# cert-manager performs a **self-check** before telling Let's Encrypt a HTTP-01 challenge is ready:
# it resolves the domain *through cluster DNS* and fetches the challenge URL itself. With the rewrite
# in place, cert-manager resolved `mail.heros-agent.space` to the mail Service ClusterIP — which
# listens on 587 and nothing else — so the HTTP GET timed out, the challenge stayed `pending`
# forever, no Secret was ever created, and the mail pod sat in `Init` on a volume that would never
# mount. Observed exactly that:
#
#     Waiting for HTTP-01 challenge propagation: failed to perform self check GET request
#     'http://mail.heros-agent.space/.well-known/acme-challenge/…': context deadline exceeded
#
# ⚠️ AND IT WOULD NOT HAVE STAYED A FIRST-DEPLOY PROBLEM. Issuing the certificate first and adding
# the rewrite afterwards "works" — until the 60-day renewal, which fails the same self-check with
# nothing watching, and the certificate expires. A bug that only appears two months later, on a
# component whose failure mode is "mail silently stops", is worse than one that blocks the deploy.
#
# The lesson is general: a cluster-wide DNS override is not scoped to the workload that needs it.
# CoreDNS has no per-workload view, so *every* controller that resolves that name gets the answer —
# including the one whose job is to prove the name points somewhere else.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# WHAT REPLACED IT
#
# `hostAliases` on the agentd pod alone (see the patch in kustomization.yaml). It writes one line
# into that pod's /etc/hosts, which takes precedence over DNS for that pod and is invisible to every
# other workload — cert-manager included. The mail Service pins its ClusterIP so the alias is a
# stable, declared value rather than one allocated at random.
#
# This file is retained rather than deleted because the reasoning above is the only place the
# interaction is written down, and the rewrite is an obvious thing to reach for again.
