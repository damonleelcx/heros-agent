# http-redirect.yaml — plain HTTP must REDIRECT to HTTPS, never answer on it (AWS.md §8).
#
# Without this, port 80 has no router at all for either hostname — the two console Ingresses are pinned
# to the `websecure` entrypoint — so `http://heros-agent.space` returns a bare Traefik **404**. A visitor
# who types the hostname without a scheme gets "not found" rather than the site.
#
# ── Why a SEPARATE Ingress per host rather than an annotation on the existing one ────────────────────
#
# Traefik's `redirectScheme` middleware redirects unconditionally. Attaching it to a router that serves
# both entrypoints would redirect HTTPS to HTTPS — an infinite loop. So the redirect gets its own router
# bound to `web` only, and the real Ingress stays on `websecure` only. Two routers, one job each.
#
# (The k3s Traefik chart's `ports.web.redirections` values path was tried first and is a no-op in chart
# v40: Helm records the value, the rendered Deployment is byte-identical, and the entrypoint arg never
# appears. Worth knowing before someone "simplifies" this file away.)
#
# ⚠️ ACME still works. cert-manager's solver Ingress also binds `web`, and Traefik ranks routers by rule
# specificity — the solver's long exact challenge path outranks this `/` prefix, so HTTP-01 validation
# reaches the solver rather than being redirected. Let's Encrypt would follow the redirect anyway, but
# not relying on that keeps renewal independent of this file.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: heros-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            # Never actually reached — the middleware answers 308 first. The backend is required by the
            # Ingress schema, so it points at the service this host would have served anyway.
            backend: { service: { name: console, port: { number: 4320 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-console-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: heros-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: admin.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-console, port: { number: 4310 } } }
