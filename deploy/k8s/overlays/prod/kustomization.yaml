# prod overlay — the production cluster. Differences from base: 3 replicas of the STATELESS BFFs (so a
# node loss plus a rolling update still leaves a quorum), production-sized resources, and the cloud
# SecretStore reached by an ambient identity. The stateful stores stay single-instance (Decision 6); the
# Patroni-HA evolution is a future overlay, the door left open, not walked through here.
#
# 🔴 agentd is NOT scaled here, and prod is exactly where that is tempting. Its ledger is a single SQLite
# file on a ReadWriteOnce claim (see the base's Deployment comment): a second replica is a second
# database answering different questions behind one Service, and on a ReadWriteOnce claim it would not
# even schedule. Raising this number does not buy availability — it buys a split ledger and a pod stuck
# in Pending. It goes back up when the ledger's contents move to the platform database, and not before.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secretstore.yaml

patches:
  - target: { kind: Deployment, name: agentd }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: agentd }
      spec:
        template:
          spec:
            containers:
              - name: agentd
                resources:
                  requests: { cpu: "500m", memory: "512Mi" }
                  limits: { cpu: "2", memory: "1Gi" }
  # The ledger's claim is sized for production here; the base's 10Gi is a floor, not a recommendation.
  - target: { kind: PersistentVolumeClaim, name: agentd-ledger }
    patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: agentd-ledger }
      spec:
        resources:
          requests:
            storage: 50Gi
  - target: { kind: Deployment, name: console }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: console }
      spec:
        replicas: 3
  - target: { kind: Deployment, name: admin-console }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: admin-console }
      spec:
        replicas: 3
