# acme-http01-solver — the NetworkPolicy without which no certificate can ever be issued.
#
# 🔴 THE INTERACTION IS THE POINT. The base's `default-deny-all` uses `podSelector: {}` — it selects
# EVERY pod in the namespace, present and future. cert-manager solves an HTTP-01 challenge by creating an
# EPHEMERAL solver pod and an Ingress that routes the challenge path to it. That pod is in this namespace,
# so default-deny catches it, and no rule in the base admits it, because the base does not know
# cert-manager exists.
#
# The result is a failure that names neither cause: Traefik answers the ACME validator with **502**, the
# Challenge sits `pending` forever, the Certificate stays `READY=False`, and both consoles serve Traefik's
# self-signed default certificate — a browser warning rather than an outage, which is exactly the kind of
# thing that gets clicked through and shipped.
#
# This lives in the overlay, not the base, because it is specific to the cert-manager + Traefik topology.
# The EKS path uses an ACM certificate on the ALB and creates no solver pods at all.
#
# 8089 is cert-manager's fixed solver container port. The source is pinned to the Traefik pod rather than
# left open: the solver serves a bearer-ish token, and only the ingress controller has any business
# reaching it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ protocol: TCP, port: 8089 }]
