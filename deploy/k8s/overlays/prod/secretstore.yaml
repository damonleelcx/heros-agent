# prod SecretStore — AWS Secrets Manager, reached with the VM's own ambient identity.
#
# 🔴 NOTE THE ABSENT `auth:` BLOCK. That is the whole design, not an omission.
#
# On EKS this authenticated as the `heros-secrets` ServiceAccount via IRSA. k3s has no IRSA — there is no
# OIDC provider for AWS to trust — so the obvious substitute is an access key in a Kubernetes Secret. That
# is rejected: it reintroduces exactly the bootstrap secret Decision 4 exists to eliminate, and it would
# be a long-lived credential committed to, or hand-fed into, the cluster that all the other secrets are
# then fetched with. One key in a manifest is worse than the several it protects.
#
# With no `auth:` the External Secrets Operator falls back to the AWS default credential chain, which on
# EC2 resolves through IMDS to the **instance profile**. So the pod's authority is the VM's IAM role,
# granted out of band, scoped to `heros/*` and read-only — no key material anywhere in the cluster, and
# nothing to rotate. The property "no bootstrap secret in the manifest" is preserved on k3s by a
# different mechanism, rather than quietly traded away.
#
# ⚠️ This makes the instance profile load-bearing. If the role is missing or its policy does not cover a
# secret, every ExternalSecret stays un-synced and every pod that needs one waits in
# CreateContainerConfigError — the same symptom as a missing secret, from a different cause. Check the
# role before you suspect the secret:
#     aws sts get-caller-identity      # ON THE VM: must be the instance role, not a user
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: heros-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
