# prod SecretStore — AWS Secrets Manager, ambient identity (IRSA). Same posture as staging; the prefix
# separates prod's secrets. No bootstrap secret in the manifest (Decision 4).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: heros-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: heros-secrets   # annotated with the prod IAM role-arn out of band
