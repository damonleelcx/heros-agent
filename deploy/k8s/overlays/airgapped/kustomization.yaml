# airgapped overlay — a private-deploy cluster with NO public egress. Differences from base:
#   • the platform's model calls go to an operator-provided ON-PREM gateway, never the public internet;
#   • agentd's egress allowlist REPLACES the public 0.0.0.0/0:443 rule with the on-prem gateway only —
#     so no stage can attempt a public-internet egress, and the allowlist fails toward omission;
#   • /readyz aggregates the on-prem gateway's reachability (HEROS_SECRETS_HEALTH_URL) and reports
#     secrets_source degraded (fail STATIC, last-known-good retained) when it is unreachable — never
#     fail-open, never a startup dependency;
#   • the SecretStore is the operator's on-prem store (Vault), not a cloud service.
#
# 🔴 Replace ONPREM_GATEWAY_CIDR and the gateway host below with the operator's real values before
# apply. They are the only environment-specific inputs, and they are addresses, not secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 🔴 namespace, and its absence was a real defect rather than a tidiness issue. The BASE sets
# `namespace: heros`, but a kustomize namespace transformer only applies to the resources of the
# kustomization that declares it — an overlay's own sibling files (secretstore.yaml here, plus
# ingress.yaml under prod) inherit nothing. They therefore landed in `default`, where the SecretStore is
# invisible to the ExternalSecrets in `heros` ("SecretStore heros-store not found") and an Ingress points
# at Services that do not exist beside it. Both apply cleanly and neither says why.
namespace: heros

# ── 🔴 P31 · THE EDGE IS THE OPERATOR'S, AND SERVER-SENT EVENTS MUST NOT BE BUFFERED ─────────────
#
# This overlay ships NO Ingress. On an air-gapped cluster the front door is the operator's own — their
# load balancer, their reverse proxy, their TLS — and inventing one here would be a manifest that either
# does nothing or fights theirs.
#
# That makes the following a REQUIREMENT ON THEM rather than a setting we can apply, and it is written
# here because this file is what they read:
#
#   `GET /api/v1/conversation-stream` is Server-Sent Events. **Every hop between a browser and agentd
#   must forward its response unbuffered.**
#
#   nginx      `proxy_buffering off;`  (and `proxy_read_timeout` above the longest turn)
#   HAProxy    `option http-no-delay`, and no `http-buffer-response` on this backend
#   Envoy      no response buffering filter on this route
#   Traefik    no `buffering` middleware on this router
#
# 🔴 Why this is worth four lines in a manifest: a proxy that buffers turns streaming into BATCHING. The
# stream still completes. Nothing errors. Every message arrives at the end in one burst, and the failure
# is indistinguishable from slowness at the application layer — there is no status code for it and no log
# line. On an air-gapped install, where we cannot see the edge at all, the first report will be "the
# product is slow", and nobody will look at the proxy.
#
# `make console-edge-proof CONSOLE_URL=…` asserts incremental arrival through a running edge, and is the
# check to run against the operator's own front door before the install is called done.
# heros.dev/response-buffering: off   (declared here for the fence; see internal/api/conversation_edge_test.go)

resources:
  - ../../base
  - secretstore.yaml

patches:
  # 1) Point the model seam at the on-prem gateway and aggregate its reachability into /readyz.
  - target: { kind: Deployment, name: agentd }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: agentd }
      spec:
        template:
          spec:
            containers:
              - name: agentd
                env:
                  # The seam still resolves credentials from the on-prem store; the model CALLS route to
                  # the on-prem gateway. Kept "env" here because the on-prem store injects provider creds
                  # into the process via the ExternalSecret; the confinement is the egress policy below.
                  - { name: HEROS_SECRETS_SOURCE, value: "env" }
                  # When this is unreachable, /readyz reports secrets_source degraded and the model-
                  # dependent stages read that as degraded-not-available — fail static, not a crash.
                  - { name: HEROS_SECRETS_HEALTH_URL, value: "http://onprem-llm-gateway.heros.svc:8080/healthz" }
                  # 🔴 Self-serve sign-up OFF, declared rather than left to the default (P27 task 10.4).
                  #
                  # An air-gapped install has ONE customer by construction, and its identity provider is
                  # that customer's own — so everybody it admits is already inside the perimeter, and
                  # self-serve would let any of them mint an organization on a platform with no egress to
                  # alert over it. `launch.SelfServeEnabled` already treats unset as off; this line exists
                  # so the posture is READABLE. `deploy/scripts/check-self-serve-off.sh` refuses to cut a
                  # package that turns it on AND one that never says, because an operator can diff "0"
                  # becoming "1" and cannot diff a line that was always missing.
                  - { name: HEROS_SELF_SERVE_SIGNUP, value: "0" }

  # 1b) The console's release surface goes OFFLINE. Without this the download page points at GitHub from
  #     a network with no egress, and an operator sees a dead link with no reason beside it — the
  #     failure is indistinguishable from a broken page, and it is the one an air-gapped install hits
  #     first. This is an addresses-and-modes change, not a secret.
  - target: { kind: Deployment, name: console }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: console }
      spec:
        template:
          spec:
            containers:
              - name: console
                env:
                  - { name: HEROS_RELEASE_OFFLINE, value: "1" }
                  - { name: HEROS_EDITION, value: "airgapped" }

  # 2) Replace agentd's egress: the stores stay; the PUBLIC 0.0.0.0/0 rule is gone, replaced by the
  #    on-prem gateway CIDR only. A NetworkPolicy egress list has no merge key, so this strategic-merge
  #    REPLACES the whole list — there is no public-internet rule left to leak through.
  - target: { kind: NetworkPolicy, name: agentd }
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: agentd }
      spec:
        egress:
          - to:
              - podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
            ports: [{ protocol: TCP, port: 5432 }]
          - to:
              - podSelector: { matchLabels: { app.kubernetes.io/name: objectstore } }
            ports: [{ protocol: TCP, port: 9000 }]
          - to:
              - podSelector: { matchLabels: { app.kubernetes.io/name: queue } }
            ports: [{ protocol: TCP, port: 4222 }, { protocol: TCP, port: 8222 }]
          - to:
              - podSelector: { matchLabels: { app.kubernetes.io/name: vectorstore } }
            ports: [{ protocol: TCP, port: 6333 }, { protocol: TCP, port: 6334 }]
          - to:
              - podSelector: { matchLabels: { app.kubernetes.io/name: graphstore } }
            ports: [{ protocol: TCP, port: 7474 }, { protocol: TCP, port: 7687 }]
          # The ONLY off-cluster egress: the operator's on-prem LLM gateway. No public internet.
          - to:
              - ipBlock: { cidr: 10.100.0.0/24 }   # 🔴 replace with ONPREM_GATEWAY_CIDR
            ports: [{ protocol: TCP, port: 8080 }]
