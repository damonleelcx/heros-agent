# airgapped SecretStore — the operator's ON-PREM store (HashiCorp Vault), reached inside the cluster.
# No cloud dependency, no public egress. Auth is a Kubernetes service-account token the operator's Vault
# trusts; there is no bootstrap secret in this manifest.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: heros-store
spec:
  provider:
    vault:
      server: "http://vault.heros.svc:8200"   # 🔴 replace with the operator's on-prem Vault address
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "heros"
          serviceAccountRef:
            name: heros-secrets
