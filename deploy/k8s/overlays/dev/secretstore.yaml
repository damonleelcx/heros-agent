# dev SecretStore — a fake/in-cluster provider so local work needs no cloud account. It reads from a
# Kubernetes Secret the developer creates OUT OF BAND (never committed): the store is a reference, and
# the values still live outside the manifest tree. In dev this is convenience; the guarantee that no
# plaintext Secret is COMMITTED holds identically.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: heros-store
spec:
  provider:
    kubernetes:
      remoteNamespace: heros
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: default
