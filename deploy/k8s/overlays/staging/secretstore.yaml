# staging SecretStore — AWS Secrets Manager reached by an AMBIENT workload identity (IRSA). There is NO
# bootstrap secret in this manifest: the service account is annotated with the IAM role, and the store
# authenticates as that role. A credential shipped in the manifest would be a plaintext credential in
# git the moment it was committed — an irreversible one-way door (Decision 4).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: heros-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: heros-secrets   # annotated with eks.amazonaws.com/role-arn out of band
