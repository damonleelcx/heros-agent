# Credentials come from AWS Secrets Manager through External Secrets, which is already installed on
# this cluster and already used by both other tenants. Nothing here holds a value.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: heros-eval
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No auth block: External Secrets picks up the EC2 instance role (`heros-vm`) through IMDS,
      # which is how the opportunity-bridge store in this cluster is configured too.
---
# 🔴 EVERY property named here must exist in the store. External Secrets fails the WHOLE secret when
# one property is missing — not just that key — so a typo in any single line below leaves the
# deployment with no credentials at all rather than with one blank one. That is the good failure
# mode, but it means this list and the JSON in `heros/eval` have to be edited together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: heros-eval
  namespace: heros-eval
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets
  target:
    name: heros-eval
    creationPolicy: Owner
    # Retain: deleting this ExternalSecret must not take the live credentials with it while pods are
    # still running on them.
    deletionPolicy: Retain
  data:
    - secretKey: QWEN_API_KEY
      remoteRef: {key: heros/eval, property: qwen-api-key}
    - secretKey: HEROS_DATABASE_URL
      remoteRef: {key: heros/eval, property: database-url}
    - secretKey: HEROS_BOOTSTRAP_EMAIL
      remoteRef: {key: heros/eval, property: bootstrap-email}
    - secretKey: HEROS_BOOTSTRAP_PASSWORD
      remoteRef: {key: heros/eval, property: bootstrap-password}
    - secretKey: HEROS_SMTP_USERNAME
      remoteRef: {key: heros/eval, property: smtp-username}
    - secretKey: HEROS_SMTP_PASSWORD
      remoteRef: {key: heros/eval, property: smtp-password}
