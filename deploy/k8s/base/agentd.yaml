# agentd — the Go platform service: the control-plane + data-plane API and the aggregator of /readyz.
#
# 🔴 ONE REPLICA, ON A PERSISTENT CLAIM — and the reason is a correction, so it is recorded here rather
# than in a commit message nobody reads at 3am.
#
# This was `replicas: 2` over a per-pod `emptyDir`, justified by a comment claiming "its DURABLE state is
# Postgres". That claim was false: agentd's ledger is SQLite at HEROS_DATA_DIR (tenant credentials, the
# registries, memory, the tool index, the inbox). Two replicas therefore meant TWO INDEPENDENT DATABASES
# behind one Service, answering differently depending on which pod you reached — and `emptyDir` meant
# every one of them was destroyed on every rollout, which `maxSurge: 1, maxUnavailable: 0` guaranteed
# would happen on each apply. A deployment whose default upgrade path silently loses tenant credentials
# is not a scaling trade-off; it is data loss with a scaling story attached (八级法则 L1/L3: stability is
# never traded for implementation convenience).
#
# So: one replica, a PersistentVolumeClaim, and `Recreate` — because a ReadWriteOnce claim cannot be held
# by the old and new pod at once, and a rolling update over one would deadlock waiting for a volume the
# terminating pod still has.
#
# The horizontal-scaling door (FR4) is not closed, it is simply not walked through: when the ledger's
# contents move to the platform database, agentd becomes genuinely stateless and the replica count goes
# back to being a value. That is the same posture Decision 6 takes with Postgres HA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentd
  labels:
    app.kubernetes.io/name: agentd
    heros.dev/plane: control-and-data     # the NetworkPolicy selects on this
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentd
  strategy:
    # Recreate, not RollingUpdate: see the ReadWriteOnce claim above. The brief unavailability during an
    # upgrade is stated in deploy/README.md rather than hidden behind a rollout policy that cannot run.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentd
        heros.dev/plane: control-and-data
    spec:
      securityContext:
        runAsNonRoot: true
        # 🔴 runAsUser IS REQUIRED HERE, and its absence was not a hardening gap — it stopped the pod
        # from starting at all, on every substrate:
        #
        #   Error: container has runAsNonRoot and image has non-numeric user (nonroot),
        #          cannot verify user is non-root
        #
        # `runAsNonRoot: true` obliges the KUBELET to prove the container is not uid 0 before it starts.
        # The Dockerfile says `USER nonroot:nonroot` — a NAME — and the kubelet cannot resolve a name to
        # a uid without reading the image's /etc/passwd, which it will not do. So it refuses, and the
        # pod sits in CreateContainerConfigError forever. Naming the uid is what makes the assertion
        # checkable rather than merely stated.
        #
        # 65532 is distroless's `nonroot`, the same value fsGroup uses below and the same identity the
        # Dockerfile gives the data directory. All three must move together if the base image changes.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
        # 🔴 fsGroup, and it is load-bearing on the SAME defect Compose hit: a freshly provisioned
        # PersistentVolume is root-owned, the container runs as nonroot on a read-only rootfs, and the
        # process cannot create its ledger — `unable to open database file` (SQLITE_CANTOPEN), on every
        # boot, forever. fsGroup makes the kubelet chown the volume to this GID on mount.
        #
        # 65532 is distroless's `nonroot`. It matches the image's own user, so this is not a number
        # chosen to make something work — it is the same identity the Dockerfile gives the data
        # directory, expressed in the place Kubernetes reads it.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: agentd
          image: ghcr.io/heros-foreal/agentd
          args: []
          ports:
            - { name: http, containerPort: 4321 }
            # The OPERATOR admin API, when this deployment federates one. Named `admin-api` rather than
            # folded into `http` because they are different origins with different callers, and only one
            # of them may ever appear behind an Ingress.
            - { name: admin-api, containerPort: 4311 }
          env:
            - { name: HEROS_LISTEN_ADDR, value: "0.0.0.0:4321" }
            - { name: HEROS_DATA_DIR, value: "/var/lib/heros" }
            # The platform's config file, projected read-only from the `heros-platform` Secret. It carries
            # the TENANT CREDENTIALS the two console BFFs authenticate with — the one value that cannot be
            # an environment variable, because a credential set is a LIST, not a string. On Compose the
            # same file comes from ./config; here it comes from the operator's external store, like every
            # other secret.
            - { name: HEROS_CONFIG, value: "/etc/heros/config.json" }
            # The PLATFORM DATABASE. agentd applies db/migrations/postgres at boot through a ledger it
            # READS (so a second apply changes no schema) and PROBES this database on /readyz under the
            # name `postgres`. It replaced HEROS_DATASTORE_NAME, which only renamed the LOCAL ledger's
            # ping — producing a `postgres` component that could not go red while Postgres was down.
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: heros-platform, key: database-url } }
            # The password, separately — libpq (and lib/pq) reads PGPASSWORD for anything the connection
            # string omits. Optional, because either shape works here: put the password inside
            # `database-url` in your secret store, or supply it under `postgres-password` and leave the
            # DSN without one. The manifest carries neither, so this is about which shape your STORE
            # holds — and the second keeps a DSN with an embedded credential from existing at all, which
            # is the shape credential scanners match and cannot tell from an interpolation.
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: heros-platform, key: postgres-user, optional: true } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: heros-platform, key: postgres-password, optional: true } }
            # The secret seam for the platform's OWN model calls. Selected here; the credentials come
            # from the external store the overlay's ExternalSecret materialises, resolved at call time.
            - { name: HEROS_SECRETS_SOURCE, value: "aws-secrets-manager" }
            # 🔴 REQUIRED whenever the source is aws-secrets-manager, and resolved AT BOOT: without
            # either of these the process exits with "requires either HEROS_SECRETS_AWS_IDS or
            # HEROS_SECRETS_AWS_PREFIX to locate the secrets" and the pod CrashLoopBackOffs. The prefix
            # expands to one secret per supported provider — `heros/providers/openai`,
            # `heros/providers/anthropic`, … — so adding a provider needs no manifest edit. The secrets
            # need not exist yet: the map is built at boot, but a missing one surfaces only at the first
            # model call, named and fail-closed.
            - { name: HEROS_SECRETS_AWS_REGION, value: "us-east-1" }
            - { name: HEROS_SECRETS_AWS_PREFIX, value: "heros/providers/" }
            # The provider credentials for HEROS_SECRETS_SOURCE=env. Absent here, because this base
            # resolves them from the external store at call time — but DECLARED, because the airgapped
            # overlay sets the source to `env`, and a deployment that switches the source without these
            # names present has no provider credentials at all and discovers it at the first model call.
            # They were missing from this substrate entirely until check-env-parity.sh looked.
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: heros-platform, key: openai-api-key, optional: true } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: heros-platform, key: anthropic-api-key, optional: true } }
            # ── P21 COLLECTION ────────────────────────────────────────────────────────────────────
            #
            # 🔴 BILLING_MODE's PRESENCE mounts checkout, plan changes and the provider webhook; unset
            # mounts none of them and leaves P7 billing fully served. `live` MOVES REAL MONEY and is
            # therefore declared, never inferred — and a value that is neither `test` nor `live` is
            # refused rather than defaulted, because both defaults are wrong in a way only a customer
            # discovers. Set it in the OVERLAY, not here: the base must not decide that a cluster
            # charges people.
            - { name: BILLING_MODE, value: "" }
            # The two credentials, under the same reserved logical names the aws-secrets-manager source
            # resolves (`billing_provider`, `billing_webhook`). Optional, so a cluster that declares no
            # mode needs neither key present in its store.
            - name: BILLING_PROVIDER_API_KEY
              valueFrom: { secretKeyRef: { name: heros-platform, key: billing-provider-api-key, optional: true } }
            - name: BILLING_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: heros-platform, key: billing-webhook-secret, optional: true } }
            - { name: HEROS_VERSION, value: "" }
            # Backing-store credentials agentd reads through internal/config. Optional: absent means the
            # capability that dials that store is not mounted on this deployment yet.
            - name: QDRANT_API_KEY
              valueFrom: { secretKeyRef: { name: heros-platform, key: qdrant-api-key, optional: true } }
            - name: NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: heros-platform, key: neo4j-password, optional: true } }
            - name: HEROS_INBOX_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: heros-platform, key: inbox-signing-key, optional: true } }
            # Which build this is, on the release surface. A NAME, never a price or a plan tier. The P24
            # reporting switches are deliberately absent from every deployment manifest (P24 task 7.4):
            # an empty slot is one `--set` from being filled, in a file a customer edits without reading,
            # and those integrations belong to the platform's own hosted deployment, not to a customer's.
            - { name: HEROS_EDITION, value: "kubernetes" }
            # ── P28 SELF-SERVE IDENTITY AND MAIL ─────────────────────────────────────────────────
            #
            # 🔴 Sign-up is OFF unless an overlay says otherwise, and it is DECLARED rather than inferred
            # from whether an identity provider is configured. The three deployment shapes want three
            # different answers, so no single inference is right, and an air-gapped install must not grow
            # a registration form by upgrading.
            - { name: HEROS_SELF_SERVE_SIGNUP, value: "0" }
            # The analysis placement a NEW organization is created with.
            #
            # 🔴 EMPTY here, and empty means UNSET rather than a default of `platform`. `disabled` is
            # every tenant's placement until somebody decides otherwise (Q2), and the two failure modes
            # are not symmetrical: a missing analysis is a missing enrichment, while analysing an org
            # nobody meant to enrol reads somebody's source under this platform's credential and spends
            # this platform's money on it. The quiet option has to be the safe one, so a deployment that
            # says nothing keeps the default.
            #
            # It seeds an EXPLICIT row per organization rather than changing what an absent row means,
            # so every enrolled org carries a reason, can be disabled individually, and an operator can
            # still tell a decision from a default. An unparseable value FAILS THE BOOT — a deployment
            # that meant `platform` and typed `plaftorm` would otherwise come up healthy and enrol
            # nobody, which is the silent half of the failure this variable exists to prevent.
            - { name: HEROS_SIGNUP_PLACEMENT, value: "" }
            # The origin the links in outgoing mail point at. There is NO default: a guessed origin
            # produces a link that 404s in somebody's inbox, which looks like a broken product rather
            # than an unconfigured one. Set it in the overlay that knows the hostname.
            - { name: HEROS_CONSOLE_URL, value: "" }
            # The first owner on a deployment with no sign-up form. Boot mints a single-use password-set
            # link for this address if it has no password, and does nothing if it has one. Empty here:
            # the base must not name a person.
            - { name: HEROS_BOOTSTRAP_OWNER_EMAIL, value: "" }
            # ── Mail (P28) ────────────────────────────────────────────────────────────────────────
            #
            # 🔴 DECLARED though empty, for the reason the provider credentials above are: a deployment
            # that turns mail on by setting these in an overlay needs the names to exist here, and one
            # that leaves them empty gets the OPERATOR FALLBACK — confirmation and reset links written to
            # an operator-readable surface with a WARN, and `/readyz` reporting `mail_configured: false`.
            # That is a working configuration and emphatically not the one most operators think they
            # have, which is why it is a reported value rather than a silent default.
            #
            # HEROS_SMTP_TLS defaults to starttls and REFUSES clear text to a non-loopback host: a reset
            # link crossing a network in the clear is the credential this whole capability protects.
            - { name: HEROS_SMTP_HOST, value: "" }
            - { name: HEROS_SMTP_PORT, value: "" }
            - { name: HEROS_SMTP_FROM, value: "" }
            - { name: HEROS_SMTP_TLS, value: "" }
            - name: HEROS_SMTP_USERNAME
              valueFrom: { secretKeyRef: { name: heros-platform, key: smtp-username, optional: true } }
            - name: HEROS_SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: heros-platform, key: smtp-password, optional: true } }
            # ── Operator identity (P8/P22) ────────────────────────────────────────────────────────
            #
            # 🔴 `configured` is NOT a value this side accepts, and used to be the default here. It is the
            # CONSOLE's vocabulary (web/admin-console/src/lib/identity.ts); the platform's selector is
            # `adminidentity.ProviderFromEnv`, whose values are test | oidc | saml. The two selectors
            # shared a name and had disjoint value sets, so a manifest could look configured on both sides
            # and federate on neither — and nothing failed, because nothing in agentd read this at all
            # until internal/adminlaunch. Empty here: a cluster that federates states so in its overlay,
            # and one that does not serves no admin API, which /readyz reports as `admin_idp` absent.
            - { name: ADMIN_IDENTITY_MODE, value: "" }
            # 🔴 From the STORE, not an empty literal patched per overlay. These are deployment-specific
            # and they are the two that were being set on the live cluster out of band — so every
            # `kubectl apply -k overlays/prod` reverted operator SSO to off, silently, because an empty
            # mode simply serves no admin API. `optional: true` keeps a cluster that federates with
            # nobody bootable: it gets "", which with an empty mode is the correct not-federated state.
            - name: ADMIN_IDP_ISSUER
              valueFrom: { secretKeyRef: { name: heros-platform, key: admin-idp-issuer, optional: true } }
            - name: ADMIN_IDP_CLIENT_ID
              valueFrom: { secretKeyRef: { name: heros-platform, key: admin-idp-client-id, optional: true } }
            # A JSON array of the EXACT callback URIs, matched character for character. Three values must
            # agree or sign-in fails at a different step each time: this one, the console's
            # ADMIN_IDP_CALLBACK_URL, and the app's registered redirect URI at the IdP.
            - { name: ADMIN_IDP_REDIRECTS, value: "" }
            # Both are REQUIRED once federated, and adminlaunch refuses the boot without them. Left empty
            # they do not disable WebAuthn — TOTP keeps working, so sign-in looks fine, while the origin
            # allowlist holds one empty string that matches nothing and every security key silently fails.
            - { name: ADMIN_CONSOLE_ORIGIN, value: "" }
            - { name: ADMIN_WEBAUTHN_RP_ID, value: "" }
            # The admin API's OWN listener (P8 Decision 11): a separate origin needs a separate server,
            # not a route group on the customer mux. 🔴 This port is deliberately absent from every
            # Ingress — its only caller is the admin BFF, inside the cluster, holding the credential.
            - { name: ADMIN_API_LISTEN_ADDR, value: "0.0.0.0:4311" }
            # Every component the deployment ships, aggregated into /readyz by health URL. Postgres is
            # NOT in this list — it is probed directly, by connection.
            # ── The two PUBLISHED CATALOGS ────────────────────────────────────────────────────────
            #
            # These declare WHERE each file goes, not that one is there. Both carry PRICES and neither is
            # ever git-tracked (internal/plancfg and internal/modelcatalog each fence the whole git index
            # against a committed catalog), so the deployment names the path and the operator supplies
            # the file — as two more keys (`plans.json`, `models.json`) in the `heros-platform` Secret
            # this pod already projects read-only at /etc/heros. A Secret key cannot contain a slash, so
            # they sit beside config.json rather than under a catalogs/ subdirectory.
            #
            # A path with no file behind it reads as NOT PUBLISHED (launch stats it at boot), so a fresh
            # install with neither file gets the same clean "not configured, here is the path" it got
            # when the variables were unset — not a mounted billing page that fails on its first read.
            #
            # plans.json gates billing AND P12 delivery (entitlement); models.json gates the proposal
            # generator, because the registry records no capability tier or cost per run.
            - { name: PLAN_CATALOG_PATH, value: "/etc/heros/plans.json" }
            - { name: MODEL_CATALOG_PATH, value: "/etc/heros/models.json" }
            - { name: CONSOLE_HEALTH_URL, value: "http://console:4320/api/health" }
            - { name: ADMIN_CONSOLE_HEALTH_URL, value: "http://admin-console:4310/api/health" }
            - { name: OBJECT_STORE_HEALTH_URL, value: "http://objectstore:9000/minio/health/ready" }
            - { name: QUEUE_HEALTH_URL, value: "http://queue:8222/healthz" }
            - { name: VECTOR_STORE_HEALTH_URL, value: "http://vectorstore:6333/readyz" }
            - { name: GRAPH_STORE_HEALTH_URL, value: "http://graphstore:7474/" }
          # Liveness reads /healthz (the process serves); readiness reads /readyz (dependencies
          # reachable + the aggregated component verdict). Both read a HEALTH ENDPOINT, never a UI.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: ledger, mountPath: /var/lib/heros }
            - { name: platform-config, mountPath: /etc/heros, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # `optional: true` so a deployment that has not yet provisioned a credential set still starts —
        # it comes up with agentd's built-in defaults, which is a legitimate state for a first apply.
        # 🔴 It is NOT a silent one: /readyz and the boot log both report what is configured, and
        # deploy/scripts/up.sh's Compose equivalent asserts after boot that auth is actually enforced.
        # Do the same here before putting a cluster in front of users.
        - name: platform-config
          secret:
            secretName: heros-platform
            optional: true
            items:
              - { key: config-json, path: config.json }
              # 🔴 THE PUBLISHED PLAN CATALOG. The env block above names where this file goes and says
              # the operator supplies it "as two more keys in the heros-platform Secret this pod already
              # projects" — and until this line existed that described a mechanism that did not exist. An
              # `items:` list is exhaustive: a key not named here is NOT projected, so a store holding a
              # perfectly good plans.json still produced an /etc/heros with only config.json in it,
              # billing reported "no plan catalog is published", and the sentence explaining how to
              # publish one was describing the thing that was broken.
              #
              # ⚠️ A key named here and ABSENT from the Secret stops the pod from starting: `optional`
              # above covers a missing SECRET, not a missing key, and a secret volume has no per-item
              # optional. So this key must be synced by the ExternalSecret on every cluster that applies
              # this base — see externalsecrets.yaml, where it is not marked optional for that reason.
              #
              # ⚠️ Nor may it be empty. `launch.publishedCatalog` only STATS the path, so a zero-byte
              # file counts as published and then fails to parse — which is reported (billing goes absent
              # naming the parse error) but is a worse state than having no catalog at all. A cluster
              # that sells nothing should carry no plans-json key and not apply this line.
              #
              # models.json IS projected now. It was absent deliberately while this deployment published
              # no model catalog — "honestly unmounted" was the right state for a cluster with nothing
              # to declare. It now has something to declare, and the absence had a second cost the
              # original note did not see: `modelcatalog.SeedRegistry` reads this file at boot and is
              # the ONLY thing that creates a P2 model version. With no catalog the registry held zero
              # models, so a HEROS agent definition had no `model_ref` it could name at all.
              #
              # ⚠️ Same rule as plans-json in both directions: this key must be synced by the
              # ExternalSecret on every cluster applying this base, and it may not be empty — the
              # loader refuses a catalog publishing no models, on the grounds that an empty catalog and
              # no catalog are different things and such a file says neither.
              - { key: plans-json, path: plans.json }
              - { key: models-json, path: models.json }
        # The ledger is USER STATE (FR22), not scratch: tenant credentials, the registries, memory, the
        # tool index, the inbox. It was an emptyDir, which destroyed all of it on every rollout.
        - name: ledger
          persistentVolumeClaim: { claimName: agentd-ledger }
        - { name: tmp, emptyDir: {} }
---
# The ledger's claim. ReadWriteOnce, which is what forces `Recreate` above — and which is honest about
# what this volume is: a single SQLite file one process opens, not shared storage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentd-ledger
  labels:
    app.kubernetes.io/name: agentd
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentd
  labels:
    app.kubernetes.io/name: agentd
spec:
  selector:
    app.kubernetes.io/name: agentd
  ports:
    - { name: http, port: 4321, targetPort: http }
    # The operator admin API. In-cluster only: no Ingress references this port, and the credential gate
    # in internal/api/adminconsole.go refuses anything that did not come through the admin BFF anyway —
    # two independent reasons, because "we did not add an Ingress rule" is one edit away from being false.
    - { name: admin-api, port: 4311, targetPort: admin-api }
---
# 🔴 minAvailable: 0, and the zero is the honest value, not an oversight.
#
# kubernetes-delivery requires a PDB for every workload with replicas > 1. agentd now runs ONE replica on
# a ReadWriteOnce claim, so there is no "last available replica" to protect: a `minAvailable: 1` here
# would not make the service survive a drain, it would BLOCK the drain forever, because no second replica
# can ever come up to satisfy it. A budget that can never be met is not availability, it is a node that
# cannot be patched.
#
# The PDB is kept rather than deleted so the eviction is deliberate and visible in `kubectl get pdb`
# alongside the others. When the ledger moves to the platform database and the replica count goes back up
# (see the Deployment's comment), this returns to minAvailable: 1.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentd
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentd
