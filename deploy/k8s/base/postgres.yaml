# Postgres — the stateful store for eval + lineage. A single-writer instance: a documented SINGLE
# POINT OF FAILURE (Decision 6) whose acceptance is VOID without the backup CronJob below. The
# stateless data plane scales horizontally; this stays a documented single point whose availability
# rests on restart + backup. See deploy/README.md §Backups for the SPOF blast radius and restore.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    heros.dev/plane: data
spec:
  serviceName: postgres
  replicas: 1                         # single-writer, no split-brain; replicas:1 => no PDB required
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        heros.dev/plane: data
    spec:
      securityContext:
        runAsNonRoot: true
        # 🔴 runAsUser is REQUIRED, not hardening. Without it the kubelet cannot verify the image's
        # string user is non-root and refuses to start the container:
        #   Error: container has runAsNonRoot and image has non-numeric user
        # The pod then sits in CreateContainerConfigError forever, on every substrate.
        # 999 is the postgres image's `postgres` user, matching the fsGroup below.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres
          ports:
            - { name: pg, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: heros }
            - { name: POSTGRES_USER, value: heros }
            # The password comes from the operator's external store via the ExternalSecret, NEVER a
            # committed plaintext Secret (see externalsecrets.yaml).
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: heros-postgres, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "heros", "-d", "heros"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "heros", "-d", "heros"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - { name: pg, port: 5432, targetPort: pg }
---
# The backup that makes accepting the single-Postgres SPOF a sound call (Decision 6). It ships WITH the
# deploy — not as a follow-up — and the dump FAILS LOUD on empty: every failure path deletes the
# partial file so a zero-byte backup cannot form a poisoned rollback chain.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # The NetworkPolicy selects backup pods on this label to permit their egress to postgres.
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # 🔴 Same defect the Deployments had, and it is WORSE on a CronJob because it is
            # invisible: the schedule fires, the pod cannot start, and it retries silently
            # forever. This one failed 6,000+ times over 22 hours while `kubectl get cronjob`
            # showed a healthy schedule. A job that never runs and a job that found nothing to
            # do look identical from outside — which is exactly what the base's own
            # NetworkPolicy comment warns about for this same workload.
            # 999 is the postgres image's `postgres` user, matching the backup volume's fsGroup.
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-backup
              image: postgres
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # 🔴 WAIT FOR THE DATABASE TO BE REACHABLE BEFORE DUMPING. This is not belt-and-braces;
                  # without it the backup fails on essentially every run, and does so silently.
                  #
                  # A CNI programs a NEW pod's NetworkPolicy rules ASYNCHRONOUSLY. A CronJob pod that
                  # opens a connection in its first instants can therefore be rejected by a policy that
                  # permits it — measured here as: connect immediately => "connection refused" and a
                  # 0-byte dump; sleep 15 first => a 174KB dump, same pod spec, same labels, same policy.
                  # Long-lived Deployments never notice because they are minutes old before they matter.
                  #
                  # A backup is exactly the workload where this is worst: `kubectl get cronjob` shows a
                  # healthy schedule, the Job objects churn, and nobody looks until a restore is needed.
                  # This also covers the ordinary case of Postgres restarting during the backup window.
                  i=0
                  until pg_isready -q; do
                    i=$((i+1))
                    if [ "$i" -ge 60 ]; then
                      echo "backup: database not reachable after 120s; FAILING rather than writing a partial dump" >&2
                      exit 1
                    fi
                    sleep 2
                  done
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  # 🔴 EVERY DATABASE ON THIS INSTANCE IS NAMED HERE, and the list is the whole point
                  # of this loop. `pg_dump` with no -d dumps the ONE database in PGDATABASE, so when a
                  # second product's database was added to this instance it was not backed up — and
                  # this CronJob went on reporting OK, because it was faithfully backing up the one
                  # database it had been told about. An unbacked-up database behind a green backup job
                  # is worse than an obviously missing backup: nobody goes looking.
                  #
                  # A database added to this instance and NOT added here is silently unprotected.
                  # PGUSER=heros is a superuser, so it can dump any of them.
                  #
                  # 🔴 The list is an ENV VAR, not a literal, because it differs per deployment and the
                  # alternative is worse. An overlay cannot patch one line of an inline script: to
                  # change which databases are dumped it would have to restate the WHOLE script, and
                  # two copies of a backup script is how one of them quietly stops matching the other.
                  # As a variable it is also greppable — "what is backed up here" is answerable from
                  # `kubectl get cronjob -o yaml | grep BACKUP_DATABASES` instead of by reading shell.
                  #
                  # 🔴 REFUSED IF EMPTY. Unset or blank would make the loop body run zero times, and the
                  # job would exit 0 having dumped nothing — a green backup job protecting no database
                  # at all, which is the exact failure this whole block exists to prevent, in its worst
                  # possible form.
                  if [ -z "${BACKUP_DATABASES:-}" ]; then
                    echo "backup: BACKUP_DATABASES is empty; refusing to report success having dumped nothing" >&2
                    exit 1
                  fi
                  # Unquoted ON PURPOSE: the value is a space-separated list and word splitting is what
                  # turns it into one.
                  # shellcheck disable=SC2086
                  for db in $BACKUP_DATABASES; do
                    out="/backups/${db}-${ts}.dump"; tmp="${out}.partial"
                    if ! pg_dump --format=custom --dbname="$db" --file="$tmp"; then
                      echo "backup: pg_dump FAILED for ${db} at ${ts}" >&2; rm -f "$tmp"; exit 1
                    fi
                    size="$(wc -c < "$tmp" 2>/dev/null || echo 0)"
                    if [ "$size" -lt 512 ]; then
                      echo "backup: ${db} dump ${size}B < 512B; treating as FAILED" >&2; rm -f "$tmp"; exit 1
                    fi
                    mv "$tmp" "$out"; echo "backup: OK ${out} (${size}B)"
                    find /backups -name "${db}-*.dump" -type f -mtime +14 -delete 2>/dev/null || true
                  done
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: heros }
                - { name: PGDATABASE, value: heros }
                # Which databases this deployment holds. See the refusal in the script above: this may
                # not be empty. Overlays override it; the prod overlay does.
                - { name: BACKUP_DATABASES, value: "heros oba heros_eval" }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: heros-postgres, key: password } }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: heros-postgres-backups }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heros-postgres-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 20Gi }
