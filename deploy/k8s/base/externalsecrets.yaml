# External-secret REFERENCES — never a committed plaintext Secret (kubernetes-delivery FR).
#
# 🔴 There is no `kind: Secret` with a `data:`/`stringData:` block anywhere in this tree, and CI
# (scripts/deploy/check-no-plaintext-secrets.sh) fails the build if one is ever committed. The workloads
# above reference secrets by `secretKeyRef`; the actual Secret objects are MATERIALISED AT APPLY TIME by
# the External Secrets Operator from the operator's own store (AWS Secrets Manager / Vault / etc). The
# value lives only in that store — `kubectl get` against the manifest tree that produced these never
# shows a credential.
#
# The `SecretStore` (which backend, which auth) is overlay-specific and lives under each overlay: dev
# uses a fake/in-cluster store, prod/staging use the cloud store reached by an AMBIENT workload identity
# (no bootstrap secret in the manifest), airgapped uses the operator's on-prem store. The ExternalSecret
# refresh interval is short so a rotated credential propagates without a redeploy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: heros-postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { name: heros-store, kind: SecretStore }
  target: { name: heros-postgres, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: heros/postgres, property: password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: heros-objectstore
spec:
  refreshInterval: 1h
  secretStoreRef: { name: heros-store, kind: SecretStore }
  target: { name: heros-objectstore, creationPolicy: Owner }
  data:
    - secretKey: root-password
      remoteRef: { key: heros/objectstore, property: root-password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: heros-graphstore
spec:
  refreshInterval: 1h
  secretStoreRef: { name: heros-store, kind: SecretStore }
  target: { name: heros-graphstore, creationPolicy: Owner }
  data:
    - secretKey: auth
      remoteRef: { key: heros/graphstore, property: auth }   # value is "neo4j/<password>"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: heros-console
spec:
  refreshInterval: 1h
  secretStoreRef: { name: heros-store, kind: SecretStore }
  target: { name: heros-console, creationPolicy: Owner }
  data:
    - secretKey: platform-credential
      remoteRef: { key: heros/console, property: platform-credential }
    - secretKey: tenant-assertions
      remoteRef: { key: heros/console, property: tenant-assertions }
    # ── P22 identity (task 7.2) ───────────────────────────────────────────────────────────────────
    #
    # The provider -> secret mapping is CONFIGURATION, not code: adding a federated customer is a change
    # to these `remoteRef`s and to CONSOLE_IDP_TENANT_MAP, never a release. The values live only in the
    # operator's store, reached by an AMBIENT workload identity, so wiring identity creates no bootstrap
    # secret in this tree (secrets-baseline.md 1.1).
    #
    # An identity secret is worse to leak than a provider key in one specific way: it MINTS IDENTITIES.
    # A leaked LLM key spends money until it is rotated; a leaked OIDC client secret or SAML SP private
    # key lets somebody complete another person's sign-in, and by then it has already been used.
    - secretKey: idp-client-secret
      remoteRef: { key: heros/console, property: idp-client-secret }
    - secretKey: saml-sp-private-key
      remoteRef: { key: heros/console, property: saml-sp-private-key }
    # The federation TOPOLOGY. Not a credential, and not committable either: it names every IdP this
    # deployment trusts and every domain each tenant owns.
    - secretKey: idp-tenant-map
      remoteRef: { key: heros/console, property: idp-tenant-map }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: heros-admin-console
spec:
  refreshInterval: 1h
  secretStoreRef: { name: heros-store, kind: SecretStore }
  target: { name: heros-admin-console, creationPolicy: Owner }
  data:
    # The operator BFF's credential — a DIFFERENT remote key than the customer BFF's. The two consoles
    # hold distinct credentials and neither can act with the other's.
    - secretKey: platform-credential
      remoteRef: { key: heros/admin-console, property: platform-credential }
    # The OPERATOR IdP's client secret — a different remote key again. The operator identity domain is
    # disjoint from the customer's at every layer, and its credentials are the last place to blur that.
    - secretKey: admin-idp-client-secret
      remoteRef: { key: heros/admin-console, property: admin-idp-client-secret }
