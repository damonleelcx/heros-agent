# Customer console (P9) — its own origin (Service `console`), distinct from the operator console's. The
# platform credential is server-side only; the browser gets an HttpOnly session cookie and never the key.
#
# 🔴 ONE REPLICA, AND THE WORD "STATELESS" IS GONE — this is a correction, so it is recorded here.
#
# This said "stateless BFF, replicas 2 + PDB". The BFF is not stateless: `web/console/src/lib/session.ts`
# holds sessions in a Map hung off `globalThis`, which is ONE STORE PER PROCESS, and that file's own
# header says so ("a restart ends every session, and a horizontally-scaled console needs a shared
# store"). Two replicas are therefore two disjoint session stores behind one Service: a user signs in on
# pod A, the next request load-balances to pod B, `getSession` finds no record, and they are bounced to
# `/signin?reason=session_ended`. Roughly half of all requests after sign-in, intermittently, with no
# error anywhere — it presents as "the console keeps logging me out", which is nobody's search term.
#
# It is the same defect agentd carried (`replicas: 2` over per-pod state, justified by a comment claiming
# the state lived elsewhere) and the same resolution: run one, and say why. The horizontal-scaling door
# is not closed — when sessions move to the platform database, as the OPERATOR console's already have
# (they are rows in `admin_session`, which is why that Deployment can and does run two), this goes back
# to being a value and the PDB below returns to minAvailable: 1.
#
# ⚠️ ONE REPLICA DOES NOT MAKE SESSIONS DURABLE. A rollout replaces the pod and the new one starts with
# an empty Map, so every user is signed out on each apply — `maxSurge: 1, maxUnavailable: 0` keeps the
# SERVICE up across that, not the sessions. Only a shared store fixes it; this fixes the half where a
# session dies while nothing restarted at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
    heros.dev/plane: control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        heros.dev/plane: control
    spec:
      securityContext:
        runAsNonRoot: true
        # 🔴 runAsUser is REQUIRED, not hardening. Without it the kubelet cannot verify the image's
        # string user is non-root and refuses to start the container:
        #   Error: container has runAsNonRoot and image has non-numeric user
        # The pod then sits in CreateContainerConfigError forever, on every substrate.
        # 1000 is the node image's `node` user.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: ghcr.io/heros-foreal/heros-console
          ports:
            - { name: http, containerPort: 4320 }
          env:
            - { name: PLATFORM_API_BASE, value: "http://agentd:4321" }
            - { name: CONSOLE_TENANT_IDENTITY, value: "configured" }
            - { name: NODE_ENV, value: "production" }
            # The BFF's OWN credential + the assertion->tenant map, from the operator's external store.
            - name: CONSOLE_PLATFORM_CREDENTIAL
              valueFrom: { secretKeyRef: { name: heros-console, key: platform-credential } }
            - name: CONSOLE_TENANT_ASSERTIONS
              valueFrom: { secretKeyRef: { name: heros-console, key: tenant-assertions } }
            # ── P22 identity (task 7.2) ───────────────────────────────────────────────────────────
            #
            # The four values below arrive at RUNTIME, which is the whole point: one image federates
            # against Okta for one customer and Entra for another, and "onboard a customer" is a config
            # change rather than a release. A baked-in issuer would mean the image an operator verified
            # is not the image they run.
            #
            # `CONSOLE_TENANT_IDENTITY` stays `configured` in this base. An overlay sets `oidc` or
            # `saml` and supplies the issuer/client id/allowlists; a base that federated by default
            # would make the open-core deployment — which federates with nobody — the exception.
            - name: CONSOLE_IDP_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: heros-console, key: idp-client-secret, optional: true } }
            - name: CONSOLE_SAML_SP_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: heros-console, key: saml-sp-private-key, optional: true } }
            - name: CONSOLE_IDP_TENANT_MAP
              valueFrom: { secretKeyRef: { name: heros-console, key: idp-tenant-map, optional: true } }
            # The non-secret half of the federation contract: issuer, client id and the callback/ACS
            # allowlists. These are ADDRESSES, not credentials, and they were declared on Compose and
            # missing from this substrate entirely — so a Kubernetes deployment that set
            # CONSOLE_TENANT_IDENTITY=oidc in an overlay had nowhere to put the issuer. An overlay fills
            # them; empty here keeps the open-core base (which federates with nobody) working unchanged.
            #
            # 🔴 A wildcard in either allowlist is REFUSED at load. An allowlist with a wildcard is not
            # an allowlist.
            - { name: CONSOLE_IDP_ISSUER, value: "" }
            - { name: CONSOLE_IDP_CLIENT_ID, value: "" }
            - { name: CONSOLE_IDP_REDIRECT_ALLOWLIST, value: "" }
            - { name: CONSOLE_SAML_IDP_ENTITY_ID, value: "" }
            - { name: CONSOLE_SAML_SP_ENTITY_ID, value: "" }
            - { name: CONSOLE_SAML_IDP_METADATA_URL, value: "" }
            - { name: CONSOLE_SAML_ACS_ALLOWLIST, value: "" }
            # Session lifetime and the bounded upstream call. An unbounded BFF→API call turns a slow
            # platform into a hung browser tab with no error to read.
            - { name: CONSOLE_SESSION_TTL_SECONDS, value: "28800" }
            - { name: CONSOLE_UPSTREAM_TIMEOUT_MS, value: "10000" }
            # Where `file`-sourced identity credentials are read from, at the MOMENT OF USE, so a rotated
            # file lands on the next sign-in with no restart. The airgapped overlay sets the source.
            - { name: HEROS_SECRETS_DIR, value: "/var/run/secrets/heros" }
            # Which SOURCE identity credentials resolve from, reported on /api/health so the claim is
            # checkable from the running system rather than from this file. `env` here because the
            # External Secrets Operator has already materialised the values into this pod's environment
            # with no bootstrap secret; an air-gapped overlay sets `file` and mounts them instead.
            - { name: HEROS_SECRETS_SOURCE, value: "env" }
            - name: CONSOLE_IDP_SECRET_MAP
              valueFrom: { secretKeyRef: { name: heros-console, key: idp-secret-map, optional: true } }
            - { name: CONSOLE_IDP_TIMEOUT_MS, value: "5000" }
            # ── Legal & developer docs (P23) ──────────────────────────────────────────────────────
            - { name: CONSOLE_CONSENT_GATE, value: "" }
            # HEROS_CONTENT_ROOT is deliberately NOT declared. Its own definition
            # (web/console/src/lib/reading/corpus.ts) says it exists for ONE caller — the fence fixtures
            # that must point a scan at a deliberately broken corpus. Declaring it here as "" did not
            # mean "use the in-image default": it made the corpus root the EMPTY STRING, and the console
            # reported 14 documentation pages and 4 legal documents as unpublished while serving them
            # from its own image. The corpus ships in the image (ADR-011); absence is the correct config.
            # ── Analytics & error monitoring (P24) ────────────────────────────────────────────────
            #
            # All four OPTIONAL, all four absent by default. A deployment that reports to nobody is the
            # expected state, not a degraded one — a warning that fires on every correct install teaches
            # an operator to ignore warnings.
            # ── Release surface (P20) ─────────────────────────────────────────────────────────────
            # The air-gapped overlay sets HEROS_RELEASE_OFFLINE — a download page pointing at GitHub
            # from a network with no egress shows an operator a dead link and no reason.
            - { name: HEROS_VERSION, value: "" }
            - { name: HEROS_EDITION, value: "kubernetes" }
            - { name: HEROS_SLUG_MANIFEST, value: "" }
            - { name: HEROS_RELEASE_OFFLINE, value: "" }
          # Probes read the console's OWN health endpoint (never a rendered page).
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels: { app.kubernetes.io/name: console }
spec:
  selector: { app.kubernetes.io/name: console }
  ports:
    - { name: http, port: 4320, targetPort: http }
---
# 🔴 minAvailable: 0, and the zero is the honest value — the same correction agentd's PDB carries.
#
# A `minAvailable: 1` budget over a ONE-replica Deployment does not protect availability, it BLOCKS every
# node drain forever: the single pod's eviction is denied because it would drop availability to zero, and
# no replacement can start until it terminates. A budget that can never be met is not availability, it is
# a node nobody can patch.
#
# Kept rather than deleted so the eviction posture is deliberate and visible in `kubectl get pdb` beside
# the others. It returns to minAvailable: 1 with the replica count, when sessions move to a shared store.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: console
