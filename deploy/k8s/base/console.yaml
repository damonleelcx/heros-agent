# Customer console (P9) — stateless BFF, replicas 2 + PDB. Its own origin (Service `console`), distinct
# from the operator console's. The platform credential is server-side only; the browser gets an
# HttpOnly session cookie and never the key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
    heros.dev/plane: control
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        heros.dev/plane: control
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: ghcr.io/heros-foreal/heros-console
          ports:
            - { name: http, containerPort: 4320 }
          env:
            - { name: PLATFORM_API_BASE, value: "http://agentd:4321" }
            - { name: CONSOLE_TENANT_IDENTITY, value: "configured" }
            - { name: NODE_ENV, value: "production" }
            # The BFF's OWN credential + the assertion->tenant map, from the operator's external store.
            - name: CONSOLE_PLATFORM_CREDENTIAL
              valueFrom: { secretKeyRef: { name: heros-console, key: platform-credential } }
            - name: CONSOLE_TENANT_ASSERTIONS
              valueFrom: { secretKeyRef: { name: heros-console, key: tenant-assertions } }
            # ── P22 identity (task 7.2) ───────────────────────────────────────────────────────────
            #
            # The four values below arrive at RUNTIME, which is the whole point: one image federates
            # against Okta for one customer and Entra for another, and "onboard a customer" is a config
            # change rather than a release. A baked-in issuer would mean the image an operator verified
            # is not the image they run.
            #
            # `CONSOLE_TENANT_IDENTITY` stays `configured` in this base. An overlay sets `oidc` or
            # `saml` and supplies the issuer/client id/allowlists; a base that federated by default
            # would make the open-core deployment — which federates with nobody — the exception.
            - name: CONSOLE_IDP_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: heros-console, key: idp-client-secret, optional: true } }
            - name: CONSOLE_SAML_SP_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: heros-console, key: saml-sp-private-key, optional: true } }
            - name: CONSOLE_IDP_TENANT_MAP
              valueFrom: { secretKeyRef: { name: heros-console, key: idp-tenant-map, optional: true } }
            # Which SOURCE identity credentials resolve from, reported on /api/health so the claim is
            # checkable from the running system rather than from this file. `env` here because the
            # External Secrets Operator has already materialised the values into this pod's environment
            # with no bootstrap secret; an air-gapped overlay sets `file` and mounts them instead.
            - { name: HEROS_SECRETS_SOURCE, value: "env" }
          # Probes read the console's OWN health endpoint (never a rendered page).
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels: { app.kubernetes.io/name: console }
spec:
  selector: { app.kubernetes.io/name: console }
  ports:
    - { name: http, port: 4320, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console
