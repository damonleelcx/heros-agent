# The platform Kubernetes base (P19 kubernetes-delivery, Decision 1).
#
# A COMPLETE, applyable description of the platform — `kubectl kustomize base/` renders the whole thing,
# and what it renders IS what applies. Kustomize over Helm precisely so the artifact you audit is the
# artifact that runs (Decision 1): no values, no conditionals, no named templates hiding the manifest
# behind indirection a private-deploy customer's security review cannot read.
#
# The overlays under ../overlays/{dev,staging,prod,airgapped} express ONLY their differences from this
# base (replica counts, resource sizes, the secret backend, the egress target). This base references
# nothing an overlay must supply EXCEPT secrets — which come from the operator's external store, never
# from a committed manifest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: heros

resources:
  - namespace.yaml
  - agentd.yaml
  - postgres.yaml
  - objectstore.yaml
  - queue.yaml
  - vectorstore.yaml
  - graphstore.yaml
  - console.yaml
  - admin-console.yaml
  - legal-retention.yaml
  - networkpolicy.yaml
  - externalsecrets.yaml

# 🔴 EVERY IMAGE PINNED BY DIGEST — the SAME digest set deploy/images.env gives Docker Compose (D2).
# A CI check (scripts/deploy/check-image-parity.sh) fails the build if these digests diverge from
# images.env, and scripts/deploy/check-digest-pins.sh fails if any of these is a floating tag. The
# `newTag`-less `digest:` form is what makes an apply reproducible: the same digest is the same image.
images:
  # The platform's own three, built for linux/arm64 and pushed to this account's ECR.
  #
  # agentd is at f9e640c and admin-console at 13dcdf0 (PR #100). The customer console stays at
  # 63a3a03: nothing in that PR touches it, and repinning an image whose code did not change would
  # make the pin stop meaning "the tree this was built from".
  #
  # They are at DIFFERENT commits deliberately. v0.22.0 moved all three together because
  # internal/api/install.go serves its install surface from distribution.DocumentedRelease, so a
  # console-only push would leave the API answering an older version than the page showed. Nothing in
  # PR #100 touches a version surface, so each image moves on its own evidence.
  #
  # `newName` retargets the registry; the digest is the artifact. Both must match deploy/images.env
  # exactly or check-image-parity.sh fails the build.
  - name: ghcr.io/heros-foreal/agentd
    newName: 373468206837.dkr.ecr.us-east-1.amazonaws.com/agentd
    digest: sha256:91eeb4294c1e373d9cfff6635f205dae5da7776b1e8d0962b3403ec01d860e92
  - name: ghcr.io/heros-foreal/heros-console
    newName: 373468206837.dkr.ecr.us-east-1.amazonaws.com/heros-console
    digest: sha256:e882d793d83d442fbd1a39e7ff7fa1450ff6173105a7cd4b2cd4c30a027b751e
  - name: ghcr.io/heros-foreal/heros-admin-console
    newName: 373468206837.dkr.ecr.us-east-1.amazonaws.com/heros-admin-console
    digest: sha256:2cf43a088229daa334bea1dc73ed6fd6a1a6c043ae1e82544be1b4ce38d234a2
  - name: postgres
    digest: sha256:6efd0df010dc3cb40d5e33e3ef84acecc5e73161bd3df06029ee8698e5e12c60
  - name: minio/minio
