    digest: sha256:45e0d0d2e619536d2070d582557e1b184adb8895922e3db7a545fb8eb4638099
  - name: postgres
    digest: sha256:6efd0df010dc3cb40d5e33e3ef84acecc5e73161bd3df06029ee8698e5e12c60
  - name: minio/minio
