# Object store — MinIO, the content store for artifacts/diffs. Stateful, single instance with a named
# claim; replicas:1 => no PDB required. Bring-your-own S3 is the managed path (Decision 8); this is the
# self-hostable default the open-core overlay stands up.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objectstore
  labels:
    app.kubernetes.io/name: objectstore
    heros.dev/plane: data
spec:
  serviceName: objectstore
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: objectstore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: objectstore
        heros.dev/plane: data
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - { name: MINIO_ROOT_USER, value: heros }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: heros-objectstore, key: root-password } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: objectstore
  labels: { app.kubernetes.io/name: objectstore }
spec:
  selector: { app.kubernetes.io/name: objectstore }
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
