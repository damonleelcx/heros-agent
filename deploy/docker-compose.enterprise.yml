# Enterprise stack: vector (Qdrant), graph (Neo4j), messaging (NATS).
# Usage: docker compose -f deploy/docker-compose.enterprise.yml --env-file deploy/.env.enterprise up -d

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  neo4j:
    image: neo4j:5.26.0-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/enterprise-change-me}
    volumes:
      - neo4j_data:/data

volumes:
  qdrant_data:
  neo4j_data:
