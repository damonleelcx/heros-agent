# The whole-platform deployment unit — single host / open-core (P19 deployment-topology).
#
# ONE unit, MANY containers, ONE readiness truth. This composes the P0–P18 components — the Go service
# (agentd), Postgres (eval + lineage), the object store, the queue, the vector and graph stores, and
# the customer console — under one aggregated /readyz and one secret contract. The operator console is
# a SEPARATE unit on its own origin (docker-compose.admin-console.yml, P19 Decision 5); it is not
# folded in here, by construction.
#
# Usage (the image set and the secret env are two separate --env-file inputs, on purpose: one is the
# digest-pinned artifact set, the other is deployment secrets):
#
#   cp deploy/images.env deploy/.env.images
#   cp deploy/.env.platform.example deploy/.env.platform     # then fill from your secret store
#   docker compose --env-file deploy/.env.images --env-file deploy/.env.platform \
#     -f deploy/docker-compose.platform.yml up -d
#
# 🔴 SECRETS COME FROM THE ENVIRONMENT OR A SECRET STORE. Never from this file, never from the
# repository, never from a log line, never from a trace attribute, never from a client bundle. The
# `${VAR:?...}` form REFUSES TO START when the variable is unset, with the message attached — a default
# would let the stack come up misconfigured and fail later, somewhere less obvious than `up`.

services:
  # ── Data plane + control plane: the Go service, the aggregator of /readyz ─────────────────────────
  agentd:
    image: ${AGENTD_IMAGE:?set AGENTD_IMAGE from deploy/images.env}
    environment:
      HEROS_LISTEN_ADDR: 0.0.0.0:4321
      HEROS_DATA_DIR: /var/lib/heros
      # The platform's own config file, mounted read-only from ./config. It carries the TENANT
      # CREDENTIALS the two console BFFs authenticate with — the one thing that cannot come from an
      # environment variable, because a credential set is a list, not a string. `up.sh` writes it on a
      # first install and never rewrites it; see "first install determines credentials" in README.md.
      HEROS_CONFIG: /etc/heros/config.json
      # ── The PLATFORM DATABASE (P19 Decision 9) ──────────────────────────────────────────────────
      #
      # agentd applies db/migrations/postgres at boot through a ledger it READS, so a second `up -d` is a
      # no-op, and it PROBES this database on /readyz under the name `postgres`. This replaced
      # HEROS_DATASTORE_NAME, which only renamed the local SQLite ledger's ping: /readyz reported
      # `components.postgres: ready` on a process that had never opened a Postgres connection, and it
      # could not go red no matter what happened to the database it named.
      #
      # Unset it and the Postgres-backed capabilities register unsourced and report 503 not-mounted —
      # a supported single-binary form, not a misconfiguration.
      #
      # 🔴 The password is NOT in the DSN, and that is deliberate on two counts.
      #
      # It travels as PGPASSWORD, which libpq — and lib/pq, verified against a live server — reads for
      # any value the connection string omits. That is the shape the `postgres-backup` service below has
      # always used, so this file now has ONE way of handing Postgres a credential rather than two.
      #
      # The other count: a DSN that embeds the credential between the user and the host is the exact
      # shape credential scanners match, and they cannot tell a `${VAR}` interpolation from a literal.
      # GitGuardian flagged these two lines on the PR that added them. Nothing had leaked — but a scanner
      # that fires on correct code every time this file is touched teaches people to click past it, which
      # is how the real one gets missed. (This comment avoids writing the shape out, for that reason.)
      # No userinfo in the DSN AT ALL — host, port and database only. PGUSER/PGPASSWORD carry the
      # credential, exactly as the `postgres-backup` service below has always done.
      #
      # `${POSTGRES_USER:-heros}@` was not good enough: a URL parser splits that on the colon of its own
      # default-value syntax and reads it as `user:password`, so the string still looks like an embedded
      # credential to a scanner. Removing the userinfo removes the ambiguity rather than arguing with it.
      DATABASE_URL: postgres://postgres:5432/${POSTGRES_DB:-heros}?sslmode=disable
      PGUSER: ${POSTGRES_USER:-heros}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      # The secret seam for the platform's OWN model calls (platform-llm-access). No provider key is in
      # this file; the seam resolves them at call time from the source named here.
      HEROS_SECRETS_SOURCE: ${HEROS_SECRETS_SOURCE:-env}
      # Only read when the source is `aws-secrets-manager`, and then REQUIRED — the boot fails without
      # one of them. Blank here because the single-host default source is `env`.
      HEROS_SECRETS_AWS_REGION: ${HEROS_SECRETS_AWS_REGION:-}
      HEROS_SECRETS_AWS_PREFIX: ${HEROS_SECRETS_AWS_PREFIX:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ── P21 COLLECTION: the declaration, then the two credentials ─────────────────────────────────
      #
      # 🔴 BILLING_MODE's PRESENCE is what mounts checkout, plan changes and the provider webhook.
      # Unset — the default, and where every open-core install stays — mounts none of them, and P7
      # billing is unaffected: reading what a customer owes never required the ability to charge them.
      #
      # ⚠️ `live` MOVES REAL MONEY. It is spelled out rather than inferred from a key prefix, the
      # hostname or NODE_ENV, because nothing this process can observe tells "the operator meant live"
      # apart from "the operator pasted the wrong key" — and guessing wrong charges a customer. A value
      # that is neither `test` nor `live` is REFUSED rather than defaulted: defaulting a typo to test
      # gives an operator a checkout button they believe takes money and does not, discovered by a
      # customer at the worst possible moment.
      BILLING_MODE: ${BILLING_MODE:-}
      # The two credentials, resolved through the SAME secrets seam as the model-provider keys above,
      # under the reserved logical names `billing_provider` and `billing_webhook`. Empty by default so
      # a deployment that declares no mode needs neither. Both are read at the MOMENT OF USE, never
      # held in a field — see internal/billing/secrets.go.
      BILLING_PROVIDER_API_KEY: ${BILLING_PROVIDER_API_KEY:-}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
      # Credentials for the backing stores agentd reads through internal/config. Blank is a legitimate
      # value: the capability that dials that store is not mounted on this deployment yet (see the
      # `provisioned ahead of use` note on those services below).
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      # The inbox's signature-verification key (change-delivery). Unset ⇒ no inbox on this deployment.
      HEROS_INBOX_SIGNING_KEY: ${HEROS_INBOX_SIGNING_KEY:-}
      # ── Error reporting (P24) ────────────────────────────────────────────────────────────────────
      #
      # 🔴 This one can REFUSE THE BOOT, which is why it is documented here beside the others rather than
      # discovered from a crash. Unset ⇒ the ABSENT reporter: no transmit, no warning, `/readyz` reports
      # `absent`, and that is the correct state on a customer install and on an air-gapped network. SET
      # AND UNUSABLE ⇒ a hard boot failure, deliberately: that is a deployment somebody meant to configure
      # and got wrong, and the alternative is a process that looks healthy and reports nothing for a month.
      HEROS_EDITION: ${HEROS_EDITION:-open-core}
      HEROS_VERSION: ${HEROS_VERSION:-}
      # ── Operator identity (P22) ──────────────────────────────────────────────────────────────────
      # Present so `/readyz` can report `admin_idp` on a deployment that ships the operator console.
      # 🔴 `test` | `oidc` | `saml` — NOT `configured`, which used to be the default here and is not a
      # value this side accepts. `configured` is the CONSOLE's vocabulary; the platform's selector is
      # adminidentity.ProviderFromEnv. The two shared a name with disjoint value sets, so a deployment
      # could look configured on both sides and federate on neither. Empty ⇒ no admin API is served,
      # which /readyz reports honestly as `admin_idp` absent.
      ADMIN_IDENTITY_MODE: ${ADMIN_IDENTITY_MODE:-}
      ADMIN_IDP_ISSUER: ${ADMIN_IDP_ISSUER:-}
      ADMIN_IDP_CLIENT_ID: ${ADMIN_IDP_CLIENT_ID:-}
      # A JSON array of the EXACT callback URIs. Must agree character for character with the console's
      # ADMIN_IDP_CALLBACK_URL and with the redirect URI registered at the IdP.
      ADMIN_IDP_REDIRECTS: ${ADMIN_IDP_REDIRECTS:-}
      # Both REQUIRED once federated — adminlaunch refuses the boot without them. Left empty they do not
      # disable WebAuthn: TOTP keeps working, so sign-in looks fine, while the origin allowlist holds one
      # empty string that matches nothing and every security key silently fails.
      ADMIN_CONSOLE_ORIGIN: ${ADMIN_CONSOLE_ORIGIN:-}
      ADMIN_WEBAUTHN_RP_ID: ${ADMIN_WEBAUTHN_RP_ID:-}
      # The operator admin API's OWN listener (P8 Decision 11) — a separate origin needs a separate
      # server, not a route group on the customer mux. 🔴 Not published in `ports:` below: its only
      # caller is the admin BFF on this compose network.
      ADMIN_API_LISTEN_ADDR: ${ADMIN_API_LISTEN_ADDR:-0.0.0.0:4311}
      # Every component the deployment ships, aggregated into /readyz by health URL. A component with no
      # URL is honestly absent; a component WITH a URL that is unreachable turns /readyz not-ready and
      # NAMES itself. Postgres is NOT in this list — it is probed directly, by connection.
      #
      # ADMIN_CONSOLE_HEALTH_URL is set here because the operator console unit shares this network when
      # it is stood up alongside (docker-compose.admin-console.yml). Only the Kubernetes base set it
      # before, so Compose /readyz silently never aggregated the operator console at all — the exact
      # substrate divergence scripts/deploy/check-env-parity.sh now fails the build on.
      # ── The two PUBLISHED CATALOGS ────────────────────────────────────────────────────────────────
      #
      # These declare WHERE each file goes, not that one is there. Both carry PRICES and neither is ever
      # git-tracked (internal/plancfg and internal/modelcatalog each ship an auto-discovering fence over
      # the whole git index that fails the build on a committed catalog), so the deployment names the
      # path and the operator supplies the file.
      #
      # A path with no file behind it reads as NOT PUBLISHED — launch stats it at boot — so a fresh
      # install with neither file gets the same clean "not configured, here is the path" it got when the
      # variables were unset, rather than a mounted billing page that fails on its first read.
      #
      #   plans.json   what a plan costs and what it includes. Without it billing cannot say which plan
      #                a customer is on, and P12 delivery cannot decide whether a tenant is entitled to
      #                have a pull request opened for them — which is why BOTH are gated on it.
      #   models.json  each model's capability tier and cost per run. The registry records neither, and
      #                without them "cheaper" is not expressible, so the proposal generator has nothing
      #                to propose.
      #
      # They live in the `./config` bind this service already mounts read-only at /etc/heros — no new
      # volume, and the same directory an operator already populates for config.json.
      PLAN_CATALOG_PATH: /etc/heros/plans.json
      MODEL_CATALOG_PATH: /etc/heros/models.json
      CONSOLE_HEALTH_URL: http://console:4320/api/health
      ADMIN_CONSOLE_HEALTH_URL: ${ADMIN_CONSOLE_HEALTH_URL:-}
      OBJECT_STORE_HEALTH_URL: http://objectstore:9000/minio/health/ready
      QUEUE_HEALTH_URL: http://queue:8222/healthz
      VECTOR_STORE_HEALTH_URL: http://vectorstore:6333/readyz
      GRAPH_STORE_HEALTH_URL: http://graphstore:7474/
    ports:
      - "${AGENTD_PORT:-4321}:4321"
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_healthy }
      queue: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/agentd", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - agentd-data:/var/lib/heros
      # Read-only: the platform never writes its own credential file. An empty ./config is a legitimate
      # state — agentd falls back to its built-in defaults — but `up.sh` asserts after boot that auth is
      # actually being enforced, because "the config did not load" and "the config said auth off" look
      # identical from outside and only one of them is intended.
      - ./config:/etc/heros:ro
    security_opt: [no-new-privileges:true]

  # ── Stateful store: Postgres (single-writer SPOF — see deploy/README.md; backup ships below) ──────
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE from deploy/images.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heros}
      POSTGRES_USER: ${POSTGRES_USER:-heros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-heros} -d $${POSTGRES_DB:-heros}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ── Postgres backup: ships WITH the deploy (Decision 6). Accepting the SPOF is void without this. ──
  # The dump FAILS LOUD on empty — every failure path deletes the file so a zero-byte backup cannot
  # form a poisoned rollback chain. It is a long-running container that sleeps between cron-shaped runs.
  postgres-backup:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE from deploy/images.env}
    entrypoint: ["/bin/sh", "/opt/heros/pg-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-heros}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-heros}
      BACKUP_CRON: ${POSTGRES_BACKUP_CRON:-17 3 * * *}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - ./scripts/pg-backup.sh:/opt/heros/pg-backup.sh:ro
      - postgres-backups:/var/backups/heros
    security_opt: [no-new-privileges:true]

  # ── Consent-record retention (P23 task 9.7, P19 FR31) ─────────────────────────────────────────────
  #
  # Retention is a legal obligation with a clock on it, so it ships as a scheduled unit rather than as a
  # binary an operator has never been told to run. Two deliberate refusals, both from the job itself:
  #
  #   • it DRY RUNS unless RETENTION_APPLY=1 — a deletion job whose first production run is also its
  #     first run ever is a defect waiting for a quiet weekend;
  #   • with no window it deletes NOTHING and says so. The retention period is a LEGAL answer (seven
  #     years per docs/decisions/p23-one-way-doors.md §1.4), not an engineering default, and a job that
  #     invented one would delete the wrong things confidently.
  #
  # Same image as agentd, second entrypoint: one image set (Decision 2), one digest, one parity row.
  legal-retention:
    image: ${AGENTD_IMAGE:?set AGENTD_IMAGE from deploy/images.env}
    entrypoint: ["/app/legalretention"]
    # `0` is the safe default and the documented refusal: the job prints what it will not do and exits 0.
    # `-apply` is deliberately NOT here — an operator types it, once, on purpose.
    command: ["-window", "${LEGAL_RETENTION_WINDOW:-0}"]
    environment:
      # Password via PGPASSWORD, never inline in the DSN — see the note on agentd above.
      # Host/port/database only; PGUSER/PGPASSWORD carry the credential — see the note on agentd above.
      DATABASE_URL: postgres://postgres:5432/${POSTGRES_DB:-heros}?sslmode=disable
      PGUSER: ${POSTGRES_USER:-heros}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
    # `no` — this is a one-shot job, not a service. Compose has no scheduler; an operator runs it from
    # cron or a timer with `docker compose run --rm legal-retention`, and deploy/README.md gives the
    # line. On Kubernetes it is a real CronJob (deploy/k8s/base/legal-retention.yaml).
    restart: "no"
    profiles: ["jobs"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  # ── Object store: MinIO (content store for artifacts/diffs) ───────────────────────────────────────
  #
  # ⚠️ PROVISIONED AHEAD OF USE (P19 FR32). agentd does not dial this yet — the capability that will
  # (P2's blob fan-out beyond the filesystem store) is not mounted. It is started so the storage exists
  # and is backed up before the data does, and it is listed here rather than left for an operator to
  # infer from a quiet log. The same note applies to the queue, vector and graph stores below.
  objectstore:
    image: ${OBJECT_STORE_IMAGE:?set OBJECT_STORE_IMAGE from deploy/images.env}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ROOT_USER:-heros}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_ROOT_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    volumes:
      - objectstore-data:/data

  # ── Queue: NATS/JetStream (the P2.5 event substrate transport) ────────────────────────────────────
  queue:
    image: ${QUEUE_IMAGE:?set QUEUE_IMAGE from deploy/images.env}
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    volumes:
      - queue-data:/data

  # ── Vector store: Qdrant ──────────────────────────────────────────────────────────────────────────
  vectorstore:
    image: ${VECTOR_STORE_IMAGE:?set VECTOR_STORE_IMAGE from deploy/images.env}
    restart: unless-stopped
    volumes:
      - vectorstore-data:/qdrant/storage

  # ── Graph store: Neo4j ────────────────────────────────────────────────────────────────────────────
  graphstore:
    image: ${GRAPH_STORE_IMAGE:?set GRAPH_STORE_IMAGE from deploy/images.env}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?}
    restart: unless-stopped
    volumes:
      - graphstore-data:/data

  # ── Customer console (P9): its own container, one process, own credential ─────────────────────────
  console:
    image: ${CONSOLE_IMAGE:?set CONSOLE_IMAGE from deploy/images.env}
    environment:
      PLATFORM_API_BASE: http://agentd:4321
      CONSOLE_PLATFORM_CREDENTIAL: ${CONSOLE_PLATFORM_CREDENTIAL:?set CONSOLE_PLATFORM_CREDENTIAL from your secret store}
      CONSOLE_TENANT_IDENTITY: ${CONSOLE_TENANT_IDENTITY:-configured}
      CONSOLE_TENANT_ASSERTIONS: ${CONSOLE_TENANT_ASSERTIONS:?set CONSOLE_TENANT_ASSERTIONS from your secret store}
      # ── Identity federation (P22 task 7.2) ──────────────────────────────────────────────────────
      #
      # `${VAR:-}` interpolation only — a literal here is a hardcoded credential, and
      # scripts/deploy/check-no-plaintext-secrets.sh fails the build on one. The defaults keep an
      # open-core deployment (which federates with nobody) working unchanged: `configured` is still the
      # default mechanism, and an unset identity variable is simply an absent federation.
      CONSOLE_IDP_ISSUER: ${CONSOLE_IDP_ISSUER:-}
      CONSOLE_IDP_CLIENT_ID: ${CONSOLE_IDP_CLIENT_ID:-}
      CONSOLE_IDP_CLIENT_SECRET: ${CONSOLE_IDP_CLIENT_SECRET:-}
      CONSOLE_IDP_REDIRECT_ALLOWLIST: ${CONSOLE_IDP_REDIRECT_ALLOWLIST:-}
      CONSOLE_IDP_TENANT_MAP: ${CONSOLE_IDP_TENANT_MAP:-}
      CONSOLE_SAML_IDP_ENTITY_ID: ${CONSOLE_SAML_IDP_ENTITY_ID:-}
      CONSOLE_SAML_SP_ENTITY_ID: ${CONSOLE_SAML_SP_ENTITY_ID:-}
      CONSOLE_SAML_IDP_METADATA_URL: ${CONSOLE_SAML_IDP_METADATA_URL:-}
      CONSOLE_SAML_ACS_ALLOWLIST: ${CONSOLE_SAML_ACS_ALLOWLIST:-}
      CONSOLE_SAML_SP_PRIVATE_KEY: ${CONSOLE_SAML_SP_PRIVATE_KEY:-}
      CONSOLE_IDP_SECRET_MAP: ${CONSOLE_IDP_SECRET_MAP:-}
      CONSOLE_IDP_TIMEOUT_MS: ${CONSOLE_IDP_TIMEOUT_MS:-5000}
      HEROS_SECRETS_SOURCE: ${HEROS_SECRETS_SOURCE:-env}
      HEROS_SECRETS_DIR: ${HEROS_SECRETS_DIR:-/var/run/secrets/heros}
      CONSOLE_SESSION_TTL_SECONDS: ${CONSOLE_SESSION_TTL_SECONDS:-28800}
      CONSOLE_UPSTREAM_TIMEOUT_MS: ${CONSOLE_UPSTREAM_TIMEOUT_MS:-10000}
      # ── Legal & developer docs (P23) ────────────────────────────────────────────────────────────
      # The consent gate, and the root the published legal/docs corpus is served from. agentd derives
      # the manifest origin from CONSOLE_HEALTH_URL rather than taking a second variable for the same
      # origin — two names for one origin is two things to keep in step.
      CONSOLE_CONSENT_GATE: ${CONSOLE_CONSENT_GATE:-}
      # HEROS_CONTENT_ROOT: intentionally absent — a fixture-only seam, and an empty value here
      # blanks the in-image corpus rather than defaulting to it. See console.yaml.
      # ── Analytics & error monitoring (P24) ──────────────────────────────────────────────────────
      # All four are OPTIONAL and all four default to absent. An open-core or air-gapped deployment that
      # reports to nobody is the expected state, not a degraded one, and it stays silent about it.
      # ── Release surface (P20) ───────────────────────────────────────────────────────────────────
      # HEROS_RELEASE_OFFLINE matters most where it is easiest to forget: an air-gapped install whose
      # download page points at GitHub from a network with no egress shows an operator a dead link and
      # no reason. Set it there.
      HEROS_VERSION: ${HEROS_VERSION:-}
      HEROS_EDITION: ${HEROS_EDITION:-open-core}
      HEROS_SLUG_MANIFEST: ${HEROS_SLUG_MANIFEST:-}
      HEROS_RELEASE_OFFLINE: ${HEROS_RELEASE_OFFLINE:-}
      NODE_ENV: production
    ports:
      - "${CONSOLE_PORT:-4320}:4320"
    depends_on:
      agentd: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

# Each stateful store is a NAMED volume (deployment-topology: "each stateful store is a stateful
# component with a named volume"). A named volume survives `down` and is what backup/restore acts on.
volumes:
  agentd-data:
  postgres-data:
  postgres-backups:
  objectstore-data:
  queue-data:
  vectorstore-data:
  graphstore-data:
