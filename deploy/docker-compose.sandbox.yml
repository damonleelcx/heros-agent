# P3 sandbox isolate — least-privilege runtime posture (sandbox spec §3, tasks 3.2–3.5).
#
# THIS FILE IS THE ENFORCEMENT POINT for the OS-level controls internal/sandbox reports as UNAVAILABLE
# on a bare host: default-deny network egress and a read-only, working-set-scoped filesystem. It is the
# concrete form of sandbox.NewContainedEnforcer — a deployment that runs the isolate inside this posture
# may advertise NetworkDeny + FilesystemScope as in force, and the Go layer still enforces env-scrub and
# resource bounds inside it. On any host WITHOUT this posture, NewOSEnforcer reports those unavailable
# and every untrusted-repo-tool node fails closed (task 3.6) — never a silent downgrade to host access.
#
# Usage (one-shot, per node — an isolate is ephemeral):
#   SANDBOX_WORKSET=/abs/path/to/node-working-set \
#     docker compose -f deploy/docker-compose.sandbox.yml run --rm isolate -c '<tool argv>'
#
# Every field below is asserted by `make sandbox-proof` (scripts/sandbox_proof.py), statically (the
# field is in the resolved spec) and dynamically (the thing it forbids actually fails). Weaken a line
# and the proof goes RED. Do not "temporarily" relax one to make something work — that is the
# silent-downgrade this file exists to prevent.

services:
  isolate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.isolate
    image: heros-agent/isolate:local

    # ---- no network egress (tasks 3.3) --------------------------------------------------------
    # `none` = loopback only, no interface to the outside and no route to the cloud metadata endpoint.
    # Untrusted repo tool code has no sanctioned direct egress: legitimate model/retrieval calls go
    # through the host broker (task 4). This makes "default-deny egress" a property of the RUNTIME, not
    # of the tool's good behaviour, and closes the cloud-credential-theft path (metadata unreachable).
    network_mode: none

    # ---- no ambient provider credentials (task 3.2) -------------------------------------------
    # Empty, and deliberately NOT `env_file:`. Compose forwards no operator variable unless named here,
    # so OPENAI_API_KEY / ANTHROPIC_API_KEY / AWS_* on the invoking shell never reach the isolate. The
    # proof exports poison creds and asserts they are absent inside the container.
    environment: {}

    volumes:
      # ---- read-only, working-set-scoped filesystem (task 3.4) -------------------------------
      # `:ro` is enforced by the kernel mount, not by the tool's good behaviour. The isolate sees ONLY
      # this working set; no host FS, no other run's data, no `.git` creds, no secrets store.
      - ${SANDBOX_WORKSET:?set SANDBOX_WORKSET to the absolute path of the node working set}:/work:ro

    # Root filesystem immutable; the ephemeral scratch is the only writable surface and dies with the
    # isolate (task 3.7: no state persists between nodes).
    read_only: true
    tmpfs:
      - /scratch

    # ---- resource bounds (task 3.5) -----------------------------------------------------------
    # cgroup-enforced, so a fork bomb / mem bomb / runaway is contained by the OS, terminating only this
    # isolate. These mirror sandbox.DefaultBounds; a deployment tunes them per node, never to unbounded.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cpus: 1.0

    # Drop every Linux capability: running a tool needs none of them.
    cap_drop:
      - ALL
    # Block setuid/setcap privilege escalation inside the isolate.
    security_opt:
      - no-new-privileges:true
    # Non-root. Pinned here as well as in the Dockerfile so the posture is legible in one place and a
    # future base-image change cannot silently restore root.
    user: "65532:65532"
