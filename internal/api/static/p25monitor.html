<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heros Agent — Live run monitor</title>
  <!--
    The live run-monitoring view (P2.5 §8; PRD §6 FR19). Streams a run's per-node latency, cost, and
    token metrics as they arrive, and renders a failed/timed-out node distinctly from a slow-but-healthy
    one.

    NO BUILD STEP — same convention as p2.html: one self-contained page, no bundler for a handful of
    states and one stream. When P5 needs the run graph, that is the moment to pay for a toolchain.

    THE ONE RULE (task 8.2): status is read from the RUN RECORD, rendered verbatim. Nothing here infers
    "all nodes ok, so the run succeeded" — a run whose nodes all succeeded but which was halted is
    exactly what that inference gets wrong. The node STATE (ok / failed / timed_out) is driven by the
    reliability signal on each node, not by latency: a slow-but-healthy node is visibly NOT a failure.

    FIVE FIRST-CLASS STATES, each a distinct rendering: loading, error, empty, streaming, terminal.
  -->
  <style>
    :root {
      --bg: #0f1419; --card: #1a2332; --text: #e7ecf3; --muted: #8b9cb3; --accent: #3d8bfd;
      --ok: #3ecf8e; --warn: #f0c14b; --bad: #f5657e; --halt: #c084fc; --line: #2a3545;
    }
    * { box-sizing: border-box; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.5; }
    header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0; }
    p.sub { margin: .35rem 0 0; color: var(--muted); font-size: .9rem; font-family: ui-monospace, monospace; }
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    .card { background: var(--card); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; border: 1px solid var(--line); }
    .state { display: inline-block; font-size: .75rem; padding: .2rem .55rem; border-radius: 4px; font-weight: 600; letter-spacing: .02em; }
    .state-running        { background: #243044; color: var(--accent); }
    .state-succeeded      { background: #14352a; color: var(--ok); }
    .state-failed         { background: #3a2027; color: var(--bad); }
    .state-halted         { background: #2e2140; color: var(--halt); }
    .state-build-rejected { background: #3d2f14; color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    td.num { font-family: ui-monospace, monospace; text-align: right; }
    /* A node's STATE is a distinct colour AND a distinct word (task 8.2). A failed and a timed-out node
       must never look like a healthy-but-slow one. */
    .nstate { display: inline-block; font-size: .72rem; padding: .12rem .5rem; border-radius: 4px; font-weight: 600; }
    .nstate-ok        { background: #14352a; color: var(--ok); }
    .nstate-failed    { background: #3a2027; color: var(--bad); }
    .nstate-timed_out { background: #3d2f14; color: var(--warn); }
    tr.row-failed    td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
    tr.row-timed_out td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
    .msg { color: var(--muted); padding: 2rem 1rem; text-align: center; }
    .msg.error { color: var(--bad); }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: .4rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .live { color: var(--accent); font-size: .78rem; }
    .halt-note { color: var(--halt); font-size: .82rem; margin-top: .5rem; }
    .dim { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Live run monitor</h1>
      <p class="sub" id="runid">—</p>
    </div>
    <div id="status-badge"></div>
  </header>
  <main>
    <div class="card">
      <div id="live-line" class="live" style="margin-bottom:.6rem"></div>
      <div id="content">
        <!-- LOADING state (initial) -->
        <div class="msg" id="loading"><span class="spinner"></span>Connecting to the run…</div>
      </div>
      <div id="halt" class="halt-note" style="display:none"></div>
    </div>
  </main>

  <script>
    // Read run_id from the query string. No derived state: everything shown comes from the server
    // snapshot, whose Status is the run record's own field.
    const params = new URLSearchParams(location.search);
    const runId = params.get('run_id') || '';
    document.getElementById('runid').textContent = runId ? 'run_id: ' + runId : 'no run_id given';

    const el = (id) => document.getElementById(id);
    const fmt = (n, d = 2) => (n === undefined || n === null) ? '—' : Number(n).toFixed(d);

    function badge(status) {
      const known = ['running', 'succeeded', 'failed', 'halted', 'build-rejected'];
      const cls = known.includes(status) ? 'state-' + status : 'state-running';
      return '<span class="state ' + cls + '">' + (status || 'unknown') + '</span>';
    }

    // Render one of the five first-class states from a snapshot.
    function render(snap) {
      el('status-badge').innerHTML = badge(snap.status);

      // EMPTY (known run, no nodes yet) vs STREAMING vs TERMINAL is decided below.
      const nodes = snap.nodes || [];
      if (nodes.length === 0) {
        el('content').innerHTML = snap.terminal
          ? '<div class="msg">This run produced no node metrics.</div>'
          : '<div class="msg"><span class="spinner"></span>Run in progress — waiting for the first node…</div>';
      } else {
        let rows = '';
        for (const n of nodes) {
          const rowcls = n.state === 'failed' ? 'row-failed' : (n.state === 'timed_out' ? 'row-timed_out' : '');
          rows += '<tr class="' + rowcls + '">'
            + '<td>' + n.node_id + '</td>'
            + '<td><span class="nstate nstate-' + n.state + '">' + n.state + '</span></td>'
            + '<td class="num">' + fmt(n.latency_ms, 0) + '</td>'
            + '<td class="num">$' + fmt(n.cost_usd, 5) + '</td>'
            + '<td class="num">' + (n.tokens_prompt || 0) + '</td>'
            + '<td class="num">' + (n.tokens_completion || 0) + '</td>'
            + '</tr>';
        }
        el('content').innerHTML =
          '<table><thead><tr><th>Node</th><th>State</th><th>Latency (ms)</th><th>Cost</th>'
          + '<th>Prompt tok</th><th>Completion tok</th></tr></thead><tbody>' + rows + '</tbody></table>';
      }

      if (snap.halted) {
        el('halt').style.display = 'block';
        el('halt').textContent = 'Halted at node ' + snap.halted.node_id + ': ' + snap.halted.reason;
      } else {
        el('halt').style.display = 'none';
      }

      // The live line reflects STREAMING vs TERMINAL.
      el('live-line').innerHTML = snap.terminal
        ? '<span class="dim">● stream closed — run is ' + snap.status + '</span>'
        : '<span class="spinner"></span>streaming metrics as they arrive…';
    }

    // ERROR state: a distinct rendering, never silently blank (a 404 must not masquerade as empty).
    function showError(msg) {
      el('content').innerHTML = '<div class="msg error">⚠ ' + msg + '</div>';
      el('live-line').textContent = '';
    }

    if (!runId) {
      showError('No run_id in the URL. Append ?run_id=…');
    } else {
      // Prefer SSE for true streaming; fall back to polling if the stream errors.
      let usingStream = false;
      try {
        const es = new EventSource('/api/p25/runs/' + encodeURIComponent(runId) + '/monitor/stream');
        es.onmessage = (e) => {
          usingStream = true;
          const snap = JSON.parse(e.data);
          render(snap);
          if (snap.terminal) es.close();
        };
        es.onerror = () => {
          es.close();
          if (!usingStream) poll(); // stream never started (e.g. no SSE support / 404) → poll
        };
      } catch (_) {
        poll();
      }
    }

    // Polling fallback: same snapshot endpoint, every 700ms until terminal.
    async function poll() {
      try {
        const r = await fetch('/api/p25/runs/' + encodeURIComponent(runId) + '/monitor');
        if (r.status === 404) { showError('No such run.'); return; }
        if (!r.ok) { showError('Server error (' + r.status + ').'); setTimeout(poll, 1500); return; }
        const snap = await r.json();
        render(snap);
        if (!snap.terminal) setTimeout(poll, 700);
      } catch (e) {
        showError('Cannot reach the server. Retrying…');
        setTimeout(poll, 1500);
      }
    }
  </script>
</body>
</html>
