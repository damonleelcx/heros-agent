<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heros Agent — Pattern-classified workflow graph</title>
  <!--
    The P3.5 graph annotation (tasks 7.1–7.4). Draws the workflow IR and annotates each SUBGRAPH with
    the agentic pattern(s) it implements, each with a confidence.

    NO BUILD STEP — same convention as p2.html / p25monitor.html: one self-contained page. The read
    model (which labels apply to which region, whether a region is classified, what a label
    dispatches) is computed SERVER-SIDE in patternclassifier.BuildGraphView. Nothing here re-derives
    a classification decision; a second implementation of that logic in JavaScript would drift from
    the Go one, and the two would eventually disagree about what a subgraph is.

    THREE RULES THIS PAGE FOLLOWS:

    1. A LABEL IS A DISPATCHER, NOT DECORATION. Every label shows the metric-set it selects, because
       that is what the label is FOR. A page that showed only the pattern name would suggest the
       label is an annotation.

    2. RULE AND LLM ARE VISIBLY DIFFERENT (7.2). A deterministic structural detector and a model's
       opinion are not the same kind of claim, and must never look alike. A rule label is solid with
       its detector id; an llm label is dashed, marked LLM, and shows confidence as a filled BAR —
       prominent, because for an llm label the confidence is the main thing a reader needs.

    3. UNCLASSIFIED IS A STATE, NOT A BLANK (7.3). A region with no label renders the words
       "not yet classified" plus why (rules found no signature; no model was consulted). Silence
       would read as "nothing here", which is a different and false claim.
  -->
  <style>
    :root {
      --bg: #0f1419; --card: #1a2332; --text: #e7ecf3; --muted: #8b9cb3; --accent: #3d8bfd;
      --ok: #3ecf8e; --warn: #f0c14b; --bad: #f5657e; --llm: #c084fc; --line: #2a3545;
      --ctl: #f0c14b; --none: #5a6b80;
    }
    * { box-sizing: border-box; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.5; }
    header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0; }
    h2 { font-size: .95rem; font-weight: 600; margin: 0 0 .75rem; }
    p.sub { margin: .35rem 0 0; color: var(--muted); font-size: .85rem; font-family: ui-monospace, monospace; }
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .card { background: var(--card); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; border: 1px solid var(--line); }
    .msg { color: var(--muted); padding: 2rem 1rem; text-align: center; }
    .msg.error { color: var(--bad); }
    .dim { color: var(--muted); }
    code, .mono { font-family: ui-monospace, monospace; font-size: .78rem; }

    /* --- the graph ------------------------------------------------------------------------ */
    /* 7.4: the graph SCROLLS rather than shrinking. A large composite IR squeezed to fit the
       viewport is unreadable, which is a worse failure than having to scroll. */
    .graphwrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: #0c1116; }
    svg { display: block; }
    .nodebox { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .nodebox.hl { stroke: var(--accent); stroke-width: 2.5; }
    .nodelabel { fill: var(--text); font: 600 12px ui-monospace, monospace; }
    .nodemeta  { fill: var(--muted); font: 10px ui-monospace, monospace; }
    .edge-data    { stroke: var(--muted); stroke-width: 1.6; fill: none; }
    /* A control edge is DASHED and a different colour: "activates without passing data" is a
       different relationship from "feeds", and the detectors treat them differently, so the picture
       must too. */
    .edge-control { stroke: var(--ctl); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    /* A region box: solid for a rule-owned region, dashed for an llm-labelled one, grey for an
       unclassified one. */
    .region       { fill: rgba(61,139,253,.07); stroke: var(--accent); stroke-width: 1.5; rx: 10; }
    .region.llm   { fill: rgba(192,132,252,.07); stroke: var(--llm); stroke-dasharray: 7 5; }
    .region.none  { fill: rgba(90,107,128,.06); stroke: var(--none); stroke-dasharray: 3 4; }
    .regiontag    { font: 600 11px ui-sans-serif, system-ui, sans-serif; }

    /* --- label chips ----------------------------------------------------------------------- */
    .chip { display: inline-flex; align-items: center; gap: .4rem; font-size: .78rem; padding: .18rem .55rem; border-radius: 5px; font-weight: 600; margin: 0 .35rem .35rem 0; }
    .chip-rule { background: #16283f; color: var(--accent); border: 1px solid var(--accent); }
    .chip-llm  { background: #2a1f3d; color: var(--llm); border: 1px dashed var(--llm); }
    .chip-none { background: #1c242e; color: var(--none); border: 1px dashed var(--none); font-weight: 500; }
    .ord { font-family: ui-monospace, monospace; font-size: .68rem; opacity: .7; }
    .src { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
    .cand { background: #3d2f14; color: var(--warn); border: 1px solid var(--warn); font-size: .62rem; padding: .05rem .35rem; border-radius: 3px; letter-spacing: .04em; }
    /* Confidence as a BAR, not just a number: for an llm label it is the primary signal. */
    .confbar { display: inline-block; width: 46px; height: 7px; background: #22303f; border-radius: 4px; overflow: hidden; vertical-align: middle; }
    .confbar > i { display: block; height: 100%; background: var(--accent); }
    .chip-llm .confbar > i { background: var(--llm); }
    .conftext { font-family: ui-monospace, monospace; font-size: .72rem; }
    .dispatch { color: var(--muted); font-size: .76rem; margin: .1rem 0 .6rem; }
    .dispatch b { color: var(--ok); font-weight: 600; }
    .regioncard { border-top: 1px solid var(--line); padding: .8rem 0 .2rem; }
    .regioncard:first-of-type { border-top: 0; }
    .members { color: var(--muted); font-size: .76rem; font-family: ui-monospace, monospace; }
    .legend { display: flex; gap: 1.25rem; flex-wrap: wrap; color: var(--muted); font-size: .76rem; padding-top: .6rem; }
    .legend span { display: inline-flex; align-items: center; gap: .35rem; }
    .swatch { width: 22px; height: 0; border-top-width: 2px; border-top-style: solid; display: inline-block; }
    .empty-explain { color: var(--muted); font-size: .8rem; margin-top: .3rem; }
    .diag { color: var(--warn); font-size: .78rem; font-family: ui-monospace, monospace; padding: .2rem 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Pattern-classified workflow graph</h1>
      <p class="sub" id="meta">—</p>
    </div>
    <div class="mono dim" id="calls"></div>
  </header>
  <main>
    <div class="card">
      <h2>Graph</h2>
      <div id="graphstate" class="msg"><span>Loading…</span></div>
      <div class="graphwrap" id="graphwrap" hidden><svg id="svg"></svg></div>
      <div class="legend">
        <span><i class="swatch" style="border-color:#8b9cb3"></i> data edge</span>
        <span><i class="swatch" style="border-color:#f0c14b;border-top-style:dashed"></i> control edge</span>
        <span><i class="swatch" style="border-color:#3d8bfd"></i> rule-labelled region</span>
        <span><i class="swatch" style="border-color:#c084fc;border-top-style:dashed"></i> llm-labelled region</span>
        <span><i class="swatch" style="border-color:#5a6b80;border-top-style:dashed"></i> not yet classified</span>
      </div>
    </div>

    <div class="card" id="labelcard">
      <h2>Subgraph labels</h2>
      <div id="regions"></div>
    </div>

    <div class="card" id="diagcard" hidden>
      <h2>Diagnostics</h2>
      <div id="diags"></div>
    </div>
  </main>

<script>
const params = new URLSearchParams(location.search);
const workflowID = params.get("workflow_id") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// GAP_Y is generous because a region's caption is drawn ABOVE its box: with a tight gap the caption
// of one region lands on the bottom edge of the one above it, which is how it first looked in a
// browser. The vertical room is what keeps stacked regions readable.
const NODE_W = 190, NODE_H = 54, GAP_X = 90, GAP_Y = 56, PAD = 30, REGION_PAD = 14;

function chip(l) {
  const cls = l.source === "llm" ? "chip-llm" : "chip-rule";
  const pct = Math.round(l.confidence * 100);
  // The confidence bar is rendered for BOTH sources but reads as the headline for llm labels, which
  // is why it sits immediately after the source badge there.
  const bar = `<span class="confbar" title="confidence ${l.confidence.toFixed(2)}"><i style="width:${pct}%"></i></span>`
            + `<span class="conftext">${l.confidence.toFixed(2)}</span>`;
  const cand = l.candidate
    ? ` <span class="cand" title="Structure shows the shape; confirming it needs runtime traces (P5). Confidence is capped accordingly.">CANDIDATE</span>`
    : "";
  // The canonical pattern NUMBER is shown next to the name because that is the identifier people use
  // in conversation ("Pattern 13"). It comes from the server (ViewLabel.ordinal) rather than being
  // counted off a list here — two numberings of one taxonomy is the defect this fixes, not repeats.
  const num = l.ordinal ? `<span class="ord">#${l.ordinal}</span>` : "";
  return `<span class="chip ${cls}">${num}<span class="src">${esc(l.source)}</span> ${esc(l.title || l.pattern)} ${bar}</span>${cand}`;
}

function dispatchLine(l) {
  if (!l.primary_metric) return `<div class="dispatch">dispatches: <span class="dim">no metric-set mapped</span></div>`;
  return `<div class="dispatch">dispatches <b>${esc(l.primary_metric)}</b> <span class="dim">+ ${l.metrics.filter(m => m !== l.primary_metric).map(esc).join(", ")}</span></div>`;
}

function renderRegions(view) {
  // Defence in depth: the Go view emits empty arrays, never null (BuildGraphView). If a future
  // producer ever regressed to null, a missing region list must not blank the whole page.
  view.regions = view.regions || []; view.unclassified = view.unclassified || []; view.nodes = view.nodes || [];
  let html = "";
  for (const r of view.regions) {
    html += `<div class="regioncard"><div class="mono dim">${esc(r.subgraph_id)}</div>`;
    for (const l of r.labels) html += chip(l) + dispatchLine(l);
    html += `<div class="members">${r.node_ids.map(esc).join("  ·  ")}</div></div>`;
  }
  // 7.3 — the unclassified state, spelled out. Never a blank row, never a default label.
  for (const r of view.unclassified) {
    html += `<div class="regioncard"><div class="mono dim">${esc(r.subgraph_id)}</div>`
          + `<span class="chip chip-none">not yet classified</span>`
          + `<div class="empty-explain">No structural signature matched this region`
          + (view.llm_calls === 0 ? ` and no model was consulted.` : ` and the fallback returned nothing in the taxonomy.`)
          + ` It is unlabelled — not "no pattern".</div>`
          + `<div class="members">${r.node_ids.map(esc).join("  ·  ")}</div></div>`;
  }
  // Node-scoped capabilities (Tool Use co-existing on a node inside a region).
  for (const n of view.nodes) {
    if (!n.labels || !n.labels.length) continue;
    html += `<div class="regioncard"><div class="mono dim">node ${esc(n.node_id)}</div>`;
    for (const l of n.labels) html += chip(l) + dispatchLine(l);
    html += `</div>`;
  }
  if (!html) {
    html = `<span class="chip chip-none">not yet classified</span>`
         + `<div class="empty-explain">This workflow has no pattern labels at all. That is a state, not an error: `
         + `no structural signature matched any region. It does not mean the workflow implements no patterns.</div>`;
  }
  $("regions").innerHTML = html;
}

function renderGraph(view) {
  view.nodes = view.nodes || []; view.edges = view.edges || [];
  view.regions = view.regions || []; view.unclassified = view.unclassified || [];
  const svg = $("svg");
  if (!view.nodes.length) {
    $("graphstate").innerHTML = `<span class="dim">This workflow has no nodes.</span>`;
    return;
  }
  const pos = {};
  let maxLayer = 0, perLayer = {};
  for (const n of view.nodes) { maxLayer = Math.max(maxLayer, n.layer); perLayer[n.layer] = (perLayer[n.layer]||0)+1; }
  for (const n of view.nodes) {
    pos[n.node_id] = { x: PAD + n.layer * (NODE_W + GAP_X), y: PAD + 40 + n.order * (NODE_H + GAP_Y), n };
  }
  let maxRows = 0; for (const k in perLayer) maxRows = Math.max(maxRows, perLayer[k]);
  const W = PAD * 2 + (maxLayer + 1) * NODE_W + maxLayer * GAP_X;
  const H = PAD * 2 + 40 + maxRows * (NODE_H + GAP_Y);

  let out = `<defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9cb3"/></marker>
      <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0c14b"/></marker>
    </defs>`;

  // Region boxes first, so nodes and edges draw over them.
  const drawRegion = (r, cls, caption) => {
    const ps = r.node_ids.map(id => pos[id]).filter(Boolean);
    if (!ps.length) return "";
    const x0 = Math.min(...ps.map(p => p.x)) - REGION_PAD, y0 = Math.min(...ps.map(p => p.y)) - REGION_PAD - 16;
    const x1 = Math.max(...ps.map(p => p.x)) + NODE_W + REGION_PAD, y1 = Math.max(...ps.map(p => p.y)) + NODE_H + REGION_PAD;
    const colour = cls === "none" ? "#5a6b80" : (cls === "llm" ? "#c084fc" : "#3d8bfd");
    return `<rect class="region ${cls}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}"/>`
         + `<text class="regiontag" x="${x0+10}" y="${y0+16}" fill="${colour}">${esc(caption)}</text>`;
  };
  for (const r of view.regions) {
    const l = r.labels[0];
    if (!l) { out += drawRegion(r, "none", "not yet classified"); continue; }
    const caption = r.labels.map(x => `#${x.ordinal} ${x.title || x.pattern} ${x.confidence.toFixed(2)}${x.candidate ? " (candidate)" : ""}`).join("  ·  ")
                  + `  [${l.source}]`;
    out += drawRegion(r, l.source === "llm" ? "llm" : "rule", caption);
  }
  for (const r of view.unclassified) out += drawRegion(r, "none", "not yet classified");

  for (const e of view.edges) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    const cls = e.kind === "control" ? "edge-control" : "edge-data";
    const marker = e.kind === "control" ? "arrowc" : "arrow";
    if (b.x <= a.x) {
      // A BACK EDGE (the target sits left of, or level with, the source): a loop. Routed under the
      // row rather than straight across, because the straight path would run right-to-left through
      // the node boxes and be invisible. For a Reflection region the loop-back edge IS the signature
      // — a picture that hides it shows a two-step chain, which is a different workflow.
      const sx = a.x + NODE_W/2, sy = a.y + NODE_H, tx = b.x + NODE_W/2, ty = b.y + NODE_H;
      const dip = Math.max(sy, ty) + 30;
      out += `<path class="${cls}" marker-end="url(#${marker})" d="M ${sx} ${sy} C ${sx} ${dip}, ${tx} ${dip}, ${tx} ${ty}"/>`;
      continue;
    }
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H/2, x2 = b.x, y2 = b.y + NODE_H/2;
    const mx = (x1 + x2) / 2;
    out += `<path class="${cls}" marker-end="url(#${marker})" d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"/>`;
  }

  for (const n of view.nodes) {
    const p = pos[n.node_id];
    const caps = (n.labels||[]).map(l => `${l.title || l.pattern}`).join(", ");
    out += `<g><rect class="nodebox" x="${p.x}" y="${p.y}" width="${NODE_W}" height="${NODE_H}" rx="7"/>`
         + `<text class="nodelabel" x="${p.x+11}" y="${p.y+21}">${esc(n.node_id.slice(0, 24))}</text>`
         + `<text class="nodemeta" x="${p.x+11}" y="${p.y+37}">${esc(n.model.slice(0, 28))}</text>`
         + (caps ? `<text class="nodemeta" x="${p.x+11}" y="${p.y+49}" fill="#3ecf8e">${esc(caps)}</text>` : "")
         + `</g>`;
  }

  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out;
  $("graphstate").hidden = true;
  $("graphwrap").hidden = false;
}

// showError puts the page in a single, coherent error state. The label card is HIDDEN rather than
// left standing empty: an empty "Subgraph labels" box under an error reads as "this workflow has no
// labels", which is a claim about the workflow — and on an error we do not know anything about the
// workflow. A blank that looks like a result is the same failure as a blank that looks like "none".
function showError(msg) {
  $("graphstate").className = "msg error";
  $("graphstate").textContent = msg;
  $("graphwrap").hidden = true;
  $("labelcard").hidden = true;
  $("diagcard").hidden = true;
}

async function load() {
  if (!workflowID) {
    showError("No workflow_id in the URL. Append ?workflow_id=…");
    return;
  }
  let res;
  try {
    res = await fetch(`/api/p35/workflows/${encodeURIComponent(workflowID)}/graph`);
  } catch (e) {
    // A transport failure is NOT "this workflow has no labels". Saying so would turn an outage into
    // a clean-looking, empty, and false result.
    showError(`Could not reach the API: ${e}. This is a transport failure, not an empty classification.`);
    return;
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    showError(res.status === 404
      ? `No such workflow: ${workflowID}. (Distinct from a workflow that exists but is unclassified.)`
      : `API error ${res.status}: ${body.error || ""}`);
    return;
  }
  const view = await res.json();
  $("meta").textContent = `${view.workflow_id}  ·  ir ${view.ir_version}  ·  taxonomy ${view.taxonomy_version}`;
  $("calls").textContent = view.llm_calls === 0
    ? "0 LLM calls — fully rule-covered"
    : `${view.llm_calls} LLM fallback call${view.llm_calls === 1 ? "" : "s"}`;
  renderGraph(view);
  renderRegions(view);
  if (view.diagnostics && view.diagnostics.length) {
    $("diagcard").hidden = false;
    $("diags").innerHTML = view.diagnostics.map(d =>
      `<div class="diag">[${esc(d.stage)}] ${esc(d.subgraph_ref||"")} ${esc(d.raw_pattern||"")} — ${esc(d.reason)}</div>`).join("");
  }
}
load();
</script>
</body>
</html>
