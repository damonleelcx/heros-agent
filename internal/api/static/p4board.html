<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 — Eval board</title>

<!--
  P4 eval board: leaderboard + Pareto frontier + coverage report.

  THREE DESIGN RULES, and every one of them is about not lying:

    1. A rank is ordering, not evidence. When confidence intervals overlap the pair is TIED, and a
       tied row's rank is rendered muted with a `tie` chip. On an all-tie board a banner says so
       outright — that board is exactly where a well-meaning UI does the most damage by rendering
       rank 1 as a victory.
    2. A disqualified variant is OUT, not last. It lives in its own section below the ranked table
       with the failed gate named. Ranking it last would let a reader scroll to it and take it for
       "the worst passing option"; it is not an option at all.
    3. Coverage never rounds up. 83% with the missing edge named is the honest answer; 100% reached
       by dropping an unreachable obligation from the denominator is the damaging one.

  Every state ships a TEXT chip beside its color — identity is never carried by color alone.

  NO BUILD STEP — same convention as p2.html / p25monitor.html / p35graph.html. The board is computed
  server-side in internal/evalboard; this page renders what it is handed and derives nothing.
-->

<style>
  /* House chrome, shared with the other three pages. */
  :root {
    --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8fa3bd; --accent:#3d8bfd;
    --line:#243247; --ctl:#2a3a52;

    /* Chart color from the dataviz skill's validated palette, dark steps, checked against THIS
       page's chart surface (#1a2332) rather than the skill's default — contrast and CVD results are
       only meaningful against the surface the chart actually renders on. All four slots PASS the
       lightness band, chroma floor, CVD separation (worst adjacent ΔE 13.0 deutan) and the
       normal-vision floor (worst adjacent ΔE 19.3). */
    --series-1:#3987e5;   /* blue    — on the frontier */
    --series-2:#008300;   /* green   — dominated */
    --series-3:#d55181;   /* magenta */
    --series-4:#c98500;   /* yellow  */

    /* Status palette — reserved, never reused as "series 5", and always paired with a text chip. */
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;

    --grid:#2c3a4e;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
           gap:12px; align-items:center; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  h2 { font-size:14px; margin:0 0 10px; font-weight:600; }
  main { padding:20px; display:grid; gap:16px; max-width:1400px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .muted { color:var(--muted); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* Controls sit in ONE row above the board (interaction spec). */
  select, button { background:var(--ctl); color:var(--text); border:1px solid var(--line);
                   border-radius:6px; padding:6px 10px; font:inherit; }
  select:focus-visible, button:focus-visible, tr:focus-visible, .pt:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }

  /* Chips: every state carries TEXT, so nothing is color-only. */
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:1px 7px;
          border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  .chip-tie          { border-color:var(--warning); color:var(--warning); }
  .chip-dq           { border-color:var(--critical); color:var(--critical); }
  .chip-weak         { border-color:var(--serious); color:var(--serious); }
  .chip-prov         { border-color:var(--muted);   color:var(--muted); }
  .chip-lowconf      { border-color:var(--serious); color:var(--serious); }
  .chip-pass         { border-color:var(--good);    color:var(--good); }

  .banner { border-radius:8px; padding:10px 14px; border:1px solid; }
  .banner-tie  { border-color:var(--warning); background:rgba(250,178,25,0.08); }
  .banner-err  { border-color:var(--critical); background:rgba(208,59,59,0.10); }
  .banner-note { border-color:var(--line); background:rgba(255,255,255,0.03); }

  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
       color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr[tabindex] { cursor:pointer; }
  tr[tabindex]:hover { background:rgba(255,255,255,0.03); }
  tr[aria-expanded="true"] { background:rgba(61,139,253,0.06); }
  .rank { font-variant-numeric:tabular-nums; font-weight:600; }
  .rank-tied { color:var(--muted); font-weight:400; }

  /* CI bar: the interval is the mark, the mean is a tick. A bare point value is never the result. */
  .ci { position:relative; height:14px; min-width:140px; background:var(--grid); border-radius:3px; }
  .ci-band { position:absolute; top:0; bottom:0; background:var(--series-1); border-radius:3px;
             opacity:.55; }
  .ci-mean { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text); }

  .breakdown { display:none; }
  tr[aria-expanded="true"] + tr.breakdown { display:table-row; }
  .breakdown td { background:rgba(0,0,0,0.18); }
  .kv { display:grid; grid-template-columns:max-content max-content max-content 1fr; gap:4px 14px;
        font-size:12px; }

  /* Coverage meters. */
  .meter { height:10px; background:var(--grid); border-radius:3px; overflow:hidden; }
  .meter > i { display:block; height:100%; background:var(--good); }
  .meter.short > i { background:var(--serious); }

  .scroll { max-height:60vh; overflow:auto; }
  svg { display:block; max-width:100%; }
  .axis { stroke:var(--grid); stroke-width:1; }
  .axlabel { fill:var(--muted); font-size:10px; }
  .pt { cursor:pointer; }
  .tip { position:fixed; pointer-events:none; background:var(--card); border:1px solid var(--line);
         border-radius:6px; padding:6px 9px; font-size:12px; display:none; z-index:10; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>

<body data-palette="#3987e5,#008300,#d55181,#c98500">
<header>
  <h1>Eval board</h1>
  <span class="muted mono" id="wf"></span>
  <span class="row" style="margin-left:auto">
    <label for="profile" class="muted">Weight profile</label>
    <select id="profile" aria-describedby="profile-help"></select>
    <span id="profile-help" class="muted" style="font-size:12px">re-ranks from cache · 0 new runs</span>
  </span>
</header>

<main>
  <div id="banners"></div>

  <section class="card" aria-labelledby="lb-h">
    <h2 id="lb-h">Leaderboard <span class="muted" id="lb-sub"></span></h2>
    <div id="lb"></div>
  </section>

  <section class="card" aria-labelledby="dq-h" id="dq-card" hidden>
    <h2 id="dq-h">Disqualified <span class="muted">— excluded from the ranked order, not ranked last</span></h2>
    <div id="dq"></div>
  </section>

  <section class="card" aria-labelledby="pareto-h">
    <h2 id="pareto-h">Pareto frontier <span class="muted">— quality vs cost, marker size = latency</span></h2>
    <div id="pareto"></div>
  </section>

  <section class="card" aria-labelledby="cov-h">
    <h2 id="cov-h">Is this eval set good enough?</h2>
    <div id="coverage"></div>
  </section>

  <section class="card" aria-labelledby="spend-h">
    <h2 id="spend-h">Spend</h2>
    <div id="spend"></div>
  </section>
</main>

<div class="tip" id="tip" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const workflowID = new URLSearchParams(location.search).get('workflow') || 'wf-demo';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n2 = (v) => Number(v).toFixed(2);
const n3 = (v) => Number(v).toFixed(3);
const pct = (v) => (Number(v) * 100).toFixed(0) + '%';

// VIRTUALIZATION THRESHOLD. Above this, only the visible window of rows is in the DOM: a
// 500-variant board must not put 500 expandable rows on the page.
const VIRTUALIZE_ABOVE = 60;
const ROW_H = 41;

let VIEW = null;

// ── banners ────────────────────────────────────────────────────────────────────
// A board-level caveat is a banner, not a per-row badge, because it changes what the WHOLE board
// means: a refused gate is a ranking with one fewer hard constraint than the user configured.
function renderBanners(v) {
  const out = [];
  if (v.state === 'error') {
    out.push(`<div class="banner banner-err"><strong>Board could not be computed.</strong>
              <div class="mono" style="margin-top:4px">${esc(v.error)}</div></div>`);
  }
  if (v.all_tie) {
    out.push(`<div class="banner banner-tie"><strong>No winner.</strong>
      All ${v.ranked.length} variants' confidence intervals overlap on the
      <span class="mono">${esc(v.profile)}</span> profile. The ranks below are ordering, not evidence.
      <div class="muted" style="margin-top:4px">To resolve: raise the seed count, or strengthen the eval set.</div>
    </div>`);
  }
  if (v.state === 'partial') {
    const p = v.progress || {};
    out.push(`<div class="banner banner-note"><strong>Fan-out in progress.</strong>
      ${p.units_completed} / ${p.units_planned} runs complete. Rows are readable; intervals below the
      seed floor are marked <span class="chip chip-prov">provisional</span>.</div>`);
  }
  for (const note of (v.notes || [])) {
    out.push(`<div class="banner banner-note">${esc(note)}</div>`);
  }
  // The unmeasured variants are a COLLAPSED list, not one banner each: 58 banners would bury the
  // one that explains why they are missing.
  if ((v.unmeasured || []).length) {
    out.push(`<details class="banner banner-note">
      <summary>${v.unmeasured.length} variant(s) excluded — no usable measurement</summary>
      <table style="margin-top:8px"><thead><tr><th>Variant</th><th>Reason</th></tr></thead><tbody>
      ${v.unmeasured.map(u => `<tr><td>${esc(u.label)}</td><td class="muted">${esc(u.reason)}</td></tr>`).join('')}
      </tbody></table></details>`);
  }
  $('banners').innerHTML = out.join('');
}

// ── leaderboard ────────────────────────────────────────────────────────────────
function chipFor(flag) {
  const cls = {tie:'chip-tie', disqualified:'chip-dq', 'weak-labeled':'chip-weak',
               provisional:'chip-prov', 'low-confidence':'chip-lowconf'}[flag] || '';
  return `<span class="chip ${cls}">${esc(flag)}</span>`;
}

// ciBar draws the interval as the mark and the mean as a tick, scaled to the board's own extent.
function ciBar(row, lo, hi) {
  const span = (hi - lo) || 1;
  const left = ((row.ci_low - lo) / span) * 100;
  const width = Math.max(((row.ci_high - row.ci_low) / span) * 100, 1.5);
  const mean = ((row.score - lo) / span) * 100;
  return `<div class="ci" role="img" aria-label="score ${n3(row.score)}, interval ${n3(row.ci_low)} to ${n3(row.ci_high)}">
    <span class="ci-band" style="left:${left}%;width:${width}%"></span>
    <span class="ci-mean" style="left:${mean}%"></span>
  </div>`;
}

function rowHTML(r, i, lo, hi) {
  const tied = (r.tied_with || []).length > 0;
  const flags = (r.flags || []).map(chipFor).join(' ');
  const gate = r.gate_pass
    ? `<span class="chip chip-pass">gate: pass</span>`
    : `<span class="chip chip-dq">gate: fail — ${esc((r.failed_gates || []).join(', '))}</span>`;
  return `
  <tr tabindex="0" aria-expanded="false" data-i="${i}">
    <td class="rank ${tied ? 'rank-tied' : ''}">${r.rank || '—'}</td>
    <td>
      <div>${esc(r.label)}</div>
      <div class="muted mono" style="font-size:11px" title="${esc(r.config_hash)}">${esc(r.config_hash_short)}</div>
    </td>
    <td>
      <div class="mono">${n3(r.score)} <span class="muted">± [${n3(r.ci_low)}, ${n3(r.ci_high)}]</span></div>
      ${ciBar(r, lo, hi)}
      <div class="muted" style="font-size:11px">n=${r.n_seeds} seeds · ${r.n_cases} cases</div>
    </td>
    <td>${gate}</td>
    <td>${flags}</td>
  </tr>
  <tr class="breakdown"><td colspan="5">${breakdownHTML(r)}</td></tr>`;
}

// The breakdown carries RAW units beside normalized ones: a user acts on "$0.021 / 900 ms" and
// understands the ranking through "0.72". Showing one alone makes the row unactionable or
// unexplainable.
function breakdownHTML(r) {
  const rows = (r.components || []).map(c => {
    const judge = c.judge
      ? `<span class="chip ${c.judge.calibrated ? '' : 'chip-weak'}">judge κ ${n2(c.judge.agreement)} · n=${c.judge.n_human}${c.judge.calibrated ? '' : ' · uncalibrated'}</span>`
      : '';
    return `<span class="mono">${esc(c.metric)}</span>
            <span class="muted">${esc(c.role)}</span>
            <span class="mono">raw ${n3(c.raw)}</span>
            <span class="mono">norm ${n3(c.normalized)} → contributes ${n3(c.contribution)} ${judge}</span>`;
  }).join('');
  const pens = (r.penalties || []).map(p =>
    `<span class="mono">${esc(p.term)}</span><span class="muted">penalty</span>
     <span></span><span class="mono">− ${n3(p.amount)}</span>`).join('');
  const tie = (r.tied_with || []).length
    ? `<div class="muted" style="margin-top:8px">Statistically tied with:
       <span class="mono">${esc(r.tied_with.join(', '))}</span> — overlapping confidence intervals are not an ordering.</div>` : '';
  const reasons = (r.gate_reasons || []).length
    ? `<div style="margin-top:8px;color:var(--critical)">${r.gate_reasons.map(esc).join('<br>')}</div>` : '';
  return `<div class="kv">${rows}${pens}</div>
          <div class="muted mono" style="margin-top:8px;font-size:11px">config_hash ${esc(r.config_hash)} · ${esc(r.method)}</div>
          ${tie}${reasons}`;
}

function renderTable(container, rows, opts) {
  if (!rows.length) {
    container.innerHTML = `<p class="muted">${esc(opts.empty)}</p>`;
    return;
  }
  const lo = Math.min(...rows.map(r => r.ci_low));
  const hi = Math.max(...rows.map(r => r.ci_high));
  const head = `<thead><tr><th scope="col">#</th><th scope="col">Variant</th>
      <th scope="col">Score ± CI</th><th scope="col">Gate</th><th scope="col">State</th></tr></thead>`;

  if (rows.length <= VIRTUALIZE_ABOVE) {
    container.innerHTML = `<table>${head}<tbody>${rows.map((r, i) => rowHTML(r, i, lo, hi)).join('')}</tbody></table>`;
    wireRows(container, rows);
    return;
  }

  // Virtualized: only the visible window is in the DOM, with spacer rows preserving scroll height.
  container.innerHTML = `<div class="scroll" id="${opts.id}-scroll"><table>${head}
      <tbody id="${opts.id}-body"></tbody></table></div>
      <p class="muted" style="font-size:12px">${rows.length} variants · virtualized</p>`;
  const scroll = $(`${opts.id}-scroll`);
  const body = $(`${opts.id}-body`);
  const paint = () => {
    const per = Math.ceil(scroll.clientHeight / ROW_H) + 6;
    const start = Math.max(0, Math.floor(scroll.scrollTop / ROW_H) - 3);
    const end = Math.min(rows.length, start + per);
    const before = start * ROW_H, after = (rows.length - end) * ROW_H;
    body.innerHTML =
      `<tr style="height:${before}px"><td colspan="5"></td></tr>` +
      rows.slice(start, end).map((r, k) => rowHTML(r, start + k, lo, hi)).join('') +
      `<tr style="height:${after}px"><td colspan="5"></td></tr>`;
    wireRows(body, rows);
  };
  scroll.addEventListener('scroll', paint);
  paint();
}

// Rows are keyboard-operable: arrows move, Enter/Space expands. Nothing here is hover-only.
function wireRows(scope, rows) {
  const trs = [...scope.querySelectorAll('tr[tabindex]')];
  trs.forEach((tr) => {
    const toggle = () => tr.setAttribute('aria-expanded', tr.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    tr.addEventListener('click', toggle);
    tr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); (trs[trs.indexOf(tr) + 1] || trs[0]).focus(); }
      if (e.key === 'ArrowUp')   { e.preventDefault(); (trs[trs.indexOf(tr) - 1] || trs[trs.length - 1]).focus(); }
    });
  });
}

// ── Pareto ─────────────────────────────────────────────────────────────────────
// Non-dominated points get a distinct SHAPE as well as a distinct hue, so the frontier is legible
// without color. Reads the score cache; a weight change re-renders and re-runs nothing.
function renderPareto(pts) {
  const el = $('pareto');
  if (!pts.length) { el.innerHTML = '<p class="muted">No gate-passing variants to plot.</p>'; return; }

  const W = 720, H = 300, M = {t: 20, r: 28, b: 42, l: 60};
  const qs = pts.map(p => p.quality), cs = pts.map(p => p.cost_usd), ls = pts.map(p => p.latency_ms);
  const lMax = Math.max(...ls) || 1;

  // PAD THE DOMAIN. Without this the extreme variants sit exactly on the axis lines and half of each
  // marker is clipped — on a three-point frontier that means the whole chart reads as two dots in
  // opposite corners. The padding is a fraction of the observed range (with a floor for the
  // degenerate case where every variant scored the same), so it scales with the data instead of
  // being a magic pixel count.
  const pad = (lo, hi) => { const r = (hi - lo) || Math.abs(hi) || 1; return [lo - r * 0.12, hi + r * 0.12]; };
  const [qMin, qMax] = pad(Math.min(...qs), Math.max(...qs));
  const [cMin, cMax] = pad(Math.min(...cs), Math.max(...cs));
  const qLo = Math.min(...qs), qHi = Math.max(...qs), cLo = Math.min(...cs), cHi = Math.max(...cs);
  const x = (q) => M.l + ((q - qMin) / ((qMax - qMin) || 1)) * (W - M.l - M.r);
  const y = (c) => H - M.b - ((c - cMin) / ((cMax - cMin) || 1)) * (H - M.t - M.b);
  const rad = (l) => 5 + (l / lMax) * 7;

  const marks = pts.map((p, i) => {
    const cx = x(p.quality), cy = y(p.cost_usd), r = rad(p.latency_ms);
    const fill = p.non_dominated ? 'var(--series-1)' : 'var(--series-2)';
    // Frontier = diamond, dominated = circle: shape carries the distinction too.
    const shape = p.non_dominated
      ? `<polygon points="${cx},${cy - r} ${cx + r},${cy} ${cx},${cy + r} ${cx - r},${cy}"
           fill="${fill}" stroke="var(--card)" stroke-width="2"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="var(--card)" stroke-width="2"/>`;
    return `<g class="pt" tabindex="0" role="img" data-i="${i}"
              aria-label="${esc(p.label)}: quality ${n3(p.quality)}, cost ${n3(p.cost_usd)} dollars,
                          latency ${Math.round(p.latency_ms)} ms, ${p.non_dominated ? 'on the frontier' : 'dominated'}">
              ${shape}</g>`;
  }).join('');

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Pareto frontier: quality against cost">
      <line class="axis" x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}"/>
      <line class="axis" x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H - M.b}"/>
      <text class="axlabel" x="${(W) / 2}" y="${H - 10}" text-anchor="middle">task success →</text>
      <text class="axlabel" x="14" y="${H / 2}" transform="rotate(-90 14 ${H / 2})" text-anchor="middle">cost per run (USD) →</text>
      <text class="axlabel" x="${x(qLo)}" y="${H - M.b + 14}" text-anchor="middle">${n3(qLo)}</text>
      <text class="axlabel" x="${x(qHi)}" y="${H - M.b + 14}" text-anchor="middle">${n3(qHi)}</text>
      <text class="axlabel" x="${M.l - 6}" y="${y(cLo) + 4}" text-anchor="end">${n3(cLo)}</text>
      <text class="axlabel" x="${M.l - 6}" y="${y(cHi) + 4}" text-anchor="end">${n3(cHi)}</text>
      ${marks}
    </svg>
    <div class="row" style="margin-top:8px;font-size:12px">
      <span class="chip"><svg width="10" height="10"><polygon points="5,0 10,5 5,10 0,5" fill="var(--series-1)"/></svg> on the frontier</span>
      <span class="chip"><svg width="10" height="10"><circle cx="5" cy="5" r="5" fill="var(--series-2)"/></svg> dominated</span>
      <span class="muted">marker size = latency</span>
    </div>
    <details style="margin-top:8px"><summary class="muted">Table view</summary>
      <table><thead><tr><th>Variant</th><th>Quality</th><th>Cost (USD)</th><th>Latency (ms)</th><th>Frontier</th></tr></thead>
      <tbody>${pts.map(p => `<tr><td>${esc(p.label)}</td><td class="mono">${n3(p.quality)}</td>
        <td class="mono">${n3(p.cost_usd)}</td><td class="mono">${Math.round(p.latency_ms)}</td>
        <td>${p.non_dominated ? 'yes' : 'no'}</td></tr>`).join('')}</tbody></table>
    </details>`;

  const tip = $('tip');
  el.querySelectorAll('.pt').forEach(g => {
    const p = pts[Number(g.dataset.i)];
    const show = (e) => {
      tip.style.display = 'block';
      tip.style.left = ((e.clientX ?? 0) + 12) + 'px';
      tip.style.top = ((e.clientY ?? 0) + 12) + 'px';
      tip.innerHTML = `<strong>${esc(p.label)}</strong><br>quality ${n3(p.quality)}<br>
        cost $${n3(p.cost_usd)}<br>latency ${Math.round(p.latency_ms)} ms<br>
        ${p.non_dominated ? 'on the frontier' : 'dominated'}`;
    };
    g.addEventListener('mousemove', show);
    g.addEventListener('focus', show);
    g.addEventListener('mouseleave', () => tip.style.display = 'none');
    g.addEventListener('blur', () => tip.style.display = 'none');
  });
}

// ── coverage ───────────────────────────────────────────────────────────────────
function renderCoverage(c) {
  const el = $('coverage');
  if (!c || !c.measured) {
    el.innerHTML = `<p class="muted">Coverage has not been measured for this eval set.
      Running without measuring it means the board cannot say whether the failing path was ever exercised.</p>`;
    return;
  }
  const dims = (c.dimensions || []).map(d => d.vacuous ? `
    <div style="margin-bottom:10px">
      <div class="row" style="justify-content:space-between">
        <span>${esc(d.name)} coverage</span>
        <span><span class="chip chip-lowconf">not measurable — no obligations on this axis</span></span>
      </div>
      <div class="meter"><i style="width:0%"></i></div>
    </div>` : `
    <div style="margin-bottom:10px">
      <div class="row" style="justify-content:space-between">
        <span>${esc(d.name)} coverage</span>
        <span class="mono">${pct(d.achieved)} of ${pct(d.target)} target
          <span class="muted">(${d.covered} of ${d.total})</span></span>
      </div>
      <div class="meter ${d.met ? '' : 'short'}"><i style="width:${Math.round(d.achieved * 100)}%"></i></div>
    </div>`).join('');

  const residual = (c.residual || []).length ? `
    <h2 style="margin-top:14px">Residual — ${c.residual.length} obligation(s) not discharged</h2>
    <table><thead><tr><th>Obligation</th><th>Dimension</th><th>Why</th></tr></thead><tbody>
      ${c.residual.map(r => `<tr>
        <td class="mono">${esc(r.id)}</td>
        <td>${esc(r.dimension)} <span class="muted">${esc(r.kind)}</span></td>
        <td>${esc(r.reason)}${r.unreachable ? ' <span class="chip chip-weak">unreachable</span>' : ''}</td>
      </tr>`).join('')}
    </tbody></table>
    <p class="muted" style="font-size:12px">These stay in the denominator. Dropping them would raise the
    percentage by deleting the evidence of failure.</p>` : '';

  const diff = c.difficulty_measured
    ? `<span class="mono">${n2(c.difficulty)}</span>`
    : `<span class="chip chip-lowconf">not measured</span>`;

  el.innerHTML = `
    ${c.met ? '' : `<div class="banner banner-note" style="margin-bottom:12px">
      <strong>Coverage below threshold.</strong> ${esc(c.stopped_because || '')}</div>`}
    ${dims}
    <div class="kv" style="margin-top:12px">
      <span class="muted">cases</span><span class="mono">${c.n_cases}</span>
      <span class="muted">rounds</span><span class="mono">${c.iterations}</span>
      <span class="muted">difficulty</span><span>${diff}</span>
      <span class="muted">diversity</span><span class="mono">${n2(c.diversity)}</span>
      <span class="muted">oracle coverage</span>
      <span class="mono">${pct(c.oracle_coverage)} <span class="muted">(${c.n_oracle} of ${c.n_cases} cases can decide success${
        c.n_indecisive ? `; ${c.n_indecisive} carry an oracle that can never fail` : ''})</span></span>
      <span class="muted">references</span>
      <span><span class="chip chip-pass">${c.n_gold} gold</span>
            <span class="chip chip-weak">${c.n_weak} weak</span>
            <span class="chip">${c.n_none} none</span></span>
      <span></span><span></span>
    </div>
    ${(c.reasons || []).length ? `<ul class="muted" style="margin:10px 0 0 18px">
       ${c.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    ${residual}`;
}

// ── spend ──────────────────────────────────────────────────────────────────────
function renderSpend(s) {
  if (!s || !s.by_kind) { $('spend').innerHTML = '<p class="muted">No spend recorded.</p>'; return; }
  const rows = Object.keys(s.by_kind).sort().map(k =>
    `<tr><td>${esc(k)}</td><td class="mono">$${Number(s.by_kind[k]).toFixed(4)}</td>
     <td class="mono">${(s.calls_by_kind || {})[k] || 0} calls</td></tr>`).join('');
  const hit = (s.exhausted || []).length
    ? `<div class="banner banner-tie" style="margin-top:10px"><strong>Budget cap reached:</strong>
       <span class="mono">${esc(s.exhausted.join(', '))}</span>. Measurement stopped rather than overspending.</div>` : '';
  $('spend').innerHTML = `<table><thead><tr><th>Kind</th><th>USD</th><th>Calls</th></tr></thead>
    <tbody>${rows}<tr><td><strong>total</strong></td>
    <td class="mono"><strong>$${Number(s.total_usd).toFixed(4)}</strong></td><td></td></tr></tbody></table>${hit}`;
}

// ── load ───────────────────────────────────────────────────────────────────────
function render(v) {
  VIEW = v;
  $('wf').textContent = v.eval_set_hash
    ? `${v.workflow_id} · eval_set ${v.eval_set_hash.slice(0, 12)}`
    : v.workflow_id;
  renderBanners(v);

  // On ERROR the board scaffold is HIDDEN, not filled with empty sections. Rendering "0
  // gate-passing under undefined" beside an error banner reads as "the board is fine, it just has
  // no rows" — the opposite of what an error means, and the first live render did exactly that.
  const sections = [...document.querySelectorAll('main > section')];
  if (v.state === 'error') {
    sections.forEach(s => s.hidden = true);
    return;
  }
  sections.forEach(s => { if (s.id !== 'dq-card') s.hidden = false; });

  if (v.state === 'empty') {
    $('lb').innerHTML = `<p class="muted">No variants on this board yet. Add a variant to compare.</p>`;
    $('dq-card').hidden = true;
    renderPareto([]);
    renderCoverage(v.coverage);
    renderSpend(v.spend);
    return;
  }

  $('lb-sub').textContent = `— ${v.ranked.length} gate-passing under ${v.profile} · ${v.runs_enqueued} new runs`;
  renderTable($('lb'), v.ranked, {id: 'lb', empty: 'No variant passed every gate.'});
  $('dq-card').hidden = (v.disqualified || []).length === 0;
  if (!$('dq-card').hidden) {
    renderTable($('dq'), v.disqualified, {id: 'dq', empty: ''});
  }
  renderPareto(v.pareto || []);
  renderCoverage(v.coverage);
  renderSpend(v.spend);
}

async function load(profile) {
  try {
    const url = `/api/p4/workflows/${encodeURIComponent(workflowID)}/board` +
                (profile ? `?profile=${encodeURIComponent(profile)}` : '');
    const res = await fetch(url);
    if (!res.ok) {
      const body = await res.json().catch(() => ({error: res.statusText}));
      render({state: 'error', error: `${res.status} — ${body.error || res.statusText}`,
              workflow_id: workflowID, ranked: [], disqualified: [], pareto: [], profiles: []});
      return;
    }
    const v = await res.json();
    const sel = $('profile');
    if (!sel.options.length) {
      sel.innerHTML = (v.profiles || []).map(p =>
        `<option value="${esc(p)}"${p === v.profile ? ' selected' : ''}>${esc(p)}</option>`).join('');
      sel.addEventListener('change', () => load(sel.value));
    }
    render(v);
  } catch (e) {
    render({state: 'error', error: String(e), workflow_id: workflowID,
            ranked: [], disqualified: [], pareto: [], profiles: []});
  }
}

$('lb').innerHTML = '<p class="muted">Loading…</p>';
load('');
</script>
</body>
