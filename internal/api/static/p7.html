<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P7 — Billing &amp; usage</title>

<!--
  P7 billing/usage surface: spend under management, the plan and what it entitles, the invoice broken
  into subscription / metered / VERIFIED gainshare, and the verified-savings evidence.

  RULES THAT SHAPE EVERYTHING:
    - NO DOLLAR FIGURE, PERCENTAGE, OR LIMIT IS HARDCODED HERE. Every amount, allowance and unit comes
      from the API. The client does no arithmetic on money: where the platform holds only a provider
      handle, the handle is shown, because rendering a number nobody can justify is worse than showing
      the reference that can be looked up.
    - EVERY DENIAL NAMES WHAT WAS GATED, WHY, AND THE PLAN THAT LIFTS IT — rendered verbatim from the
      server's decision, so the paywall copy cannot drift from what was actually enforced.
    - GAINSHARE SHOWS ITS EVIDENCE. Every gainshare line links to the verified delta and the merged PR
      behind it, and the fixed baseline + hold-out method is one interaction away. Estimated and
      un-merged savings appear in their own group, marked NOT BILLED.
    - DUNNING IS THE PROVIDER'S. payment-failed / past-due are mirrored, never computed here.
    - Every status is a chip with TEXT (never colour alone). Consent and denial states are
      keyboard-reachable and announced (aria-live).
  Chart colour is the house categorical palette, validated for BOTH modes against this page's chart
  surface. NO build step, no external resource.
-->

<style>
  :root {
    --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8fa3bd; --accent:#3d8bfd;
    --line:#243247; --ctl:#2a3a52; --grid:#2c3a4e;

    /* Categorical chart steps — dark, checked against this page's chart surface (#1a2332):
       lightness band PASS, chroma floor PASS, CVD separation ΔE 27.3 (deutan) PASS, normal-vision
       ΔE 29.9 PASS, contrast PASS. */
    --series-1:#3987e5;   /* blue  — baseline SUM */
    --series-2:#008300;   /* green — optimized SUM / verified savings */

    /* Status palette — reserved, never reused as a series, always paired with a text chip. */
    --good:#3ec46d; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --info:#3987e5;
    --track:#22304a;
  }
  :root[data-theme="light"] {
    --bg:#fcfcfb; --card:#ffffff; --text:#0b0b0b; --muted:#52514e; --accent:#2a78d6;
    --line:#e3e2dc; --ctl:#f0efe9; --grid:#e3e2dc;
    /* Light steps are SELECTED, not an automatic flip: re-validated against #ffffff (all checks PASS;
       tritan separation 7.8 sits in the 6–8 floor band, which is why both series also carry a legend,
       direct labels and a surface gap — hue is never the only encoding here). */
    --series-1:#2a78d6; --series-2:#1a7f37;
    --good:#1a7f37; --warning:#bf8700; --serious:#eb6834; --critical:#cf222e; --info:#2a78d6;
    --track:#e8e7e0;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#fcfcfb; --card:#ffffff; --text:#0b0b0b; --muted:#52514e; --accent:#2a78d6;
      --line:#e3e2dc; --ctl:#f0efe9; --grid:#e3e2dc;
      --series-1:#2a78d6; --series-2:#1a7f37;
      --good:#1a7f37; --warning:#bf8700; --serious:#eb6834; --critical:#cf222e; --info:#2a78d6;
      --track:#e8e7e0;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:20; padding:12px 20px; border-bottom:1px solid var(--line);
           background:var(--bg); display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  h2 { font-size:12px; margin:0 0 10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
       color:var(--muted); }
  h3 { font-size:13px; margin:14px 0 8px; font-weight:600; }
  main { padding:20px; display:grid; gap:16px; max-width:1080px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .muted { color:var(--muted); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .spacer { flex:1; }
  input, select, button { font:inherit; color:var(--text); background:var(--ctl); border:1px solid var(--line);
           border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger  { border-color:var(--critical); color:var(--critical); }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 9px;
          border-radius:999px; border:1px solid var(--line); white-space:nowrap; font-weight:600; }
  .chip::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .chip.ok        { border-color:var(--good);     color:var(--good); }
  .chip.warn      { border-color:var(--warning);  color:var(--warning); }
  .chip.bad       { border-color:var(--critical); color:var(--critical); }
  .chip.info      { border-color:var(--info);     color:var(--info); }
  .chip.off       { border-color:var(--muted);    color:var(--muted); }
  .chip.plain::before { display:none; }

  .banner { border-radius:6px; padding:12px 14px; font-size:13px; border:1px solid var(--line);
            display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .banner .b-body { flex:1; min-width:240px; }
  .banner .b-title { font-weight:600; margin-bottom:2px; }
  .banner.deny  { border-color:var(--warning);  background:color-mix(in srgb,var(--warning) 12%,transparent); }
  .banner.dun   { border-color:var(--critical); background:color-mix(in srgb,var(--critical) 12%,transparent); }
  .banner.drift { border-color:var(--serious);  background:color-mix(in srgb,var(--serious) 12%,transparent); }

  .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .stat .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .stat .v { font-size:22px; font-weight:600; }
  .stat .u { font-size:12px; color:var(--muted); font-weight:400; margin-left:4px; }

  .meter { height:8px; border-radius:999px; background:var(--track); overflow:hidden; margin-top:6px; }
  .meter > div { height:100%; background:var(--good); }
  .meter.over > div { background:var(--critical); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
       font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num { text-align:right; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

  .kind { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .k-subscription { color:var(--info); }
  .k-metered      { color:var(--series-1); }
  .k-gainshare    { color:var(--series-2); }
  .k-credit, .k-refund { color:var(--warning); }

  details.evidence { margin-top:6px; }
  details.evidence > summary { cursor:pointer; font-size:12px; color:var(--muted); }
  details.evidence > summary:hover { color:var(--text); }
  .ev { border-left:2px solid var(--series-2); padding:4px 0 4px 10px; margin-top:6px; font-size:12px; }
  .ev .m { color:var(--muted); }

  .excluded td { color:var(--muted); }

  .skel { background:linear-gradient(90deg,var(--ctl) 25%,var(--line) 50%,var(--ctl) 75%);
          background-size:200% 100%; animation:sk 1.2s linear infinite; border-radius:4px; height:14px; }
  @keyframes sk { from { background-position:200% 0 } to { background-position:-200% 0 } }
  .empty { color:var(--muted); font-size:13px; padding:12px 0; }

  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px;
              vertical-align:-1px; }
  figure { margin:0; }
  figcaption { font-size:12px; color:var(--muted); margin-top:6px; }
  .hidden { display:none; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>

<header>
  <h1>P7 · Billing &amp; usage</h1>
  <span id="planChip" class="chip plain off">—</span>
  <span id="stateChip" class="chip off">—</span>
  <span class="spacer"></span>
  <label class="muted" for="customer">Customer</label>
  <input id="customer" size="18" aria-label="Customer id">
  <label class="muted" for="period">Period</label>
  <select id="period" aria-label="Billing period"></select>
  <button id="reload" class="primary">Load</button>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>

<main>
  <!-- Dunning / denial / drift: first-class states, announced. -->
  <div id="banners" aria-live="polite"></div>

  <!-- 1. What am I spending? -->
  <section class="card" aria-labelledby="h-sum">
    <h2 id="h-sum">Spend under management</h2>
    <div id="sumStats" class="grid3"></div>
    <div id="meters" style="margin-top:14px"></div>
  </section>

  <!-- Charts -->
  <section class="card" aria-labelledby="h-charts">
    <h2 id="h-charts">Trend</h2>
    <div id="charts"></div>
  </section>

  <!-- 2. What am I on, and what does it entitle? -->
  <section class="card" aria-labelledby="h-plan">
    <h2 id="h-plan">Plan &amp; entitlements</h2>
    <div id="plan"></div>
  </section>

  <!-- 3. What am I being charged, and why? -->
  <section class="card" aria-labelledby="h-invoice">
    <h2 id="h-invoice">Invoice breakdown</h2>
    <div id="invoice"></div>
  </section>

  <!-- 4. What did you actually save me? -->
  <section class="card" aria-labelledby="h-savings">
    <h2 id="h-savings">Verified savings &amp; gainshare</h2>
    <div id="savings"></div>
  </section>
</main>

<script>
"use strict";

// ── formatting ───────────────────────────────────────────────────────────────
// NOTE what these do NOT do: they never attach a currency symbol, never apply a rate, and never
// compute a total from other numbers. Every figure is rendered exactly as the server sent it, with the
// unit the server sent. A currency literal in this file is a defect (task 7.4).
const NF = new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 });
const num = v => (v === null || v === undefined) ? "—" : NF.format(v);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const $ = id => document.getElementById(id);
let VIEW = null;

// ── data ─────────────────────────────────────────────────────────────────────
async function load() {
  const cus = $("customer").value.trim();
  const period = $("period").value;
  if (!cus) {
    // An empty tenant is not a request. Say so, rather than asking the server about "".
    showError("No customer selected. Open this page as /p7/billing?customer=<id>, " +
              "or type a customer id above.");
    return;
  }
  showLoading();
  try {
    const url = `/api/p7/customers/${encodeURIComponent(cus)}/billing` +
                (period ? `?period=${encodeURIComponent(period)}` : "");
    const r = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      showError(body.error || `HTTP ${r.status}`);
      return;
    }
    VIEW = await r.json();
    render(VIEW);
  } catch (e) {
    // Never a silent failure: a billing page that quietly shows nothing is indistinguishable from a
    // customer who used nothing.
    showError(String(e));
  }
}

async function setConsent(consented) {
  const cus = $("customer").value.trim();
  const r = await fetch(`/api/p7/customers/${encodeURIComponent(cus)}/gainshare-consent`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ consented })
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    showError(body.error || `HTTP ${r.status}`);
    return;
  }
  VIEW = await r.json();
  render(VIEW);
}

// ── states ───────────────────────────────────────────────────────────────────
function showLoading() {
  // Skeletons, never a spinner over stale numbers: a stale figure that looks live is worse than none.
  const sk = '<div class="skel" style="width:60%"></div>';
  for (const id of ["sumStats", "meters", "charts", "plan", "invoice", "savings"]) $(id).innerHTML = sk;
  $("banners").innerHTML = "";
}

function showError(msg) {
  $("banners").innerHTML = banner("dun", "Could not load billing", esc(msg), "");
  for (const id of ["sumStats", "meters", "charts", "plan", "invoice", "savings"]) $(id).innerHTML = "";
}

function banner(cls, title, body, action) {
  return `<div class="banner ${cls}" role="status"><div class="b-body">` +
         `<div class="b-title">${title}</div><div>${body}</div></div>${action || ""}</div>`;
}

// ── render ───────────────────────────────────────────────────────────────────
function render(v) {
  renderPeriods(v);
  renderBanners(v);
  renderSUM(v);
  renderCharts(v);
  renderPlan(v);
  renderInvoice(v);
  renderSavings(v);

  $("planChip").textContent = v.plan_name ? `${v.plan_name} plan` : "—";
  const st = v.state || {};
  const chip = $("stateChip");
  // The header status and the invoice below it must never disagree. The provider's WEBHOOK state wins
  // when there is one (it is the most recent thing the provider told us); absent a webhook, the header
  // reflects the invoice actually rendered on the page rather than claiming there is none.
  const invStatus = (v.invoice || {}).status;
  if (st.payment_failed)      { chip.className = "chip bad"; chip.textContent = "Payment failed"; }
  else if (st.past_due)       { chip.className = "chip bad"; chip.textContent = "Past due"; }
  else if (st.invoice_status) { chip.className = "chip ok";  chip.textContent = st.invoice_status; }
  else if (invStatus)         { chip.className = "chip info"; chip.textContent = "Invoice " + invStatus; }
  else { chip.className = "chip off"; chip.textContent = "No invoice yet"; }
}

function renderPeriods(v) {
  const sel = $("period");
  const cur = v.period;
  const opts = (v.available_periods && v.available_periods.length) ? v.available_periods : [cur];
  sel.innerHTML = opts.map(p => `<option value="${esc(p)}"${p === cur ? " selected" : ""}>${esc(p)}</option>`).join("");
}

function renderBanners(v) {
  const out = [];

  // Dunning — the PROVIDER's state, mirrored, with what to do next.
  const st = v.state || {};
  if (st.payment_failed || st.past_due) {
    out.push(banner("dun",
      st.payment_failed ? "Payment failed" : "Past due",
      esc(st.guidance || "Your billing provider reports this account as unpaid.") +
      (st.subscription_status ? ` <span class="muted">(subscription: ${esc(st.subscription_status)})</span>` : ""),
      ""));
  }

  // Denial — the gate's decision, VERBATIM. The client composes no explanation of its own.
  if (v.denial) {
    const d = v.denial;
    let body = esc(d.reason);
    if (d.limit) {
      body += `<div class="muted" style="margin-top:4px">${esc(d.limit.label)} for ${esc(d.limit.period)}: ` +
              `<strong>${num(d.limit.observed)}</strong> of ${num(d.limit.allowed)}</div>`;
    }
    const action = d.upgrade_plan_name
      ? `<button class="primary" id="upgradeBtn">Upgrade to ${esc(d.upgrade_plan_name)}</button>` : "";
    out.push(banner("deny", esc(d.feature_label || d.feature) + " is not available", body, action));
  }

  // Drift — surfaced, never hidden. The customer hears it from us, not from their statement.
  for (const d of (v.drift || [])) {
    out.push(banner("drift", "Usage reconciliation found a difference",
      `${esc(d.detail)} <span class="muted">(${esc(d.metric)}: platform ${num(d.platform_quantity)}, ` +
      `provider ${num(d.provider_quantity)})</span>`, ""));
  }

  $("banners").innerHTML = out.join("");
}

function renderSUM(v) {
  if (v.empty) {
    // "No usage recorded yet" is NOT a measured zero. They look identical as a number and mean
    // opposite things.
    $("sumStats").innerHTML = `<div class="empty">No usage recorded for ${esc(v.period)} yet.</div>`;
    $("meters").innerHTML = "";
    return;
  }
  $("sumStats").innerHTML = `
    <div class="stat"><div class="k">SUM under management</div>
      <div class="v" id="sumValue">${num(v.sum)}<span class="u">${esc(v.sum_unit || "")}</span></div></div>
    <div class="stat"><div class="k">Verified savings</div>
      <div class="v">${num((v.savings || {}).verified_savings)}<span class="u">${esc((v.savings || {}).unit || "")}</span></div></div>
    <div class="stat"><div class="k">Billing period</div><div class="v">${esc(v.period)}</div></div>`;

  const rows = (v.meters || []).map(m => {
    // An UNSET allowance is UNLIMITED, never zero — the two have the same numeric shape and opposite
    // meanings, so they are rendered as different things.
    const cap = m.unlimited ? "unlimited" : num(m.allowed);
    const pct = (m.unlimited || !m.allowed) ? 0 : Math.min(100, (m.value / m.allowed) * 100);
    const bar = m.unlimited ? "" :
      `<div class="meter${m.over ? " over" : ""}"><div style="width:${pct}%"></div></div>`;
    const over = m.over ? ` <span class="chip bad">over limit</span>` : "";
    const sent = m.reported_to_provider
      ? ` <span class="chip ok plain" title="${esc(m.provider_usage_ref || "")}">reported</span>`
      : ` <span class="chip off plain">not reported yet</span>`;
    return `<tr><td>${esc(m.label)}${over}${sent}</td>` +
           `<td class="num">${num(m.value)} <span class="muted">${esc(m.unit || "")}</span></td>` +
           `<td class="num muted">of ${cap}</td><td style="width:36%">${bar}</td></tr>`;
  }).join("");
  $("meters").innerHTML = rows
    ? `<table><thead><tr><th>Meter</th><th class="num">This period</th><th class="num">Allowance</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">No meters recorded for this period.</div>`;
}

// ── charts ───────────────────────────────────────────────────────────────────
// Two charts, because the page answers four questions and only two are shaped like a trend. One axis
// each — never two y-scales. Bars are thin, with 4px rounded tops and a 2px surface gap between
// adjacent fills; identity is carried by a legend AND direct labels, so hue is never the only encoding.
function renderCharts(v) {
  const pts = v.sum_trend || [];
  if (!pts.length) {
    $("charts").innerHTML = `<div class="empty">No periods with recorded usage yet.</div>`;
    return;
  }
  const hasSavings = pts.some(p => p.baseline_sum > 0 || p.optimized_sum > 0);
  $("charts").innerHTML =
    barChart("SUM under management by period", pts, [{ key: "sum", color: "var(--series-1)", label: "SUM" }],
             v.sum_unit) +
    (hasSavings
      ? barChart("Baseline vs optimized SUM", pts,
          [{ key: "baseline_sum", color: "var(--series-1)", label: "Baseline" },
           { key: "optimized_sum", color: "var(--series-2)", label: "Optimized" }], v.sum_unit)
      : `<figure><figcaption>Baseline vs optimized SUM — nothing verified and merged yet.</figcaption></figure>`);
}

function barChart(title, pts, series, unit) {
  const W = 640, H = 190, padL = 46, padR = 12, padT = 14, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = Math.max(...pts.flatMap(p => series.map(s => p[s.key] || 0)), 0) || 1;
  const y = val => padT + plotH - (val / max) * plotH;

  const groupW = plotW / pts.length;
  const gap = 2;                                   // 2px surface gap between adjacent fills
  // THIN marks: a bar's job is to be compared, not to fill the cell. Capped at 34px per bar so a
  // three-period chart does not render as three slabs, and floored at 6px so it stays hittable.
  const barW = Math.min(34, Math.max(6, (groupW * 0.55 - gap * (series.length - 1)) / series.length));

  let marks = "", labels = "";
  pts.forEach((p, i) => {
    const gx = padL + i * groupW + (groupW - (barW * series.length + gap * (series.length - 1))) / 2;
    series.forEach((s, j) => {
      const val = p[s.key] || 0;
      const x = gx + j * (barW + gap);
      const top = y(val), h = Math.max(0, padT + plotH - top);
      marks += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" ` +
               `height="${h.toFixed(1)}" rx="4" fill="${s.color}"><title>${esc(p.period)} · ${esc(s.label)}: ${num(val)} ${esc(unit || "")}</title></rect>`;
      // Direct labels are SELECTIVE: only the most recent period, so the chart is readable rather than
      // a wall of numbers — and so identity survives for a colour-blind reader.
      if (i === pts.length - 1) {
        labels += `<text x="${(x + barW / 2).toFixed(1)}" y="${(top - 4).toFixed(1)}" text-anchor="middle" ` +
                  `font-size="10" fill="currentColor">${num(val)}</text>`;
      }
    });
    labels += `<text x="${(padL + i * groupW + groupW / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle" ` +
              `font-size="10" fill="currentColor" opacity=".65">${esc(p.period)}</text>`;
  });

  const grid = [0, .5, 1].map(f => {
    const yy = padT + plotH - f * plotH;
    return `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>` +
           `<text x="${padL - 6}" y="${yy + 3}" text-anchor="end" font-size="10" fill="currentColor" opacity=".65">${num(max * f)}</text>`;
  }).join("");

  // A legend is present for >= 2 series; a single series needs none — the title names it.
  const legend = series.length > 1
    ? `<div class="legend">` + series.map(s =>
        `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("") + `</div>`
    : "";

  // The table view: identity and value are available without colour, and to a screen reader.
  const table = `<details><summary class="muted" style="font-size:12px;cursor:pointer">Table view</summary>` +
    `<table><thead><tr><th>Period</th>` + series.map(s => `<th class="num">${esc(s.label)}</th>`).join("") +
    `</tr></thead><tbody>` + pts.map(p => `<tr><td>${esc(p.period)}</td>` +
      series.map(s => `<td class="num">${num(p[s.key] || 0)}</td>`).join("") + `</tr>`).join("") +
    `</tbody></table></details>`;

  return `<figure style="margin-bottom:18px"><h3>${esc(title)}</h3>${legend}` +
    `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(title)}" style="color:var(--text)">` +
    `${grid}${marks}${labels}</svg>` +
    `<figcaption>Values in ${esc(unit || "the meter's unit")}, as reported by the billing API.</figcaption>` +
    table + `</figure>`;
}

// ── plan & entitlements ──────────────────────────────────────────────────────
function renderPlan(v) {
  const rows = (v.entitlements || []).map(e => {
    const chip = e.included ? `<span class="chip ok">included</span>`
                            : `<span class="chip off">not included</span>`;
    const why = e.included ? "" :
      `<div class="muted" style="font-size:12px;margin-top:2px">${esc(e.reason || "")}` +
      (e.upgrade_plan_name ? ` — <strong>${esc(e.upgrade_plan_name)}</strong> includes it` : "") + `</div>`;
    return `<tr><td>${esc(e.label)}${why}</td><td style="width:150px">${chip}</td></tr>`;
  }).join("");
  $("plan").innerHTML =
    `<div class="row" style="margin-bottom:10px">` +
      `<span class="chip plain info">${esc(v.plan_name || "—")}</span>` +
      `<span class="muted mono">plan_id ${esc(v.plan_id || "—")} · config ${esc(v.plan_config_version || "—")}</span>` +
    `</div>` +
    (rows ? `<table><thead><tr><th>Surface</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`
          : `<div class="empty">No entitlements resolved.</div>`);
}

// ── invoice ──────────────────────────────────────────────────────────────────
function renderInvoice(v) {
  const inv = v.invoice || {};
  const lines = inv.lines || [];
  if (!lines.length) {
    $("invoice").innerHTML = `<div class="empty">No charges raised for ${esc(v.period)} yet.</div>`;
    return;
  }
  const rows = lines.map(l => {
    const ev = (l.evidence && l.evidence.length) ? evidenceBlock(l) : "";
    const corrects = l.corrects ? `<div class="muted" style="font-size:12px">corrects ${esc(l.corrects)}</div>` : "";
    // The amount column shows the provider's opaque AMOUNT REFERENCE. The platform does not hold an
    // amount, and inventing one here would be showing a number nobody can justify.
    return `<tr><td><span class="kind k-${esc(l.kind)}">${esc(l.kind)}</span></td>` +
      `<td>${esc(l.label)}<div class="muted mono">${esc(l.basis)}</div>${corrects}${ev}</td>` +
      `<td class="num">${num(l.quantity)} <span class="muted">${esc(l.unit || "")}</span></td>` +
      `<td class="num mono muted">${esc(l.amount_ref || "—")}</td></tr>`;
  }).join("");

  const totals = (inv.totals || []).map(t =>
    `<tr><td colspan="2" class="muted">${esc(t.label)} · ${t.lines} line(s)</td>` +
    `<td class="num">${num(t.quantity)}</td><td></td></tr>`).join("");

  $("invoice").innerHTML =
    `<div class="row muted mono" style="margin-bottom:8px">${esc(inv.invoice_ref || "")} ` +
    (inv.status ? `<span class="chip plain info">${esc(inv.status)}</span>` : "") + `</div>` +
    `<table><thead><tr><th>Kind</th><th>Line &amp; basis</th><th class="num">Quantity</th>` +
    `<th class="num">Amount ref</th></tr></thead><tbody>${rows}${totals}</tbody></table>` +
    `<div class="muted" style="font-size:12px;margin-top:8px">Amounts are held by the billing provider; ` +
    `the platform stores the reference so every line can be looked up against the provider's record.</div>`;
}

function evidenceBlock(l) {
  const items = l.evidence.map(e => {
    const link = e.link ? `<a href="${esc(e.link)}" rel="noreferrer">${esc(e.label)}</a>` : esc(e.label);
    const m = e.method ? `<div class="m">baseline+hold-out <strong>${esc(e.method.id)}</strong> · ` +
      `${e.method.holdout_cases} held-out case(s), ${e.method.generating_cases} generating case(s) excluded, ` +
      `${e.method.seeds} seed(s) · eval set <span class="mono">${esc(e.method.eval_set_hash)}</span></div>` : "";
    return `<div class="ev"><span class="chip ok plain">${esc(e.kind === "merge" ? "merged" : "verified")}</span> ${link}${m}</div>`;
  }).join("");
  return `<details class="evidence"><summary>Verified &amp; merged evidence (${l.evidence.length})</summary>${items}</details>`;
}

// ── savings & gainshare consent ──────────────────────────────────────────────
function renderSavings(v) {
  const s = v.savings || {};
  const out = [];

  // The consent contract — informed, recorded, REVOCABLE, at equal visual weight either way.
  if (s.consent_available) {
    out.push(`<div class="banner ${s.gainshare_consent ? "" : "deny"}" style="margin-bottom:12px">
      <div class="b-body">
        <div class="b-title">Gainshare${s.gainshare_consent ? " is on" : " is off"}</div>
        <div>You pay a share of the savings we <strong>verify and merge</strong>. Estimated savings,
        unverified savings, and verified savings that were never merged are <strong>never billed</strong>.
        Every gainshare line links to the verified delta and the merged pull request behind it, with the
        fixed baseline + hold-out method attached.</div>
        ${s.consented_at ? `<div class="muted" style="font-size:12px;margin-top:4px">Consented ${esc(s.consented_at)}</div>` : ""}
      </div>
      <button id="consentBtn" class="${s.gainshare_consent ? "danger" : "primary"}">
        ${s.gainshare_consent ? "Revoke consent" : "Give consent"}</button></div>`);
  }

  if (s.none_verified) {
    // Explicitly not "0 saved", which reads as a failure rather than an absence.
    out.push(`<div class="empty">Nothing verified and merged this period.</div>`);
  } else {
    out.push(`<div class="grid3" style="margin-bottom:10px">
      <div class="stat"><div class="k">Baseline SUM</div><div class="v">${num(s.baseline_sum)}<span class="u">${esc(s.unit || "")}</span></div></div>
      <div class="stat"><div class="k">Optimized SUM</div><div class="v">${num(s.optimized_sum)}<span class="u">${esc(s.unit || "")}</span></div></div>
      <div class="stat"><div class="k">Verified savings</div><div class="v">${num(s.verified_savings)}<span class="u">${esc(s.unit || "")}</span></div></div>
    </div>`);
    const rows = (s.billed || []).map(b => {
      const m = b.method ? `<div class="muted" style="font-size:12px">baseline+hold-out <strong>${esc(b.method.id)}</strong> · ` +
        `${b.method.holdout_cases} held-out, ${b.method.generating_cases} generating excluded, ${b.method.seeds} seeds</div>` : "";
      return `<tr><td><span class="chip ok">verified &amp; merged</span></td>` +
        `<td><span class="mono">${esc(b.ref)}</span> · merge <span class="mono">${esc(b.merge_commit)}</span>${m}</td>` +
        `<td class="num">${num(b.baseline_sum)}</td><td class="num">${num(b.optimized_sum)}</td>` +
        `<td class="num">${num(b.savings)}</td></tr>`;
    }).join("");
    if (rows) {
      out.push(`<table><thead><tr><th>Status</th><th>Evidence</th><th class="num">Baseline</th>` +
        `<th class="num">Optimized</th><th class="num">Saved</th></tr></thead><tbody>${rows}</tbody></table>`);
    }
  }

  // What was CONSIDERED and not billed. Showing only the billed rows would leave the trust claim
  // unevidenced — this is the quantified version of "we declined to bill this".
  if ((s.excluded || []).length) {
    const rows = s.excluded.map(e =>
      `<tr class="excluded"><td><span class="chip off">not billed</span></td>` +
      `<td><span class="mono">${esc(e.ref)}</span><div style="font-size:12px">${esc(e.reason)}</div></td>` +
      `<td class="num" colspan="3">${num(e.would_have_been)}</td></tr>`).join("");
    out.push(`<h3>Considered and not billed</h3>` +
      `<table><thead><tr><th>Status</th><th>Why not</th><th class="num" colspan="3">Would have been</th></tr></thead>` +
      `<tbody>${rows}</tbody></table>`);
  }

  $("savings").innerHTML = out.join("");
  const btn = $("consentBtn");
  if (btn) btn.addEventListener("click", () => setConsent(!(v.savings || {}).gainshare_consent));
}

// ── wiring ───────────────────────────────────────────────────────────────────
// The tenant comes from the URL, never from a constant in the client. A billing surface that ships
// with somebody's customer id baked in shows the wrong account to everyone else, and the failure looks
// like "no billing account" rather than like a bug.
const params = new URLSearchParams(location.search);
$("customer").value = params.get("customer") || "";
if (params.get("period")) {
  $("period").innerHTML = `<option selected>${esc(params.get("period"))}</option>`;
}

$("reload").addEventListener("click", load);
$("period").addEventListener("change", load);
$("customer").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
$("theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "light" ? "dark" : "light");
  if (VIEW) render(VIEW);   // charts read the CSS variables, so re-render on a theme change
});
load();
</script>
