name: Install smoke

# The fresh-machine install matrix and tamper red-check (P20 tasks 6.3, 7.1–7.3), on GitHub-hosted runners.
#
# # Why this runs here and not only on a maintainer's machine
#
# Task 7.1 asks for a GENUINELY clean environment per OS — "not the maintainer's machine". A hosted runner is
# the cleanest environment available: a fresh image per job, no prior heros, no toolchain the job did not
# install, and quarantine behaviour intact on macOS. It is also the only way to execute `install.ps1` on real
# Windows, which no amount of local effort achieves from a Mac.
#
# # Why the happy path is conditional and the refusals are not
#
# `install.sh` and `install.ps1` pin the release public key, so a fixture they ACCEPT must be signed by the real
# private key. The four refusals need no key at all — a tampered download, a rewritten manifest, a missing
# signature and a foreign key must each be rejected regardless — so they run on every PR, unconditionally.
#
# The happy path runs only where the signing secret is available. That split is stated in the job summary rather
# than hidden: a matrix that quietly shrank to the cases it could run would report a smaller thing as a
# complete one, which is the false green this repository keeps re-learning to distrust.

on:
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/install_smoke.py"
      - "scripts/install_smoke.ps1"
      - "scripts/release-cli.sh"
      - "internal/release/**"
      - "internal/distribution/**"
      - ".github/workflows/install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: install.sh · ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is included specifically because its verifier situation is the awkward one: /usr/bin/openssl is
        # LibreSSL and cannot verify ed25519 at all, so this job is what proves the ssh-keygen path works on a
        # stock image rather than only on a machine with Homebrew openssl.
        runner: [ubuntu-22.04, macos-15]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assert the environment is actually fresh
        shell: bash
        run: |
          set -euo pipefail
          # A pre-existing heros would make the "no verifier available" branch unreachable and could make a
          # happy path pass for the wrong reason. This is the assertion that the environment is what the test
          # claims it is.
          if command -v heros >/dev/null 2>&1; then
            echo "::error::a heros binary is already on PATH ($(command -v heros)) — this is not a fresh machine"
            exit 1
          fi
          echo "no prior heros: $(uname -srm)"
          command -v ssh-keygen >/dev/null && echo "ssh-keygen present (the installer's verifier)"
      - name: install smoke + tamper red-check
        env:
          HEROS_RELEASE_PRIVATE_KEY: ${{ secrets.HEROS_RELEASE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HEROS_RELEASE_PRIVATE_KEY:-}" ]; then
            echo "::notice::HEROS_RELEASE_PRIVATE_KEY is unavailable in this context, so the fixture cannot be"\
                 "signed by the key install.sh pins. Running the REFUSAL cases only; the happy path is covered"\
                 "by the post-publish smoke job in release.yml, against the real published release."
            # The refusal cases are exactly the ones that need no valid signature.
            python3 scripts/install_smoke.py --host --refusals-only
          else
            python3 scripts/install_smoke.py --host
          fi

  windows:
    name: install.ps1 · windows-2022
    runs-on: windows-2022
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: assert the environment is actually fresh
        shell: pwsh
        run: |
          if (Get-Command heros -ErrorAction SilentlyContinue) {
            Write-Host "::error::a heros binary is already on PATH — this is not a fresh machine"
            exit 1
          }
          # ssh-keygen is the ONLY ed25519 verifier a stock Windows machine has: .NET Framework has none, and
          # Windows PowerShell 5.1 runs on it. If the runner image ever drops the OpenSSH client, install.ps1's
          # refusal branch is what users would hit, and this line is where we would find out first.
          $k = Get-Command ssh-keygen -ErrorAction SilentlyContinue
          if (-not $k) { Write-Host "::warning::ssh-keygen is absent — install.ps1 will refuse, by design" }
          else { Write-Host "ssh-keygen present: $($k.Source)" }
      - name: install smoke + tamper red-check
        env:
          HEROS_RELEASE_PRIVATE_KEY: ${{ secrets.HEROS_RELEASE_PRIVATE_KEY }}
        shell: pwsh
        run: ./scripts/install_smoke.ps1
