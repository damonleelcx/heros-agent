name: CI

# Green-CI gate for P0 (DevOps tasks 4.1, 4.2). Jobs call the SAME `make` targets a developer runs
# locally, so "green locally" == "green in CI" (no drift). No step silent-fails: gofmt, schema
# negative-fixtures, and DB constraints all fail the build loudly when violated.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build · vet · fmt · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The Discovery tree-sitter frontends link the tree-sitter C runtime via cgo; ubuntu-latest ships
      # gcc, so CGO builds out of the box. (CGO_ENABLED=0 builds of the discovery packages will not link.)
      - name: make go (build, vet, gofmt-check, test)
        env:
          CGO_ENABLED: "1"
        run: make go
      - name: go.mod tidy check
        run: make tidy-check
      # 🔴 The reproducibility gate, named as its own REQUIRED step (P20 task 7.6).
      #
      # It already runs inside `make go`, so this looks redundant — and it is not. Reproducibility is the
      # property that lets a third party rebuild a release and confirm the bytes, which is the whole basis of the
      # supply-chain claim; a gate that exists only as one of nine hundred tests is a gate nobody can see pass,
      # and the day it starts skipping (a missing toolchain makes it t.Skip) nothing goes red. Running it by name
      # means the step appears in every check run, and `-count=1` means a cached PASS cannot stand in for a run.
      - name: reproducible-build gate (required)
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          out="$(go test -count=1 -v -run 'TestReproducibleBuild' ./internal/release/ 2>&1)"
          printf '%s\n' "$out"
          # A skip is not a pass. If the toolchain is missing the test skips silently, and a required gate that
          # can silently skip is the "env-gated tripwire" this project has been burned by before.
          if printf '%s' "$out" | grep -q '^--- SKIP'; then
            echo "::error::TestReproducibleBuild SKIPPED — a required gate must run, not opt out"
            exit 1
          fi
          printf '%s' "$out" | grep -q '^--- PASS: TestReproducibleBuild' \
            || { echo "::error::TestReproducibleBuild did not report PASS"; exit 1; }

  # P19 deploy gates. Its own job — cheap, no toolchain — so a manifest change that breaks digest
  # pinning, image-set parity, or leaks a plaintext Secret fails the build the same way a Go break does.
  # kustomize renders the overlays so the digest check reads what actually APPLIES, not the raw base.
  deploy-lint:
    name: deploy · digest pins · image parity · no plaintext secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.4.3
      - name: make deploy-lint
        run: PATH="$(go env GOPATH)/bin:$PATH" make deploy-lint

  # The seven language gates, proved against real compilers (ADR-003). Its own job because it is the
  # only one that needs a JDK, Kotlin, Rust, Node, TypeScript and mypy — `make go` must stay cheap and
  # must not start depending on them silently. With any of them missing these FAIL rather than skip.
  verifiers:
    name: language gates · live toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the type checkers and the Kotlin compiler
        run: |
          pip install --quiet mypy
          npm install -g typescript
          # ubuntu-latest ships Rust (cargo) and, via setup-java, a real JDK. Kotlin it does not.
          curl -sSLo /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: make verifier-proof
        env:
          CGO_ENABLED: "1"
        run: make verifier-proof

  # The operator console's own gates. Its own job — cheap, no Go toolchain — so operator-oversight
  # drift, a design-language literal or a payload overage fails the build the same way a Go break does.
  #
  # 🔴 `scan:ledger` is named as its own step as well as running inside `npm run build`, for the same
  # reason the reproducible-build gate is: a gate that exists only inside a composite command is a gate
  # nobody can see pass, and the day it stops running nothing goes red. The whole point of this fence is
  # that fourteen phases of operator-console drift happened with nothing failing.
  operator-console:
    name: operator console · surface ledger · tokens · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin-console
    steps:
      - uses: actions/checkout@v4
      # 🔴 24, not 20, and the reason is a hard requirement rather than a preference.
      #
      # Both consoles' middleware constructs its Content-Security-Policy from ONE checked-in TypeScript
      # artefact (web/design-system/third-party-policy.ts), and the tests import that artefact directly
      # so they assert against the shipped policy rather than a copy of it. Node cannot load a `.ts`
      # file without type stripping, which arrived in 22.6 behind a flag and is on by default from
      # 22.18 — on 20 the suite dies with ERR_UNKNOWN_FILE_EXTENSION before a single assertion runs.
      #
      # The alternative was to make the artefact `.mjs` with types in a separate declaration file. That
      # trades a type-checked security artefact — the thing that stops an origin being added with the
      # wrong directive or the wrong consent category — for compatibility with a runtime GitHub is
      # deprecating on its own runners. `engines` in package.json states the floor so a developer on 20
      # gets a sentence from npm rather than a stack trace about a file extension.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/admin-console/package-lock.json
      - run: npm ci
      - name: operator-surface ledger fence (required)
        run: npm run scan:ledger
      - name: design-language fence
        run: npm run scan:tokens
      - run: npm run typecheck
      # 🔴 The suite now needs a BUILD, and this step is why the job grew one.
      #
      # Every assertion in this suite used to be about source shape, which needs no build. P24 added the
      # first ones that read a real response header — a Content-Security-Policy is assembled in
      # middleware, per request, on the edge runtime, and the failure it guards against is precisely a
      # header that says something different from what the file appears to say. Those tests start
      # `next start`, which needs `next build`.
      #
      # The alternative was to let them skip when `.next` is absent. That is the silent-skip failure this
      # whole phase argues against: a fence that does not run in CI is a fence nobody knows is connected,
      # and it would have skipped here forever while reporting green.
      #
      # It also closes a gap that predates P24 — `scan:bundle` (the payload ceiling, the credential scan
      # and now the analytics/replay reachability rule) has never run in this job at all, because it only
      # exists inside `npm run build`.
      - name: build (runs scan:origins, scan:events, scan:bundle — and produces the .next the live tests need)
        run: npm run build
      - run: npm test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          # 🔴 The analysis cache is skipped deliberately, and the reason is that it changes the ANSWER.
          #
          # staticcheck's SA5011 (nil dereference) needs a cross-package fact — that `t.Fatal` does not
          # return — and that fact is not part of what the restored cache carries. When a package's
          # diagnostics come back from cache without it, every `if x == nil { t.Fatal(…) }` in the repo
          # reports as a possible nil dereference. On 2026-07-29 that produced 34 such issues in test
          # files nobody had touched, in packages the branch never went near, while the same commit had
          # linted clean 20 minutes earlier and a cold local run of the identical v2.12.2 binary reported
          # 0 issues — and re-running the untouched earlier commit reproduced the failure, which is what
          # ruled the source out.
          #
          # A lint that answers differently depending on what a cache happened to hold is not a gate: it
          # fails clean branches and would pass dirty ones just as easily. ~1 minute per run buys an
          # answer that matches what `golangci-lint run ./...` gives a developer on their own machine.
          skip-cache: true

  schema:
    name: schema-validation + contract proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install validators
        run: pip install --quiet jsonschema
      # Fails the build if a valid sample is rejected OR a negative fixture (missing tag /
      # missing io_contract) is accepted (task 4.2).
      - name: make schema
        run: make schema

  discovery:
    name: discovery IR schema-validation + golden drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install validators
        run: pip install --quiet jsonschema
      # Runs the BUILT discover CLI on EVERY fixture repo — Go, Python, TypeScript, Rust, Java, Kotlin —
      # and fails the build on any schema violation, node-count regression, or golden-IR drift
      # (tasks 8.1, 8.2). The fixture list is discovered from testdata/fixtures/expected.json, so a new
      # language's fixtures are covered here the moment they are registered; there is no per-language
      # list in this file to forget to update. cgo for tree-sitter.
      - name: make discovery-ci
        env:
          CGO_ENABLED: "1"
        run: make discovery-ci
      # Soft throughput signal (task 8.3) — informs, never blocks (throughput is runner-sensitive).
      - name: make discovery-throughput (soft)
        run: make discovery-throughput
        continue-on-error: true

  db-proof:
    name: postgres constraints + slices + P2 stores
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Ephemeral throwaway DB for the duration of the job. Passwordless (trust) auth so there is no
        # credential literal to leak — mirrors the local proof harness (initdb --auth=trust).
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install driver
        run: pip install --quiet "psycopg[binary]"
      # Apply the migration and prove NOT NULL / PK / FK / CHECK / idempotency fire, then that every
      # P4/P4.5 slice is answerable — against a real Postgres (tasks 2.1, 3.1).
      - name: constraint proofs
        run: python3 db/migrations/postgres/prove_constraints.py
      - name: slice proofs
        run: python3 db/migrations/postgres/prove_slices.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Apply the migration chain and prove the store invariants on a live server: content-addressed
      # registry versions and their immutability guards (1.1/1.6/1.7), the Variant Spec's lineage
      # round-trip (2.1), the transform record (3.9), and P4's eval data path — tag completeness,
      # redelivery collapsing on the natural key, and migration 0009's rollback and re-apply.
      #
      # This list is maintained BY HAND and does not read the pg-proof make target, so a new pgproof
      # package must be added here as well or its migration ships untested in CI.
      #
      # The `pgproof` tag — not an env-var skip — is what gates these. `make go` does not compile
      # them, and here they cannot silently opt out: with no reachable database the suite FAILS.
      # Each package binds its own schema (internal/pgtest) so they do not race on this one server.
      - name: P2 store proofs (live Postgres)
        env:
          HEROS_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags pgproof -count=1 ./internal/pgmigrate/ ./internal/launch/ ./internal/billing/ ./internal/registry/ ./internal/variantspec/ ./internal/worktree/ ./internal/executor/ ./internal/runqueue/ ./internal/e2e/ ./internal/evalrun/ ./internal/adminops/

  discovery-sandbox:
    name: discovery worker least-privilege runtime (task 7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Proves deploy/docker-compose.discovery.yml really enforces the three NFR7 claims: read-only
      # repo mount, no network egress, no ambient provider creds. internal/discovery/noexec_test.go
      # proves only the code half — `discover` parses untrusted source with tree-sitter C via cgo, and
      # no Go import guard can constrain what that C does on a hostile input. This job is the runtime
      # half. Weakening a line in the compose spec turns it red.
      #
      # Deliberately NOT part of `make ci`: it needs Docker, matching how db-proof/pg-proof are their
      # own jobs rather than local-gate targets. ubuntu-latest ships Docker + compose v2.
      - name: make discovery-sandbox-proof
        run: make discovery-sandbox-proof
      # Guards the guard: asserts the proof above can actually FAIL, by weakening the spec one
      # guarantee at a time and requiring a red result attributed to that specific claim. Without
      # this, a proof with an inverted assertion would print PASS forever.
      - name: make discovery-sandbox-proof-redcheck
        run: make discovery-sandbox-proof-redcheck

  sandbox:
    name: P3 isolate least-privilege runtime (sandbox spec §3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Proves deploy/docker-compose.sandbox.yml really enforces the OS-level controls internal/sandbox
      # reports as UNAVAILABLE on a bare host: default-deny network egress (metadata endpoint
      # unreachable), a read-only working-set-scoped filesystem, no ambient provider creds, and cgroup
      # resource bounds. This is the deploy-time half that sandbox.NewContainedEnforcer relies on;
      # untrusted repo tool code must not handle a real target repo until this job is green. Weakening a
      # line in the compose spec turns it red.
      #
      # Deliberately NOT part of `make ci`: it needs Docker, matching how db-proof/pg-proof and the
      # discovery-sandbox job are their own jobs rather than local-gate targets.
      - name: make sandbox-proof
        run: make sandbox-proof
      # Guards the guard: asserts the proof above can actually FAIL, one weakened guarantee at a time.
      - name: make sandbox-proof-redcheck
        run: make sandbox-proof-redcheck

  secret-scan:
    name: gitleaks (no secrets in repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
