name: CI

# Green-CI gate for P0 (DevOps tasks 4.1, 4.2). Jobs call the SAME `make` targets a developer runs
# locally, so "green locally" == "green in CI" (no drift). No step silent-fails: gofmt, schema
# negative-fixtures, and DB constraints all fail the build loudly when violated.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build · vet · fmt · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The Discovery tree-sitter frontends link the tree-sitter C runtime via cgo; ubuntu-latest ships
      # gcc, so CGO builds out of the box. (CGO_ENABLED=0 builds of the discovery packages will not link.)
      - name: make go (build, vet, gofmt-check, test)
        env:
          CGO_ENABLED: "1"
        run: make go
      - name: go.mod tidy check
        run: make tidy-check

  # The seven language gates, proved against real compilers (ADR-003). Its own job because it is the
  # only one that needs a JDK, Kotlin, Rust, Node, TypeScript and mypy — `make go` must stay cheap and
  # must not start depending on them silently. With any of them missing these FAIL rather than skip.
  verifiers:
    name: language gates · live toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the type checkers and the Kotlin compiler
        run: |
          pip install --quiet mypy
          npm install -g typescript
          # ubuntu-latest ships Rust (cargo) and, via setup-java, a real JDK. Kotlin it does not.
          curl -sSLo /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: make verifier-proof
        env:
          CGO_ENABLED: "1"
        run: make verifier-proof

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  schema:
    name: schema-validation + contract proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install validators
        run: pip install --quiet jsonschema
      # Fails the build if a valid sample is rejected OR a negative fixture (missing tag /
      # missing io_contract) is accepted (task 4.2).
      - name: make schema
        run: make schema

  discovery:
    name: discovery IR schema-validation + golden drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install validators
        run: pip install --quiet jsonschema
      # Runs the BUILT discover CLI on EVERY fixture repo — Go, Python, TypeScript, Rust, Java, Kotlin —
      # and fails the build on any schema violation, node-count regression, or golden-IR drift
      # (tasks 8.1, 8.2). The fixture list is discovered from testdata/fixtures/expected.json, so a new
      # language's fixtures are covered here the moment they are registered; there is no per-language
      # list in this file to forget to update. cgo for tree-sitter.
      - name: make discovery-ci
        env:
          CGO_ENABLED: "1"
        run: make discovery-ci
      # Soft throughput signal (task 8.3) — informs, never blocks (throughput is runner-sensitive).
      - name: make discovery-throughput (soft)
        run: make discovery-throughput
        continue-on-error: true

  db-proof:
    name: postgres constraints + slices + P2 stores
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Ephemeral throwaway DB for the duration of the job. Passwordless (trust) auth so there is no
        # credential literal to leak — mirrors the local proof harness (initdb --auth=trust).
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install driver
        run: pip install --quiet "psycopg[binary]"
      # Apply the migration and prove NOT NULL / PK / FK / CHECK / idempotency fire, then that every
      # P4/P4.5 slice is answerable — against a real Postgres (tasks 2.1, 3.1).
      - name: constraint proofs
        run: python3 db/migrations/postgres/prove_constraints.py
      - name: slice proofs
        run: python3 db/migrations/postgres/prove_slices.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Apply the migration chain and prove the store invariants on a live server: content-addressed
      # registry versions and their immutability guards (1.1/1.6/1.7), the Variant Spec's lineage
      # round-trip (2.1), the transform record (3.9), and P4's eval data path — tag completeness,
      # redelivery collapsing on the natural key, and migration 0009's rollback and re-apply.
      #
      # This list is maintained BY HAND and does not read the pg-proof make target, so a new pgproof
      # package must be added here as well or its migration ships untested in CI.
      #
      # The `pgproof` tag — not an env-var skip — is what gates these. `make go` does not compile
      # them, and here they cannot silently opt out: with no reachable database the suite FAILS.
      # Each package binds its own schema (internal/pgtest) so they do not race on this one server.
      - name: P2 store proofs (live Postgres)
        env:
          HEROS_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags pgproof -count=1 ./internal/registry/ ./internal/variantspec/ ./internal/worktree/ ./internal/executor/ ./internal/runqueue/ ./internal/e2e/ ./internal/evalrun/

  discovery-sandbox:
    name: discovery worker least-privilege runtime (task 7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Proves deploy/docker-compose.discovery.yml really enforces the three NFR7 claims: read-only
      # repo mount, no network egress, no ambient provider creds. internal/discovery/noexec_test.go
      # proves only the code half — `discover` parses untrusted source with tree-sitter C via cgo, and
      # no Go import guard can constrain what that C does on a hostile input. This job is the runtime
      # half. Weakening a line in the compose spec turns it red.
      #
      # Deliberately NOT part of `make ci`: it needs Docker, matching how db-proof/pg-proof are their
      # own jobs rather than local-gate targets. ubuntu-latest ships Docker + compose v2.
      - name: make discovery-sandbox-proof
        run: make discovery-sandbox-proof
      # Guards the guard: asserts the proof above can actually FAIL, by weakening the spec one
      # guarantee at a time and requiring a red result attributed to that specific claim. Without
      # this, a proof with an inverted assertion would print PASS forever.
      - name: make discovery-sandbox-proof-redcheck
        run: make discovery-sandbox-proof-redcheck

  sandbox:
    name: P3 isolate least-privilege runtime (sandbox spec §3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Proves deploy/docker-compose.sandbox.yml really enforces the OS-level controls internal/sandbox
      # reports as UNAVAILABLE on a bare host: default-deny network egress (metadata endpoint
      # unreachable), a read-only working-set-scoped filesystem, no ambient provider creds, and cgroup
      # resource bounds. This is the deploy-time half that sandbox.NewContainedEnforcer relies on;
      # untrusted repo tool code must not handle a real target repo until this job is green. Weakening a
      # line in the compose spec turns it red.
      #
      # Deliberately NOT part of `make ci`: it needs Docker, matching how db-proof/pg-proof and the
      # discovery-sandbox job are their own jobs rather than local-gate targets.
      - name: make sandbox-proof
        run: make sandbox-proof
      # Guards the guard: asserts the proof above can actually FAIL, one weakened guarantee at a time.
      - name: make sandbox-proof-redcheck
        run: make sandbox-proof-redcheck

  secret-scan:
    name: gitleaks (no secrets in repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
