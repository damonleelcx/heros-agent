name: Release

# The P20 release pipeline: push a tag → a published Release, with no human in the upload path.
#
# The three DevOps rules this file exists to satisfy (skill §0):
#   1. no temporary fix — if the pipeline fails, the release failed; nothing is repaired by hand;
#   2. nobody uploads a file to a Release by hand;
#   3. nothing is copied or patched manually — every artifact comes from a repeatable, retryable script.
#
# # Why so little logic lives here
#
# Every rule worth enforcing — the version comes from the tag, the matrix is complete, the manifest is
# signed, a re-run reproduces the same bytes — has a failure mode that is a bad release. YAML can express
# those checks but cannot let anyone RUN them without pushing a `v*` tag, so each debugging attempt would
# be a public Release. The rules therefore live in `cmd/herosdist` (tested in `internal/distribution`), and
# this file is wiring. `make release-rehearse` runs the whole spine locally against a fake tag.
#
# # Job graph
#
#   plan ──▶ build (5 native runners, D1) ──▶ merge (recompute · cross-check · sign · attest · gate)
#                                                        │
#                                                        └──▶ publish (idempotent; draft iff prerelease)
#
# `plan` parses the tag exactly once. Every other job reads its version from plan's outputs, so there is no
# second interpretation of what is being released.

on:
  push:
    tags: ["v*"]
  # Rehearsal and re-run entry point (tasks 2.6, 2.7). It takes a tag rather than defaulting to the branch,
  # because a "release" whose version came from a branch name is the drift this pipeline is built to refuse.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)run, e.g. v0.20.0-rc.1. Must already exist."
        required: true
        type: string

# contents: write publishes the Release and uploads its assets — that write is what replaces the human.
# packages: write is for the container image (task 3.6).
permissions:
  contents: write
  packages: write

# A release is never cancelled mid-flight. cancel-in-progress would let a second push abort a run between
# "assets uploaded" and "release published", which is the one state a re-run cannot reason about.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # CGO is not optional: the CLI links tree-sitter language frontends. A CGO_ENABLED=0 build does not link.
  CGO_ENABLED: "1"

jobs:
  # ── plan ────────────────────────────────────────────────────────────────────────────────────────────
  # The single parse of the tag. It fails the whole release on a tag that is not a release tag, before any
  # runner has spent a minute building something that could not have been published.
  plan:
    name: plan · the one version every artifact derives from
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      draft: ${{ steps.plan.outputs.draft }}
      latest: ${{ steps.plan.outputs.latest }}
      ldflags: ${{ steps.plan.outputs.ldflags }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: plan
        name: resolve the tag
        run: |
          set -euo pipefail
          go run ./cmd/herosdist plan \
            --tag "${{ inputs.tag }}" --ref "${{ github.ref }}" | tee -a "$GITHUB_OUTPUT"
      - name: state the plan
        run: |
          echo "### Release plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/herosdist plan --tag "${{ inputs.tag }}" --ref "${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── build ───────────────────────────────────────────────────────────────────────────────────────────
  # One job per shipped target, each on a runner whose own OS and arch MATCH the target (D1). There is no
  # cross-CGO row: a cross-compiled CGO binary needs a cross C toolchain whose output is a different, less
  # tested artifact than the native build, and the failure lands on a user's repo rather than in CI.
  #
  # 🔴 This matrix must equal internal/distribution.Shipped(). It is not generated — GitHub needs the
  # runner labels statically — so TestReleaseWorkflowMatchesTargetContract reads this file and fails the
  # build on any divergence. That test is the reason two copies are tolerable.
  build:
    name: build · ${{ matrix.goos }}/${{ matrix.goarch }} on ${{ matrix.runner }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      # One broken target must not hide the state of the others: a release is all-or-nothing, and knowing
      # which four passed is what tells an operator whether the cause is the target or the pipeline.
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64, runner: macos-13 }
          - { goos: darwin, goarch: arm64, runner: macos-14 }
          - { goos: linux, goarch: amd64, runner: ubuntu-22.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-22.04-arm }
          - { goos: windows, goarch: amd64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Refuse before building, not after. A runner whose host arch differs from the target arch would
      # produce a cross-CGO artifact that passes every later check and breaks on a user's machine — so the
      # invariant D1 rests on is asserted on the runner itself, where the truth is observable.
      - name: assert this runner is native for the target
        shell: bash
        run: |
          set -euo pipefail
          host_os="$(go env GOOS)"; host_arch="$(go env GOARCH)"
          if [ "$host_os" != "${{ matrix.goos }}" ] || [ "$host_arch" != "${{ matrix.goarch }}" ]; then
            echo "::error::runner ${{ matrix.runner }} is ${host_os}/${host_arch} but this row targets"\
                 "${{ matrix.goos }}/${{ matrix.goarch }} — that is a cross-CGO build, which D1 refuses"
            exit 1
          fi
          echo "native build confirmed: ${host_os}/${host_arch}"

      # The reproducibility gate, run where the bytes are produced (task 2.5). It builds the CLI twice and
      # compares. Reproducibility is a PER-PLATFORM property, so asserting it once on Linux would say
      # nothing about the macOS or Windows artifact — it runs on every row.
      - name: reproducibility gate (TestReproducibleBuild)
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run 'TestReproducibleBuild' ./internal/release/
          mkdir -p dist
          # The marker is written ONLY after the test passes, and the merge job requires one per shipped
          # target. A boolean passed through YAML could be set by a step that never ran; a file cannot.
          echo "reproducible on ${{ matrix.runner }}" > "dist/REPRODUCIBLE-${{ matrix.goos }}-${{ matrix.goarch }}"

      # The one script that knows how to build this binary — the same one a developer runs locally. The
      # ldflags come from `plan`, so the version stamped into the binary and the version in every manifest
      # have one source (task 2.4).
      - name: build (scripts/release-cli.sh)
        shell: bash
        env:
          HEROS_LDFLAGS: ${{ needs.plan.outputs.ldflags }}
        run: bash scripts/release-cli.sh "${{ needs.plan.outputs.version }}"

      # ── OS code signing (D3 option A, ratified 2026-07-29) ─────────────────────────────────────────────
      #
      # It happens HERE, in the build job, and not later: `codesign` and `signtool` MUTATE the binary, so a
      # signature applied after the per-runner SHA256SUMS was computed would invalidate every checksum
      # downstream. Sign, then hash.
      #
      # 🔴 Reproducibility caveat, stated because it is real: a code signature embeds a trusted timestamp, so a
      # SIGNED artifact is not byte-reproducible. `TestReproducibleBuild` builds and compares the UNSIGNED
      # binary, which is the honest scope of the claim — the release notes say "reproducible up to the OS code
      # signature" rather than implying the published bytes rebuild exactly.
      #
      # Both steps are gated on their secrets existing. That is not laxness: the posture decision is funded but
      # the identities are not yet provisioned, and a pipeline that failed every release until a certificate was
      # purchased would turn a UX upgrade into a release blocker. What must NOT happen is a release CLAIMING a
      # signature it did not apply — which is why the attestation flags below come from these steps' own
      # outputs, never from a constant.
      - id: macsign
        name: macOS · Developer ID sign + notarize
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          bin="dist/heros-${{ needs.plan.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "signed=false"    >> "$GITHUB_OUTPUT"
          echo "notarized=false" >> "$GITHUB_OUTPUT"
          echo "stapled=false"   >> "$GITHUB_OUTPUT"
          if [ -z "${APPLE_CERT_P12:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::notice::no Apple signing identity configured — this release will be attested as NOT"\
                 "code-signed and NOT notarized, and every surface will say so. D3 option (A) is ratified;"\
                 "provision APPLE_CERT_P12 / APPLE_SIGNING_IDENTITY / APPLE_API_KEY_P8 to deliver it."
            exit 0
          fi

          # A throwaway keychain, deleted on exit. Importing into the login keychain would leave the release
          # certificate on a runner image nobody audits.
          kc="$RUNNER_TEMP/heros-release.keychain-db"
          kcpass="$(openssl rand -hex 24)"
          trap 'security delete-keychain "$kc" || true' EXIT
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          # --options runtime enables the hardened runtime, which notarization REQUIRES. --timestamp requests a
          # trusted timestamp so the signature outlives the certificate's expiry.
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          echo "signed=true" >> "$GITHUB_OUTPUT"

          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "::notice::signed but NOT notarized — no notary API key configured. The attestation will say so."
            exit 0
          fi
          # Notarization takes a container, not a bare executable. The zip is a transport for the notary
          # service; what ships is still the signed binary.
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"
          echo "notarized=true" >> "$GITHUB_OUTPUT"
          # 🔴 Not stapled, and that is not an omission: `stapler` can only attach a ticket to a .app, .dmg or
          # .pkg. A bare executable cannot carry one, so Gatekeeper confirms the notarization with an online
          # check on first run. The attestation records stapled=false and the notes say what that means for a
          # disconnected machine.
          echo "::notice::notarized; the ticket is NOT stapled because a bare executable cannot carry one"

      - id: winsign
        name: Windows · Authenticode sign
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $env:WINDOWS_CERT_PFX) {
            Write-Host "::notice::no Windows signing certificate configured — this release will be attested as NOT Authenticode-signed, and every surface will say so. Provision WINDOWS_CERT_PFX to deliver D3 option (A) on Windows."
            exit 0
          }
          $bin = "dist/heros-${{ needs.plan.outputs.version }}-windows-amd64.exe"
          $pfx = Join-Path $env:RUNNER_TEMP 'heros-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          try {
            # An RFC-3161 timestamp, so the signature stays valid after the certificate expires. Authenticode
            # also carries the publisher, which is how task 4.2's publisher metadata reaches the bare .exe.
            & signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "heros CLI" /du "https://github.com/damonleelcx/heros-agent" $bin
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
            & signtool verify /pa /v $bin
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      # The signing outcome travels with the bundle as a file, for the same reason the reproducibility marker
      # does: a workflow output can be produced by a step that was skipped, while a file can only exist because
      # a step wrote it. The merge job reads these to build the attestation.
      - name: record what the signing steps actually did
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.goos }}" in
            darwin)
              printf 'signed=%s\nnotarized=%s\nstapled=%s\n' \
                "${{ steps.macsign.outputs.signed }}" \
                "${{ steps.macsign.outputs.notarized }}" \
                "${{ steps.macsign.outputs.stapled }}" > "dist/OSTRUST-darwin" ;;
            windows)
              printf 'signed=%s\n' "${{ steps.winsign.outputs.signed }}" > "dist/OSTRUST-windows" ;;
          esac

      # Prove the stamp landed. A misspelled symbol path in `-X` is silently ignored by the Go linker: the
      # build succeeds and the binary reports its hard-coded dev version. Without this step that mistake
      # ships, and the first person to notice is a user filing a bug against a version never released.
      # The assertion reads the MACHINE-READABLE `tool_version` on stdout, not the narration on stderr.
      # That field is what gets stamped into linked run metadata, so it is the copy of the version a
      # customer's bug report is filed against.
      - name: assert the binary reports the tag's version
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="dist/heros-${{ needs.plan.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          got="$("$bin" version 2>/dev/null)"
          if ! printf '%s' "$got" | grep -qF '"tool_version": "${{ needs.plan.outputs.version }}"'; then
            echo "::error::binary does not report tool_version=${{ needs.plan.outputs.version }} — the ldflags stamp did not land"
            printf '%s\n' "$got"; exit 1
          fi
          echo "tool_version=${{ needs.plan.outputs.version }}"
      - name: assert the binary reports the tag's version (windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $bin = "dist/heros-${{ needs.plan.outputs.version }}-windows-amd64.exe"
          $got = (& $bin version 2>$null | Out-String)
          if ($got -notmatch '"tool_version": "${{ needs.plan.outputs.version }}"') {
            Write-Host "::error::binary does not report tool_version=${{ needs.plan.outputs.version }} — the ldflags stamp did not land"
            Write-Host $got
            exit 1
          }
          Write-Host "tool_version=${{ needs.plan.outputs.version }}"

      # The bundle carries the binary, this runner's own SHA256SUMS, and the reproducibility marker. The
      # per-runner manifest is what the merge job cross-checks against — see internal/distribution/merge.go
      # for why the merge recomputes rather than concatenating.
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── merge ───────────────────────────────────────────────────────────────────────────────────────────
  # Collect every runner's bundle, recompute and cross-check the checksums, produce ONE sorted SHA256SUMS,
  # sign it once, record what the release actually delivered, and run the fail-closed gate.
  merge:
    name: merge · one signed manifest, then the gate
    needs: [plan, build]
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*

      # The install scripts join the signed manifest (task 3.7). The documented install is `curl … | sh`, and a
      # user who wants to audit what they piped has nothing to check it against unless the script is covered by
      # the same signature as the binaries.
      - name: merge into one sorted manifest
        run: |
          go run ./cmd/herosdist merge --in artifacts --out dist \
            --include scripts/install.sh,scripts/install.ps1

      # 🔴 The signing key exists ONLY as a CI secret, and only this step reads it. `${VAR:?}` makes a
      # missing key a refuse-to-start rather than an unsigned release: on every channel but dev, an
      # unsigned manifest is a gate failure, and failing here — before anything is published — is the
      # cheaper place to discover it.
      #
      # The signature is captured through a command substitution rather than a `>` redirect, because a
      # redirect creates the .sig file BEFORE the signer runs: a failed signing would leave a zero-byte
      # signature that later steps see as "a signature is present".
      - name: sign the manifest (ed25519, key from a CI secret)
        env:
          HEROS_RELEASE_PRIVATE_KEY: ${{ secrets.HEROS_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${HEROS_RELEASE_PRIVATE_KEY:?the release signing key is not configured — refusing to produce an unsigned release}"
          sig="$(go run ./cmd/herossign sign --in dist/SHA256SUMS)"
          printf '%s\n' "$sig" > dist/SHA256SUMS.sig
          # The SAME signature, second encoding: OpenSSH sshsig. install.sh verifies with `ssh-keygen -Y
          # verify` because stock macOS ships LibreSSL, which cannot verify ed25519 at all — and an installer
          # that skipped the signature there would be trading 安全 for UX. allowed_signers is published for
          # the documented manual path; the installer pins its own copy, since a downloaded key proves nothing.
          sshsig="$(go run ./cmd/herossign sign --ssh --in dist/SHA256SUMS)"
          printf '%s' "$sshsig" > dist/SHA256SUMS.sshsig
          go run ./cmd/herossign signers > dist/allowed_signers
          echo "signed dist/SHA256SUMS (raw + sshsig)"

      # What the release DELIVERED, as opposed to what the posture intends (D3). The OS-signing flags are
      # passed by the steps that actually ran the signing; with none configured, the attestation honestly
      # records an unsigned-by-the-OS release and every surface renders that.
      # The OS-trust flags come from the markers the signing steps wrote — never from the ratified posture.
      # That separation is the whole of task 4.3: `ChosenPosture` says what we intend to deliver, and
      # `trust.json` says what this release actually did, and only the second one reaches a user's screen.
      - name: attest (trust.json)
        run: |
          set -euo pipefail
          flags=()
          mac="$(find artifacts -name OSTRUST-darwin | head -n1)"
          win="$(find artifacts -name OSTRUST-windows | head -n1)"
          if [ -n "$mac" ]; then
            grep -q '^signed=true'    "$mac" && flags+=(--macos-signed)
            grep -q '^notarized=true' "$mac" && flags+=(--macos-notarized)
            grep -q '^signed=true'    "$mac" && flags+=(--macos-publisher "${{ vars.RELEASE_PUBLISHER || 'Heros Foreal' }}")
            grep -q '^signed=true'    "$mac" && flags+=(--macos-team-id "${{ secrets.APPLE_TEAM_ID }}")
          fi
          if [ -n "$win" ] && grep -q '^signed=true' "$win"; then
            flags+=(--windows-signed --windows-publisher "${{ vars.RELEASE_PUBLISHER || 'Heros Foreal' }}")
          fi
          go run ./cmd/herosdist attest \
            --tag "${{ needs.plan.outputs.tag }}" --dir dist "${flags[@]+"${flags[@]}"}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The fail-closed gate (task 2.5): incomplete matrix, unsigned manifest on a non-dev channel, or a
      # missing per-target reproducibility marker. Nothing has been published at this point, and nothing
      # will be if this step is red.
      # D5: every channel manifest is GENERATED from the signed manifest — version from the tag, URLs from the
      # Release, checksums copied out of the document the release key just signed. A hand-maintained formula
      # holds a second copy of the version and drifts to the previous release the first time a tag moves.
      - name: generate every channel manifest
        run: |
          set -euo pipefail
          # No --only: a release generates EVERY channel and therefore requires EVERY shipped target. A Release
          # publishing a formula that points at four platforms while its manifest lists three is broken in a way
          # only the fourth platform's users discover.
          go run ./cmd/herosdist manifests \
            --tag "${{ needs.plan.outputs.tag }}" --dir dist --out dist/packaging | tee -a "$GITHUB_STEP_SUMMARY"

      # .deb / .rpm from the generated nfpm configs. nfpm is pinned by version: an unpinned `@latest` in a
      # release pipeline means the packaging tool can change between a rehearsal and the GA run.
      - name: build .deb and .rpm (nfpm)
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          for arch in amd64 arm64; do
            for pkg in deb rpm; do
              # nfpm resolves `src:` relative to its own working directory, so it runs where the binaries are.
              ( cd dist && nfpm package --config packaging/nfpm/nfpm-"$arch".yaml --packager "$pkg" --target . )
            done
          done
          ls -1 dist/*.deb dist/*.rpm

      - id: gate
        name: release gate (fail-closed)
        run: |
          set -euo pipefail
          go run ./cmd/herosdist gate \
            --tag "${{ needs.plan.outputs.tag }}" --dir dist \
            --markers artifacts --repo-root . | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── image ───────────────────────────────────────────────────────────────────────────────────────────
  # The container image is the musl/Alpine/CI answer (D6). It COPIES the verified binary rather than rebuilding
  # from source: an image that recompiled would be a second, unsigned artifact wearing the release's version.
  image:
    name: image · ghcr.io (the musl/CI answer)
    needs: [plan, merge]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: build and push, digest-pinned
        run: |
          set -euo pipefail
          cd dist
          tags=""
          IFS=',' read -ra t <<< "${{ needs.plan.outputs.image_tags }}"
          for tag in "${t[@]}"; do tags="$tags -t $tag"; done
          # shellcheck disable=SC2086
          docker build -f packaging/container/Dockerfile $tags .
          for tag in "${t[@]}"; do docker push "$tag"; done
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${t[0]}")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # The image must actually run, and it must report the tag's version. An image that pushes and then
          # fails on `heros version` is a broken artifact the Release page advertises.
          got="$(docker run --rm "${t[0]}" version 2>/dev/null)"
          printf '%s' "$got" | grep -qF '"tool_version": "${{ needs.plan.outputs.version }}"' \
            || { echo "::error::the pushed image does not report tool_version=${{ needs.plan.outputs.version }}"; exit 1; }
          echo "pushed and smoke-tested $digest"

  # ── taps ────────────────────────────────────────────────────────────────────────────────────────────
  # Homebrew, Scoop and winget publication. The manifests are already generated and attached to the Release;
  # this job pushes them to the index a package manager reads — when there is one to push to.
  #
  # 🔴 It is NOT allowed to silently no-op. A skipped publish that logs nothing is how a channel ends up on a
  # README while `brew install` fails for every user. When the target does not exist, the job says so, names the
  # blocker, and the channel contract keeps reporting the channel as undelivered.
  taps:
    name: taps · publish the generated manifests (or say why not)
    needs: [plan, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: push to the Homebrew tap and Scoop bucket, or disclose the blocker
        env:
          TAP_TOKEN: ${{ secrets.HEROS_TAP_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            {
              echo "### Package-manager channels: NOT published"
              echo ""
              echo "The formula and manifests are generated from this release's signed manifest and attached to"
              echo "it, so they are correct — but no index a package manager reads points at them yet."
              echo ""
              # CHANNELS.md is the generated capability map, and it is the one document that already states
              # every blocker. Reprinting the reason here from a second source is how the two come to disagree.
              sed -n '/not yet publishable/,$p' dist/packaging/CHANNELS.md
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice::HEROS_TAP_TOKEN is not configured — the tap/bucket push is skipped and the channel"\
                 "contract continues to report homebrew/scoop as undelivered. This is disclosed, not silent."
            exit 0
          fi
          for target in "homebrew-tap:homebrew/heros.rb:Formula/heros.rb" "scoop-bucket:scoop/heros.json:bucket/heros.json"; do
            repo="${target%%:*}"; rest="${target#*:}"; src="${rest%%:*}"; dst="${rest#*:}"
            rm -rf "/tmp/$repo"
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/heros-foreal/${repo}.git" "/tmp/$repo"
            mkdir -p "$(dirname "/tmp/$repo/$dst")"
            cp "dist/packaging/$src" "/tmp/$repo/$dst"
            git -C "/tmp/$repo" add "$dst"
            git -C "/tmp/$repo" -c user.name=heros-release -c user.email=release@heros-agent.space \
              commit -m "heros ${TAG}: regenerated from the signed release manifest"
            git -C "/tmp/$repo" push
            echo "published $dst to heros-foreal/$repo"
          done

  # ── publish ─────────────────────────────────────────────────────────────────────────────────────────
  # The only job that writes anything a user can see, and the one that replaces the human in the upload
  # path (task 2.3). It is idempotent (task 2.6): re-running the same tag converges on the same Release
  # instead of erroring or duplicating, and it FAILS if the re-run's bytes differ from what was published.
  publish:
    name: publish · non-draft on GA, draft on a rehearsal
    needs: [plan, merge, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # Reproducibility ACROSS RE-RUNS, which is a different property from the per-runner build test: it
      # asserts that re-running a tag produces the same signed document. If it does not, one of the two
      # runs' artifacts is not what the tag describes, and the release is stopped rather than clobbered.
      - name: if the release exists, the re-run must reproduce it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no existing Release for $TAG — this is the first run"
            exit 0
          fi
          mkdir -p published
          if ! gh release download "$TAG" --pattern SHA256SUMS --dir published --clobber 2>/dev/null; then
            echo "existing Release has no manifest yet (an interrupted run) — continuing"
            exit 0
          fi
          if ! diff -u published/SHA256SUMS dist/SHA256SUMS; then
            echo "::error::re-running $TAG produced different bytes than the published Release."\
                 "One of the two builds is not what the tag describes; refusing to clobber the published"\
                 "manifest. Investigate before re-running."
            exit 1
          fi
          echo "re-run reproduced the published manifest exactly"

      # create-or-edit, then upload with --clobber: a re-run of a partially-uploaded release completes it
      # with no manual cleanup, which is the whole of task 2.6.
      - name: publish the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          DRAFT: ${{ needs.plan.outputs.draft }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          # The digest, not just the tag: a reader who wants to pin exactly what was audited needs the digest,
          # and a tag can be moved. The image job asserted the pushed image runs and reports this version, so
          # this line is a fact rather than an intention.
          go run ./cmd/herosdist notes --dir dist \
            --image-tags "${{ needs.plan.outputs.image_tags }},${{ needs.image.outputs.digest }}" > dist/RELEASE_NOTES.md
          flags=(--title "heros $TAG" --notes-file dist/RELEASE_NOTES.md)
          [ "$DRAFT" = "true" ] && flags+=(--draft --prerelease)
          [ "$LATEST" = "true" ] && flags+=(--latest)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" "${flags[@]}"
          fi
          # Everything in dist/ except the notes and the internal reproducibility markers.
          # The generated channel manifests ship as one archive: they are a directory tree (winget needs three
          # files under a versioned path), and a Release asset cannot be a directory.
          ( cd dist && tar czf heros-packaging-${{ needs.plan.outputs.version }}.tar.gz packaging )
          assets=()
          for f in dist/*; do
            [ -d "$f" ] && continue
            case "$(basename "$f")" in
              RELEASE_NOTES.md|REPRODUCIBLE-*) continue ;;
            esac
            assets+=("$f")
          done
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "published $TAG with ${#assets[@]} assets · draft=$DRAFT latest=$LATEST"

      # The end-to-end proof that what was published verifies (task 2.3's real assertion): download the
      # PUBLISHED assets into a clean directory and run the documented customer verification against them.
      # Everything before this step verified bytes the pipeline was holding; this one verifies the bytes a
      # user would get.
      - name: verify the PUBLISHED assets the way a customer does
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          gh release download "$TAG" --dir verify --clobber
          ( cd verify && sha256sum -c SHA256SUMS )
          go run ./cmd/herossign verify \
            --pub "$(cat docs/release/heros-release.pub)" \
            --in verify/SHA256SUMS --sig verify/SHA256SUMS.sig
          echo "the published release verifies with the documented offline steps"

      - name: state what shipped
        run: |
          {
            echo "### Published"
            echo ""
            echo "\`${{ needs.plan.outputs.tag }}\` · channel \`${{ needs.plan.outputs.channel }}\` · draft=\`${{ needs.plan.outputs.draft }}\`"
            echo ""
            echo "Zero manual upload steps: every asset above was placed by this job."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── smoke ───────────────────────────────────────────────────────────────────────────────────────────
  # The gate task 9.1 asks for: on a FRESH runner per OS, install from the REAL published Release through the
  # real channel command, and assert through to a first `discover` + `eval` that produces numbers.
  #
  # # Why it runs after publish rather than against the build artifacts
  #
  # Because everything before this verified bytes the pipeline was holding. This verifies the bytes a user
  # gets: the published asset, over the published URL, through the published installer, on a machine that has
  # never seen heros. Those are different things, and the difference is where a release actually breaks — a
  # missing asset, a wrong content type, a quarantine flag, an installer that works only where it was written.
  #
  # It cannot block the publish (the publish already happened), so a failure here is a signal to YANK. That is
  # stated rather than implied: the job's failure message says so.
  smoke:
    name: smoke · ${{ matrix.runner }} · install from the published release
    needs: [plan, publish]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-13, shell: bash }
          - { runner: macos-14, shell: bash }
          - { runner: ubuntu-22.04, shell: bash }
          - { runner: ubuntu-22.04-arm, shell: bash }
          - { runner: windows-2022, shell: pwsh }
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixture repository, for the first real discover + eval. Nothing else from the checkout is used:
          # the binary under test comes from the Release, not from this tree.
          sparse-checkout: |
            internal/discovery/testdata/samplerepo
          sparse-checkout-cone-mode: false

      - name: assert the runner has never seen heros
        shell: bash
        run: |
          set -euo pipefail
          if command -v heros >/dev/null 2>&1; then
            echo "::error::heros is already on PATH — this is not a fresh machine, and a pass here would mean nothing"
            exit 1
          fi
          echo "fresh: $(uname -srm)"

      - name: install from the published release (POSIX)
        if: matrix.shell == 'bash'
        shell: bash
        env:
          HEROS_VERSION: ${{ needs.plan.outputs.version }}
          HEROS_INSTALL_DIR: ${{ runner.temp }}/heros-bin
        run: |
          set -euo pipefail
          mkdir -p "$HEROS_INSTALL_DIR"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.plan.outputs.tag }}/scripts/install.sh" | sh
          echo "$HEROS_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: install from the published release (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          HEROS_VERSION: ${{ needs.plan.outputs.version }}
          HEROS_INSTALL_DIR: ${{ runner.temp }}/heros-bin
        run: |
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.plan.outputs.tag }}/scripts/install.ps1" | iex
          "$env:HEROS_INSTALL_DIR" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 🔴 Asserted to a FIRST REAL EVAL, not to `--help`. An install that produces a runnable `--help` and then
      # dies on the first discover is the shape of every broken packaging job — a missing shared library, a
      # quarantined file, an unwritable path. None of them surface until the tool does real work.
      - name: version · doctor · a first discover and eval that produce numbers
        shell: bash
        run: |
          set -euo pipefail
          got="$(heros version 2>/dev/null)"
          printf '%s' "$got" | grep -qF '"tool_version": "${{ needs.plan.outputs.version }}"' \
            || { echo "::error::the installed binary does not report the released version"; printf '%s\n' "$got"; exit 1; }

          # doctor REPORTS; it is not a gate. What must hold is that every gap it finds names a next action —
          # a runner legitimately lacks toolchains, and demanding ready=true would only pass on a dirty machine.
          heros doctor > doctor.json 2>doctor.txt || true
          cat doctor.txt
          python3 - <<'PY'
          import json
          d = json.load(open("doctor.json"))["data"]
          bad = [c for c in d["checks"] if c["state"] == "action-needed" and not c.get("next_action")]
          assert not bad, f"doctor reported gaps with no next action: {bad}"
          print(f"doctor: {len(d['checks'])} checks, gaps={[c['name'] for c in d['checks'] if c['state']=='action-needed']}")
          PY

          cd internal/discovery/testdata/samplerepo
          heros discover --out ir.json --report report.json > discover.json
          heros eval --seeds 3 --cases 4 > eval.json
          python3 - <<'PY'
          import json
          nodes = json.load(open("discover.json"))["data"]["nodes"]
          assert nodes > 0, "discover found no nodes — the install works but the tool does not"
          scores = json.load(open("eval.json"))["data"]["scores"]
          q = next((s["value"] for s in scores if s["metric"] == "quality"), None)
          assert q is not None, "eval produced no quality figure — exit 0 with no measurement is not a result"
          print(f"first eval on a fresh machine: {nodes} node(s), quality={q}")
          PY

      # The tamper red-check against the PUBLISHED manifest: flip a byte and require `heros verify-release` to
      # refuse. A verify step never observed to reject is treated as absent.
      - name: tamper red-check against the published assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tamper && mkdir tamper && cd tamper
          gh release download "${{ needs.plan.outputs.tag }}" --dir . --clobber
          heros verify-release --manifest SHA256SUMS >/dev/null
          echo "the published release verifies"
          asset="$(awk 'NR==1{print $2}' SHA256SUMS)"
          printf 'x' >> "$asset"
          if heros verify-release --manifest SHA256SUMS --asset "$asset" >/dev/null 2>&1; then
            echo "::error::verify-release ACCEPTED a tampered asset — the verification step is not a gate"
            exit 1
          fi
          echo "verify-release refused a tampered asset, as it must"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: say what a failure here means
        if: failure()
        shell: bash
        run: |
          echo "::error::The release is ALREADY PUBLISHED and this fresh-machine check failed on"\
               "${{ matrix.runner }}. Nothing upstream can undo it: yank the release"\
               "(gh release delete ${{ needs.plan.outputs.tag }} --yes) or publish a fix, and do not"\
               "announce this version."
