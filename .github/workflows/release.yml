# Build static heros binaries and attach them to a GitHub Release when you push a version tag (e.g. v0.1.0).
# Does not implement in-app auto-update; users upgrade by downloading a newer release asset.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION}"

          build_one() {
            local goos="$1" goarch="$2" out="$3"
            echo "==> GOOS=${goos} GOARCH=${goarch} -> ${out}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "${ldflags}" -o "dist/${out}" ./cmd/heros
          }

          build_one linux amd64 heros-${VERSION}-linux-amd64
          build_one linux arm64 heros-${VERSION}-linux-arm64
          build_one windows amd64 heros-${VERSION}-windows-amd64.exe
          build_one windows arm64 heros-${VERSION}-windows-arm64.exe

      - name: Zip Windows artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          zip -9 "heros-${VERSION}-windows-amd64.zip" "heros-${VERSION}-windows-amd64.exe"
          zip -9 "heros-${VERSION}-windows-arm64.zip" "heros-${VERSION}-windows-arm64.exe"

      - name: Tar Linux binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          tar -czvf "heros-${VERSION}-linux-amd64.tar.gz" "heros-${VERSION}-linux-amd64"
          tar -czvf "heros-${VERSION}-linux-arm64.tar.gz" "heros-${VERSION}-linux-arm64"

      - name: AppImage (x86_64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

          ADIR="Heros.AppDir"
          rm -rf "${ADIR}"
          mkdir -p "${ADIR}/usr/bin"
          cp "dist/heros-${VERSION}-linux-amd64" "${ADIR}/usr/bin/heros"
          chmod +x "${ADIR}/usr/bin/heros"
          install -m0755 packaging/appimage/AppRun "${ADIR}/AppRun"
          install -m0644 packaging/appimage/heros.desktop "${ADIR}/heros.desktop"

          # GitHub-hosted runners often lack FUSE; extract-and-run avoids mounting the appimagetool AppImage.
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "${ADIR}" "dist/heros-${VERSION}-x86_64.AppImage"
          chmod +x "dist/heros-${VERSION}-x86_64.AppImage"

      - name: SHA256 checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          rm -f "heros-${VERSION}-linux-amd64" "heros-${VERSION}-linux-arm64" \
            "heros-${VERSION}-windows-amd64.exe" "heros-${VERSION}-windows-arm64.exe"
          sha256sum heros-${VERSION}-* > "SHA256SUMS-${VERSION}.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
