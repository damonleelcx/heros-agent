name: Release Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - os: macos-14
            goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux desktop build dependencies
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev

      - name: Build desktop binary (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = "dist/heros-desktop-$env:VERSION-$env:GOOS-$env:GOARCH$env:EXT"
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o $out ./cmd/heros-desktop
          Compress-Archive -Force -Path $out -DestinationPath "dist/heros-desktop-$env:VERSION-$env:GOOS-$env:GOARCH.zip"

      - name: Build desktop binary (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/heros-desktop-${VERSION}-${GOOS}-${GOARCH}${EXT}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${out}" ./cmd/heros-desktop
          tar -czf "dist/heros-desktop-${VERSION}-${GOOS}-${GOARCH}.tar.gz" -C dist "$(basename "${out}")"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/heros-desktop-*

  publish-desktop:
    runs-on: ubuntu-latest
    needs: build-desktop
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build desktop checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          rm -f heros-desktop-${VERSION}-*.exe heros-desktop-${VERSION}-linux-amd64 heros-desktop-${VERSION}-darwin-amd64 heros-desktop-${VERSION}-darwin-arm64
          sha256sum heros-desktop-${VERSION}-* > "SHA256SUMS-desktop-${VERSION}.txt"

      - name: Attach desktop assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
